[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autozt"
version = "1.2.0"
description = "Multi-material, multi-step, multi-cluster orchestration for VASP/MACE phonon and force-constant workflows"
readme = "README.en.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "wangchao" }]
keywords = ["phonons", "force constants", "VASP", "MACE", "high-throughput", "workflow", "thermal-conductivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
# 核心 CLI 零第三方依赖（PyYAML 可选，用于读 yaml 配置）
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
mace = ["numpy", "ase", "pymatgen", "phonopy", "phono3py", "mace-torch"]
vasp = ["numpy", "ase", "pymatgen", "phonopy", "phono3py", "spglib"]
hiphive = ["hiphive", "numpy", "ase"]
dev = ["pytest>=7", "ruff", "build"]

[project.scripts]
autozt = "autozt.cli:main"
pa = "autozt.cli:main"   # 兼容旧短名
az = "autozt.cli:main"   # 短命令   # 短命令：等价入口

[project.urls]
Homepage = "https://github.com/Andyw852/AutoZT"
Issues = "https://github.com/Andyw852/AutoZT/issues"

[tool.setuptools]
packages = ["autozt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cluster: needs a real HPC cluster (skipped by default)"]
addopts = "-q -m 'not cluster'"

[tool.ruff]
line-length = 100
