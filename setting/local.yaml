# =====================================================================
# AutoZT 本机执行后端 —— 没有超算/没有 SLURM 时在本机跑（工作站、笔记本、CI）
# 切换：autozt -tt <技能> -p <材料> hpc local -y   （或 autozt -p <材料> hpc local -y）
# =====================================================================
# ssh_host 为空 = 不 ssh，所有"远端"命令在本机 bash 执行。
# 本机找不到 sbatch 时，AutoZT 自动把仓库自带的 tools/fakeslurm 接进 PATH：
#   sbatch 后台起作业（输出 "Submitted batch job N"）、squeue/sacct 查状态、scancel 停止；
#   按 CPU 预算先来先跑：FAKESLURM_MAX_CPUS（缺省=本机核数），状态目录 FAKESLURM_HOME（缺省 ~/.fakeslurm）。
#   AUTOZT_FAKESLURM=0 关闭垫片（用本机真 SLURM），=1 强制使用。
name: local
ssh_host: ""
# 本机计算根：材料步骤目录 = work_dir/<材料相对路径>/<技能>/stepN（可写 ~ 与 $HOME）。
# 本机执行时 work_dir 取第一个【本机可写】的候选：project_setting/setting.yaml > hpc.yaml >
# 本文件 > 项目/技能类型 work_dir；残留的集群路径（/public/...）自动跳过并提示。
work_dir: ~/autozt_local_work
remote_path_prefix: ""       # 可选：本机跑 gen/驱动脚本用的 python 所在 bin 目录（带 numpy/phonopy 等）
# 计算环境：写了就覆盖技能 step.conf 里自带的集群 conda 路径（项目里改过的值仍优先）。
# 两项都留空 ""  = 不激活任何环境，直接用 PATH 里现成的 python（pip/venv 用户最简单）。
conda_sh: ~/miniconda3/etc/profile.d/conda.sh
conda_env: atomate2_p_a
amset_env: ""                # ke/zt 的 AMSET 步：venv 目录或 conda 环境名（留空则这些步 gen 时报错提示）
# ---- 提交模板 ----
# 本机通用模板在 setting/local/templates/（VASP std/gam/ncl、amset、MACE、fc、ShengBTE、hamgnn）。
# 清空集群专用映射：从 jzzn 等切过来时，旧 hpc.yaml 里的 template_map 会把模板
# 指回集群版本（分区/module/路径都是那台机器的）。
template_map: {}
# ---- VASP（VASP 类技能）：可执行文件名或绝对路径；在 PATH 里写名字即可 ----
#   relax_2d：二维变胞优化需要带约束补丁的编译版（ioptcell_tag / lattice_constraints），
#   没有就不写——2D 弛豫步会明确报错，其余步骤照常。
vasp:
  standard:
    cell_constraint: none
    std: vasp_std
    gam: vasp_gam
    ncl: vasp_ncl
potcar_dir: ""               # VASP 赝势库根目录（含 PAW_PBE 等）；VASP 技能必填
mlff_model_dir: ""           # MACE 模型目录（MLFF 技能必填）
