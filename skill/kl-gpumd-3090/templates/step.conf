# =====================================================================
# kl-gpumd-3090 全局 step.conf —— 只放各步【共用】的键
#
# ★ 不要把某一步的参数塞进这份：它会漏进别的步骤，触发
#   "[ERROR] step.conf 的 [params] 里有本脚本不认识的键"。
#   每步自己的参数放各自的 per-step 文件：
#     templates/step1_struct/step.conf   体系 / 元素 / 训练数据目录
#     templates/step2_nep/step.conf      NEP 训练 / 微调
#     templates/step3_kappa/step.conf    MD-κ 协议
#
# 三层合并（越靠后越优先）：
#   skill/kl-gpumd-3090/templates/step.conf                            出厂默认（本文件）
#   <材料>/kl-gpumd-3090/project_setting/templates/step.conf           本材料共用
#   <材料>/kl-gpumd-3090/project_setting/templates/<步骤名>/step.conf  只管该步骤
#
#   看生效值和来源：tf -tt kl-gpumd-3090 -p <材料> -j <步骤> conf
#   改某步参数：    tf -tt kl-gpumd-3090 -p <材料> -j <步骤> conf --set params.KEY=值
# =====================================================================

[params]
# --- GPUMD 可执行（3090 机已编译：~/gpumd/src/{gpumd,nep}）-------------
GPUMD_BIN = /home/<user>/gpumd/src/gpumd
NEP_BIN   = /home/<user>/gpumd/src/nep

# --- 环境 -------------------------------------------------------------
CONDA_SH  = /home/<user>/miniconda3/etc/profile.d/conda.sh
CONDA_ENV = wc                # 需要 ase/numpy/h5py/matplotlib；GPUMD 本身不依赖 python
