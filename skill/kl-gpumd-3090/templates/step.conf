# =====================================================================
# kl-gpumd-3090 全局 step.conf（三层合并：skill → 项目 → 步骤）
#   看生效值：tf -tt kl-gpumd-3090 -p <材料> -j <步骤> conf
#   改：      tf -tt kl-gpumd-3090 -p <材料> -j <步骤> conf --set params.KEY=值
# =====================================================================

[params]
# --- GPUMD 可执行（3090 机已编译：~/gpumd/src/{gpumd,nep}）-------------
GPUMD_BIN = /home/<user>/gpumd/src/gpumd
NEP_BIN   = /home/<user>/gpumd/src/nep

# --- 环境 -------------------------------------------------------------
CONDA_SH  = /home/<user>/miniconda3/etc/profile.d/conda.sh
CONDA_ENV = wc                # 需要 ase/numpy/h5py/matplotlib；GPUMD 本身不依赖 python

# --- 训练数据（VASP OUTCAR 目录）---------------------------------------
# jzzn 上的 312 个 MC-rattle 构型（512 原子，能量+力都在 OUTCAR 里）。
# 建议先在 jzzn 用 tf 把 OUTCAR 转成 extxyz 再回传，只传 xyz（~几百 MB）。
DATA_DIR   = /public/home/<user>/joint_research_project/hyl/Mg4C60/new2/new2/new_mcrattle_structures
DATA_GLOB  = POSCAR-*/OUTCAR
TRAIN_FRAC = 0.9
SPLIT_SEED = 20260925

# --- 体系 -------------------------------------------------------------
# Mg C（元素符号，顺序即 nep.in 的 type 顺序）
ELEMENTS   = Mg C
# 结构来源：relaxed(用材料目录 POSCAR) | dft_ref(用数据里能量最低的参考构型)
STRUCT_SRC = dft_ref

# --- κ 产物名字（S4_plot 用）------------------------------------------
IFC_KAPPA_RTA_DIR =                    # 可选：IFC 路线的 step6_kappa 目录（对比用）
KAPPA_SG_AVG      = 0.455              # 可选：κ_sg 参考（W/mK）
