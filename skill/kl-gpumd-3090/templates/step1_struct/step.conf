# step1_struct 参数（体系 / 数据来源 / κ 对比）。
# 只放本步 gen_step1_struct.py 认识的键。
[params]
# --- 训练数据（VASP OUTCAR 目录；微调 / 从头训练路线需要）--------------
DATA_DIR   = /public/home/<user>/joint_research_project/hyl/Mg4C60/new2/new2/new_mcrattle_structures
DATA_GLOB  = POSCAR-*/OUTCAR
TRAIN_FRAC = 0.9
SPLIT_SEED = 20260925
# 1 = 必须能找到训练数据；0 = 允许没有（走 PRETRAINED_ONLY=1 纯预训练势路线）
REQUIRE_TRAINING_DATA = 1

# --- 体系 -------------------------------------------------------------
# 元素符号，顺序即 nep.in 的 type 顺序
ELEMENTS   = Mg C
# relaxed(用材料目录 POSCAR) | dft_ref(用数据里能量最低的参考构型)
STRUCT_SRC = dft_ref

# --- κ 对比（S4_plot 用）----------------------------------------------
IFC_KAPPA_RTA_DIR =                    # 可选：IFC 路线的 step6_kappa 目录
KAPPA_SG_AVG      = 0.455              # 可选：κ_sg 参考（W/mK）
