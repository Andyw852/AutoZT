# =============================================================================
# skill/opt-mlff-gpu/skill.yaml —— MACE 势结构优化 + 形成能（GPU 版）
#
# 与 opt-mlff-cpu 完全相同的三步骨架，唯一差别是计算资源：
#   S1_relax    MACE 弛豫（ASE + FrechetCellFilter + FixSymmetry），GPU 计算节点作业
#   S2_static   MACE 静态单点：读 S1 的 CONTCAR 取总能 E_tot，GPU 计算节点作业
#   S3_energy   形成能：E_form = E_tot - Σ n_i·μ_i（μ_i 填 step3 的 MU 参数），登录节点
#
# GPU 版跑 3090 GPU 服务器（8×RTX3090，无 SLURM，走 ~/fakeslurm 垫片）：
# DEVICE=cuda、conda 环境 mace-gpu（CUDA 版 torch + mace-torch）。
# 提交模板在 setting/3090/templates/submit_mlff_opt.tpl（--gres=gpu:1 + nvidia-smi/cuda 检查）。
# 引擎与 opt-mlff-cpu 共用：gen 脚本/ mlff_static.py 在本目录，mlff_relax.py /
# mlff_model.py / klmlff_common.py 在 _common/mlff/。
# =============================================================================
schema: 2
name: opt-mlff-gpu
desc: 结构优化(MACE/GPU)
version: "0.1"

template_layout: per_step
template_dir: templates

defaults:
  hpc: "3090"
  skill_subdir: true

fetch_files: [POSCAR, CONTCAR, workflow_method.txt, relax_summary.json,
              static_summary.json, energy_summary.json, submit.sh,
              mlff_relax.log, mlff_static.log, queue.out, queue.err]

steps:
  - {seq: 1, name: step1_mlff_relax, label: S1_relax,
     check: marker, marker: 'relax_summary.json:"converged": true',
     gen: gen_step1_mlff_relax.py,
     gen_need: [dim_common.py, stepconf.py, step.conf, klmlff_common.py, za_2d.py, imag_policy.py,
                mlff_model.py, mlff_relax.py, submit_mlff_opt.tpl],
     fetch_all: true}

  - {seq: 2, name: step2_mlff_static, label: S2_static,
     check: marker, marker: 'static_summary.json:"STATIC_DONE": true',
     gen: gen_step2_mlff_static.py,
     gen_need: [dim_common.py, stepconf.py, step.conf, klmlff_common.py, za_2d.py, imag_policy.py,
                mlff_model.py, mlff_static.py, submit_mlff_opt.tpl],
     fetch_all: true}

  - {seq: 3, name: step3_formation, label: S3_energy, run: gen,
     check: plot, done_marker: energy_summary.json,
     gen: gen_step3_formation.py,
     gen_need: [stepconf.py, step.conf], fetch_all: true}

io_schema:
  inputs: [{name: POSCAR, from: user, required: true, desc: "待优化结构"}, {name: MACE_MODEL, from: config, required: true, desc: "MACE 势模型路径"}]
  outputs: [{name: energy_summary.json, step: S3_energy, type: json, desc: "总能量与形成能汇总"}, {name: CONTCAR, step: S1_relax, type: structure, desc: "优化后结构"}]
  params: [{name: DEVICE, values: [cuda], default: cuda, where: step.conf, desc: "MACE GPU 推理设备"}]
  steps:
    - {step: S1_relax, title: "MACE GPU relax", inputs: [POSCAR, MACE_MODEL], outputs: [CONTCAR, relax_summary.json], validator: "converged marker"}
    - {step: S2_static, title: "Static energy", inputs: [CONTCAR, MACE_MODEL], outputs: [static_summary.json], validator: "STATIC_DONE"}
    - {step: S3_energy, title: "Formation energy", inputs: [static_summary.json], outputs: [energy_summary.json], validator: "marker exists"}
flow:
  summary: "MACE GPU 结构弛豫 → 静态能量 → 形成能后处理"
  stages: [{name: optimization, steps: [S1_relax, S2_static, S3_energy], produces: [energy_summary.json]}]
corrections: [node_fail, dir_missing]
requires:
  python: [mace-torch, torch, ase, numpy]
  conda: mace-gpu
