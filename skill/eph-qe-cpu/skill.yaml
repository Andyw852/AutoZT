schema: 2
name: eph-qe-cpu
desc: QE–Wannier90–Perturbo 电子–声子耦合（CPU）；可选 QE DFPT 谷间散射参数（ivs_dfpt）
version: "0.3"

template_layout: per_step
template_dir: templates

defaults:
  hpc: jzzn
  skill_subdir: true
  # AutoZT's generic hang scanner fingerprints OUTCAR/OSZICAR. QE phonon
  # jobs write ph.out and dyn/dvscf files instead, so the generic recovery
  # would cancel a healthy long DFPT run after seeing a zero fingerprint.
  hang_check: false

submit_required: [submit.sh]
fetch_files: [submit.sh, qe_env.json, scf.in, nscf.in, ph.in, qe2pert.in, pert.in,
              scf.out, nscf.out, ph.out, qe2pert.out, pert.out, wannier.out,
              preflight.ok, scf.ok, wannier.ok, phonon.ok, qe2pert.ok, perturbo.ok,
              eph_summary.json, eph_parameters.json, eph.h5, ephmat,
              ephmat.yml, queue.out, queue.err]

# [0059] 两条链都是开关组（主步骤为空）：
#   perturbo（默认开）：S0–S6 QE–Wannier90–Perturbo 电子–声子矩阵元数据链（原有流程，jzzn 环境）；
#   ivs_dfpt（默认关）：S10–S13 QE DFPT 直接算谷间零阶形变势，给 ke-dft-cpu 的 S8/S8.4 当 IVS 通道。
#   只算 IVS 的材料（如 3090 上的 Si/MoS2）：本材料 tf_*.yaml 写 ivs_dfpt: true、perturbo: false。
steps: []

optional_steps:
  perturbo:
    default: true
    steps:
      - {seq: 0, name: step0_preflight, label: S0_env, check: marker, marker: "preflight.ok:OK",
         gen: gen_step0_preflight.py, done_marker: preflight.ok, fetch_all: true,
         gen_need: [eph_common.py, stepconf.py, step.conf, submit_qe_test.tpl, run_preflight.py]}
      - {seq: 1, name: step1_scf, label: S1_scf, check: marker, marker: "scf.ok:OK", needs: [step0_preflight],
         gen: gen_step1_scf.py, done_marker: scf.ok, fetch_all: true,
         gen_need: [eph_common.py, stepconf.py, step.conf, submit_qe_test.tpl]}
      - {seq: 2, name: step2_wannier, label: S2_wannier, check: marker, marker: "wannier.ok:OK", needs: [step1_scf],
         gen: gen_step2_wannier.py, done_marker: wannier.ok, fetch_all: true,
         gen_need: [eph_common.py, stepconf.py, step.conf, submit_qe_test.tpl]}
      - {seq: 3, name: step3_phonon, label: S3_ph, check: marker, marker: "phonon.ok:OK", needs: [step1_scf],
         gen: gen_step3_phonon.py, done_marker: phonon.ok, fetch_all: true,
         gen_need: [eph_common.py, stepconf.py, step.conf, submit_qe_test.tpl]}
      - {seq: 4, name: step4_qe2pert, label: S4_qe2pert, check: marker, marker: "qe2pert.ok:OK", needs: [step2_wannier, step3_phonon],
         gen: gen_step4_qe2pert.py, done_marker: qe2pert.ok, fetch_all: true,
         gen_need: [eph_common.py, stepconf.py, step.conf, submit_qe_test.tpl]}
      - {seq: 5, name: step5_perturbo, label: S5_ephmat, check: marker, marker: "perturbo.ok:OK", needs: [step4_qe2pert],
         gen: gen_step5_perturbo.py, done_marker: perturbo.ok, fetch_all: true,
         gen_need: [eph_common.py, stepconf.py, step.conf, submit_qe_test.tpl]}
      - {seq: 6, name: step6_summary, label: S6_summary, check: plot, run: gen, needs: [step5_perturbo],
         gen: gen_step6_summary.py, done_marker: eph_summary.json, fetch_all: true,
         gen_need: [eph_common.py]}

  # --- [0059] QE DFPT 谷间散射（方案 docs/PLAN-ivs-dfpt-20261018.md 的 Q1–Q4）------------------------------------
  #   S10_ivsq（Q1，gen，不提交作业）：谷表（2D 读 ke S8.2 的 dpt_result.json；3D 手填 IVS_VALLEYS_E/H）-> 谷对 -> 对称等价类 -> q 作业；
  #   S11_ivsscf（Q2）：环境探针（pw.x/ph.x、AHC 支持、模守恒赝势）+ pw.x SCF（ke S1 的 CONTCAR 原样，不重新弛豫）+ 谷能差自检；
  #   S12_ivsph（Q3，扇出 q-*）：每个 q 一个作业：ph.x 单 q DFPT -> pw.x nscf（初态 k）-> ph.x electron_phonon='ahc'；
  #   S13_ivs（Q4，gen）：ahc_gkk + 动力学矩阵 -> D0、ħω -> dp_optical 星通道 -> ivs_dfpt_params.json（schema ivs_dfpt/1）。
  #   ke-dft-cpu 的 S8/S8.4 push_paths 把本地 result/step13_ivs_read/ivs_dfpt_params.json 推过去，IVS_DFPT=auto 读取。
  #   push_paths（S10）：ke-dft-cpu 的本地 result 推到 ivs_inputs/（本地没有就不推，远端旧的删掉）。
  #   [0059-r3] IVS_ODP=auto（出厂）：S10 在 q 列表末尾加 q=Γ 作业 q-odp，S13 顺带给谷内 ODP（单谷载流子也算；Γ 声学模、
  #   极性模不进通道），ke 的 S8/S8.4 里优先于冻声子与手填。
  #   [0072] IVS_ADP=auto（出厂，三维有反演中心）：S10 再加 6 个小 q 作业 q-adp1..6，S13 拟合谷内声学形变势张量（"adp" 块），
  #   ke 的 S8 用 ADP_DFPT 替换非简并带边的 AMSET 形变势（Li et al. PRB 104, 195201 (2021)）。
  ivs_dfpt:
    default: false
    steps:
      - {seq: 10, name: step10_ivs_qlist, label: S10_ivsq, check: plot, run: gen, done_marker: ivs_qlist.json,
         gen: gen_step10_ivs_qlist.py, fetch_all: true,
         gen_need: [ivs_qe_common.py, ivs_dfpt.py, eph_common.py, stepconf.py, step.conf],
         push_paths: [{from: ke-dft-cpu/result/step1_opt/CONTCAR, to: ivs_inputs/CONTCAR},
                      {from: ke-dft-cpu/result/step1_opt/workflow_method.txt, to: ivs_inputs/workflow_method.txt},
                      {from: ke-dft-cpu/result/step8.2_dpt/dpt_result.json, to: ivs_inputs/dpt_result.json}]}
      - {seq: 11, name: step11_ivs_scf, label: S11_ivsscf, check: marker, marker: "ivs_scf.ok:OK",
         needs: [step10_ivs_qlist], gen: gen_step11_ivs_scf.py, done_marker: ivs_scf.ok, fetch_all: true,
         fetch_exclude: ["tmp", "tmp_valley", "pseudo"],
         gen_need: [ivs_qe_common.py, ivs_dfpt.py, eph_common.py, stepconf.py, step.conf, ivs_qe_job.py, submit_ivs_qe.tpl]}
      - {seq: 12, name: step12_ivs_ph, label: S12_ivsph, check: marker, marker: "ivs_ph.ok:OK", fanout: "q-*",
         needs: [step10_ivs_qlist, step11_ivs_scf], gen: gen_step12_ivs_ph.py, fetch_all: true,
         fetch_exclude: ["tmp", "pseudo"],
         gen_need: [ivs_qe_common.py, ivs_dfpt.py, eph_common.py, stepconf.py, step.conf, ivs_qe_job.py, submit_ivs_qe.tpl]}
      - {seq: 13, name: step13_ivs_read, label: S13_ivs, check: plot, run: gen, done_marker: ivs_dfpt_params.json,
         needs: [step12_ivs_ph], gen: gen_step13_ivs_read.py, fetch_all: true,
         gen_need: [ivs_qe_common.py, ivs_dfpt.py, eph_common.py, stepconf.py, step.conf]}

requires:
  # [0059] 两条链都要的只有 pw.x/ph.x；Wannier90/Perturbo 只给 perturbo 组（S0_env 探针仍按全套严格把关），
  #   放 optional_exe：只算 ivs_dfpt 的机器（如 3090）不会因为没装 Perturbo 被 start 前的依赖检查拦下。
  exe: [pw.x, ph.x]
  optional_exe: [wannier90.x, pw2wannier90.x, qe2pert.x, perturbo.x]
  notes: "perturbo 组：Perturbo 3.0.0 must be compiled against its compatible QE build and linked with HDF5. ivs_dfpt 组：QE >= 6.7 (electron_phonon='ahc') + norm-conserving UPF."

io_schema:
  inputs:
    - {name: POSCAR, from: user, required: true, type: structure, desc: "VASP 5 体相 POSCAR；支持多元素、Direct/Cartesian 和 Selective dynamics。"}
    - {name: PSEUDO_FILES, from: PSEUDO_DIR, required: true, type: UPF, desc: "step.conf 中按元素映射的 UPF 文件，例如 C:C.upf Si:Si.upf。"}
  outputs:
    - {name: eph.h5, step: S4_qe2pert, type: hdf5, desc: "QE/Wannier90 转换后的稳定命名 Perturbo 电子–声子数据。"}
    - {name: ephmat, step: S5_ephmat, type: binary, desc: "Perturbo 生成的电子–声子矩阵元。"}
    - {name: ephmat.yml, step: S5_ephmat, type: yaml, desc: "Perturbo 电子–声子矩阵元摘要。"}
    - {name: eph_summary.json, step: S6_summary, type: json, desc: "端到端工件与运行日志的可追溯摘要。"}
    - {name: ivs_qlist.json, step: S10_ivsq, type: json, desc: "[0059] 谷表、对称等价谷对与 q 作业清单。"}
    - {name: ivs_dfpt_params.json, step: S13_ivs, type: json, consumers: [ke-dft-cpu], desc: "[0059] DFPT 谷间零阶形变势与声子能量（schema ivs_dfpt/1），ke-dft-cpu S8/S8.4 的 IVS_DFPT 读取。"}
  params:
    - {name: QE_BIN, default: "$PATH", where: job environment, desc: "包含 pw.x、ph.x、pw2wannier90.x 的目录或 PATH。"}
    - {name: PERTURBO_BIN, default: "$PATH", where: job environment, desc: "包含 qe2pert.x、perturbo.x 的目录或 PATH。"}
    - {name: WANNIER_BIN, default: "$PATH", where: job environment, desc: "包含 wannier90.x 的目录或 PATH。"}
    - {name: PSEUDO_DIR, where: job environment, desc: "包含项目 manifest 所列 UPF 文件的目录。"}
    - {name: QE_PREFIX, default: auto, where: step.conf, desc: "QE/Wannier90/Perturbo 前缀；auto 对 Si2 保留 si，其他结构按化学式生成。"}
    - {name: PSEUDO_FILES, default: auto, where: step.conf, desc: "Element:file 映射；auto 使用 Element.upf，生产计算建议显式指定。"}
    - {name: ATOMIC_MASSES, default: auto, where: step.conf, desc: "Element:mass 映射；auto 使用标准原子质量，同位素计算必须显式指定。"}
    - {name: WANNIER_PROJECTIONS, default: auto, where: step.conf, desc: "Element:projection 映射；Si2 auto 为 Si:sp3，其他体系需显式给出合理投影。"}
    - {name: ECUTWFC, default: 40.0, where: step.conf, desc: "QE 波函数截断能 (Ry)；官方 epr9=40。"}
    - {name: ECUTRHO, default: 320.0, where: step.conf, desc: "QE 电荷密度截断能 (Ry)。"}
    - {name: SCF_CONV_THR, default: 1.0e-10, where: step.conf, desc: "QE SCF 收敛阈值；官方 epr9=1e-15。"}
    - {name: NSCF_CONV_THR, default: 1.0e-10, where: step.conf, desc: "QE NSCF 收敛阈值；官方 epr9=3e-12。"}
    - {name: TR2_PH, default: 1.0e-14, where: step.conf, desc: "QE DFPT 收敛阈值；官方 epr9=1e-17。"}
    - {name: SCF_KGRID, default: "4 4 4", where: step.conf, desc: "SCF 自动 k 网格。"}
    - {name: NSCF_KGRID, default: "4 4 4", where: step.conf, desc: "NSCF/Wannier90 显式 k 网格。"}
    - {name: PH_QGRID, default: "2 2 2", where: step.conf, desc: "DFPT q 网格。"}
    - {name: PH_KGRID, default: "4 4 4", where: step.conf, desc: "DFPT 内层电子 k 网格。"}
    - {name: Q2PERT_KGRID, default: "4 4 4", where: step.conf, desc: "qe2pert 读取的 DFT k 网格，必须与 NSCF_KGRID 一致。"}
    - {name: PH_SEARCH_SYM, default: "false", where: step.conf, desc: "ph.x 的 q 点对称性搜索开关。"}
    - {name: PH_EPSIL, default: true, where: step.conf, desc: "ph.x 是否计算介电响应；极性体系需结合 NAC 设置验证。"}
    - {name: PH_LQDIR, default: true, where: step.conf, desc: "ph.x 是否按 q 目录写出 DFPT 数据。"}
    - {name: NUM_BANDS, default: 16, where: step.conf, desc: "QE/Wannier 电子带数；可升到 24/32 做能窗收敛。"}
    - {name: NUM_WANN, default: 8, where: step.conf, desc: "Wannier 函数数。"}
    - {name: DFT_BAND_MIN, default: 1, where: step.conf, desc: "qe2pert 使用的 DFT 起始带。"}
    - {name: DFT_BAND_MAX, default: 0, where: step.conf, desc: "qe2pert 使用的 DFT 终止带；0 表示 NUM_BANDS。"}
    - {name: DIS_NUM_ITER, default: 500, where: step.conf, desc: "Wannier 解缠最大迭代次数。"}
    - {name: DIS_WIN_MIN, default: -100.0, where: step.conf, desc: "Wannier 外能窗下界 (eV)。"}
    - {name: DIS_WIN_MAX, default: 17.2, where: step.conf, desc: "Wannier 外能窗上界 (eV)。"}
    - {name: DIS_FROZ_MIN, default: -100.0, where: step.conf, desc: "Wannier 冻结窗下界 (eV)。"}
    - {name: DIS_FROZ_MAX, default: 9.0, where: step.conf, desc: "Wannier 冻结窗上界 (eV)。"}
    - {name: WANNIER_NUM_ITER, default: 10000, where: step.conf, desc: "Wannier 最大最小化迭代。"}
    - {name: OCCUPATIONS, default: fixed, where: step.conf, desc: "QE occupations；固定为官方 Si，smearing 用于展宽扫描。"}
    - {name: SMEARING, default: gauss, where: step.conf, desc: "QE 展宽类型。"}
    - {name: DEGAUSS, default: 0.02, where: step.conf, desc: "QE 电子展宽 (Ry)，仅 OCCUPATIONS 非 fixed 时生效。"}
    - {name: PERT_LIST_MODE, values: [gamma, grid, official], default: gamma, where: step.conf, desc: "Perturbo k/q 点：单 Gamma、均匀网格或官方 epr9 随机 25 点。"}
    - {name: PERT_KGRID, default: "1 1 1", where: step.conf, desc: "Perturbo k 网格（PERT_LIST_MODE=grid）。"}
    - {name: PERT_QGRID, default: "1 1 1", where: step.conf, desc: "Perturbo q 网格（PERT_LIST_MODE=grid）。"}
    - {name: PERT_BAND_MIN, default: 1, where: step.conf, desc: "Perturbo ephmat 起始带。"}
    - {name: PERT_BAND_MAX, default: 1, where: step.conf, desc: "Perturbo ephmat 终止带。"}
    - {name: PHFREQ_CUTOFF, default: 1.0, where: step.conf, desc: "Perturbo 声子频率 cutoff (meV)。"}
    - {name: PERT_DELTA_SMEAR, default: 10.0, where: step.conf, desc: "Perturbo delta 函数展宽 (meV)，用于展宽敏感性扫描。"}
    - {name: IVS_VALLEYS_E, default: "", where: step.conf, desc: "[0059] 手填电子谷表（2D 不写读 ke S8.2；3D 必填，每星一个成员即可）。"}
    - {name: IVS_ECUTWFC, default: 60.0, where: step.conf, desc: "[0059] QE 截断能 (Ry)，模守恒赝势。"}
    - {name: IVS_NP, default: 4, where: step.conf, desc: "[0059] S11/S12 每个作业的 MPI 进程数。"}
    - {name: QE_BIN, default: "", where: "setting/<集群>.yaml qe_bin", desc: "[0059] pw.x/ph.x 所在目录。"}
    - {name: QE_PSEUDO_DIR, default: "", where: "setting/<集群>.yaml qe_pseudo_dir", desc: "[0059] 模守恒 UPF 目录。"}
  steps:
    - {step: S0_env, title: "Environment preflight", tool: shell, outputs: [qe_env.json], validator: "all required executables and manifest-listed UPF files found"}
    - {step: S1_scf, title: "QE SCF", tool: pw.x, inputs: [POSCAR], outputs: [scf.ok], validator: "JOB DONE"}
    - {step: S2_wannier, title: "QE NSCF and Wannier", tool: "pw.x + wannier90.x + pw2wannier90.x", outputs: [wannier.ok], validator: "Wannier workflow exits zero"}
    - {step: S3_ph, title: "DFPT phonons", tool: ph.x, outputs: [phonon.ok], validator: "configured PH_QGRID exits zero and save/<prefix>.dyn0 matches it"}
    - {step: S4_qe2pert, title: "QE to Perturbo", tool: qe2pert.x, outputs: [eph.h5], validator: "stable eph.h5 alias exists"}
    - {step: S5_ephmat, title: "Interpolated e-ph matrix element", tool: perturbo.x, outputs: [perturbo.ok], validator: "Perturbo ephmat exits zero"}
    - {step: S6_summary, title: "Summarize", tool: Python, outputs: [eph_summary.json], validator: "JSON exists"}
    - {step: S10_ivsq, title: "Intervalley q list", tool: Python, outputs: [ivs_qlist.json], validator: "JSON exists"}
    - {step: S11_ivsscf, title: "QE SCF + valley check", tool: pw.x, outputs: [ivs_scf.ok], validator: "valley dE within tolerance"}
    - {step: S12_ivsph, title: "Single-q DFPT + AHC matrix elements", tool: "ph.x + pw.x", outputs: [ivs_ph.ok], validator: "ahc_gkk size matches"}
    - {step: S13_ivs, title: "Intervalley deformation potentials", tool: Python, outputs: [ivs_dfpt_params.json], validator: "JSON exists"}

flow:
  summary: "QE SCF → NSCF/Wannier90 与 DFPT → qe2pert HDF5 → Perturbo e-ph matrix element"
  stages:
    - {name: environment, steps: [S0_env], produces: [qe_env.json]}
    - {name: QE, steps: [S1_scf, S2_wannier, S3_ph], produces: [scf.ok, wannier.ok, phonon.ok]}
    - {name: coupling, steps: [S4_qe2pert, S5_ephmat, S6_summary], produces: [eph.h5, ephmat, ephmat.yml, eph_summary.json]}
    - {name: intervalley, steps: [S10_ivsq, S11_ivsscf, S12_ivsph, S13_ivs], produces: [ivs_qlist.json, ivs_dfpt_params.json]}
  requires: {environment: "compatible QE, Wannier90, Perturbo and HDF5 installation"}
corrections: [node_fail, dir_missing]
