# eph-qe-cpu 参数（技能出厂默认；项目级 templates/step.conf 可覆盖）
#
# 官方 Perturbo 3.0.0 Si epr9 档：
#   ECUTWFC=40, SCF_KGRID=12 12 12, NSCF_KGRID=2 2 2,
#   PH_QGRID=2 2 2, PH_KGRID=6 6 6, Q2PERT_KGRID=2 2 2,
#   NUM_BANDS=16, NUM_WANN=8, DIS_NUM_ITER=500,
#   DIS_WIN=[-100,17.2], DIS_FROZ=[-100,9], NUM_ITER=10000,
#   PERT_LIST_MODE=official.
# 默认值刻意保持当前 4^3/2^3/单 Gamma 冒烟测试兼容。

[params]
QE_PREFIX = auto
PSEUDO_FILES = auto
ATOMIC_MASSES = auto
WANNIER_PROJECTIONS = auto
ECUTWFC = 40.0
ECUTRHO = 320.0
SCF_CONV_THR = 1.0e-10
NSCF_CONV_THR = 1.0e-10
TR2_PH = 1.0e-14
SCF_KGRID = 4 4 4
NSCF_KGRID = 4 4 4
PH_QGRID = 2 2 2
PH_KGRID = 4 4 4
Q2PERT_KGRID = 4 4 4
PH_SEARCH_SYM = false
PH_EPSIL = true
PH_LQDIR = true

NUM_BANDS = 16
NUM_WANN = 8
DFT_BAND_MIN = 1
DFT_BAND_MAX = 0
DIS_NUM_ITER = 500
DIS_WIN_MIN = -100.0
DIS_WIN_MAX = 17.2
DIS_FROZ_MIN = -100.0
DIS_FROZ_MAX = 9.0
WANNIER_NUM_ITER = 10000

# Si 官方档使用 fixed；展宽扫描项目可写 OCCUPATIONS=smearing。
OCCUPATIONS = fixed
SMEARING = gauss
DEGAUSS = 0.02

PERT_LIST_MODE = gamma
PERT_KGRID = 1 1 1
PERT_QGRID = 1 1 1
PERT_BAND_MIN = 1
PERT_BAND_MAX = 1
PHFREQ_CUTOFF = 1.0
PERT_DELTA_SMEAR = 10.0

# ---------------------------------------------------------------------------
# [0059] 可选组 ivs_dfpt（S10_ivsq / S11_ivsscf / S12_ivsph / S13_ivs）：QE DFPT 直接算谷间零阶形变势，
#   结果 step13_ivs_read/ivs_dfpt_params.json 给 ke-dft-cpu 的 S8（3D）/ S8.4（2D）当 IVS 通道（IVS_DFPT=auto）。
#   开：本材料 tf_*.yaml 写 ivs_dfpt: true；只算 IVS、不跑 Perturbo 链的材料再写 perturbo: false。详见 README。
#   QE 路径：setting/<集群>.yaml 写 qe_bin / qe_pseudo_dir / qe_setup（autozt 注入下面三个键；项目层可覆盖）。
# ---------------------------------------------------------------------------
QE_BIN =
QE_PSEUDO_DIR =
QE_SETUP =
# 结构：auto = ke-dft-cpu S1 的 CONTCAR（autozt 从本地 result 推到 ivs_inputs/），没有就用材料 POSCAR 并告警；ke | poscar
IVS_STRUCTURE = auto
IVS_DIM = auto
# 载流子：auto = 谷表里多谷的载流子都算；electron | hole | both
IVS_CARRIERS = auto
# 手填谷表（与 ke 的 DP_OPTICAL_VALLEYS_E/H 同写法；每个星写一个成员即可，按晶体对称性补全）。
#   2D 不写 = 读 ke-dft-cpu S8.2 的 dpt_result.json；3D 必须写，如 Si 电子：IVS_VALLEYS_E = X:0,0.425,0.425
IVS_VALLEYS_E =
IVS_VALLEYS_H =
# 模守恒赝势（AHC 不支持 USPP/PAW）：Element:file；auto = 沿用上面的 PSEUDO_FILES，再缺省 Element.upf
IVS_PSEUDO_FILES = auto
# QE 泛函：auto = 按 ke S1 的 FUNC（pbesol -> pbesol，pbe/pbe-d3 -> pbe）；none = 赝势自带；或直接写 input_dft
IVS_INPUT_DFT = auto
IVS_ECUTWFC = 60.0
# 0 = 4 × IVS_ECUTWFC
IVS_ECUTRHO = 0
# SCF/DFPT k 网格：auto 按 IVS_KSPACING（Å⁻¹，VASP KSPACING 口径，2D 的 c 向固定 1）；或写 "n1 n2 n3"
IVS_KSPACING = 0.2
IVS_SCF_KGRID = auto
IVS_SCF_CONV_THR = 1.0e-12
IVS_TR2_PH = 1.0e-16
# AHC 窗口：带边上下各几条带（初态简并组必须落在里面）；nscf 的 nbnd = nocc + IVS_AHC_NB + IVS_NBND_EXTRA
#   [0059-r3] S12 按 S11 的谷能带自动放宽带边简并多于它的那个 q（Si 空穴 Γ 三重简并 -> 3），别的 q 不变
IVS_AHC_NB = 2
IVS_NBND_EXTRA = 6
# S11 自检：各谷相对能差与 S8.2 相差多少以内算一致（meV）；error = 超出就让作业失败，warn = 只告警
IVS_VALLEY_TOL_MEV = 30.0
IVS_VALLEY_CHECK = error
IVS_SYMPREC = 0.01
# 每个作业的 MPI 进程数（S12 每个 q 一个作业）；IVS_SBATCH 额外 #SBATCH 行（分号分隔）；IVS_MPIRUN auto | none | 自定义（{np}）
IVS_NP = 4
IVS_SBATCH =
IVS_MPIRUN = auto
# [0059-r3] 谷内 ODP：auto/on = 在 q 列表末尾固定加 q=Γ（作业 q-odp），用同一套 AHC 顺带算每个谷的谷内光学形变势
#   （ke-dft-cpu S8/S8.4 里优先于冻声子与手填）；单谷载流子（如 Si 空穴 Γ，3D 要手填 IVS_VALLEYS_H = G:0,0,0）也算。
#   q=Γ 的 3 个声学模不进通道。off = 只算谷间 IVS（单谷载流子跳过）
IVS_ODP = auto
# 极性（红外活性）模：exclude（出厂，与冻声子 ODP_POLAR 同口径，长程耦合由 POP 管）= q-odp 的 DFPT 加 epsil 算 Born 有效
#   电荷、模有效电荷 > IVS_ODP_POLAR_TOL（e；2D 看面内）的模不进谷内通道（单元素体系按非极性，不加 epsil）；
#   include = 极性模的短程形变势也算（不加 epsil）
IVS_ODP_POLAR = exclude
IVS_ODP_POLAR_TOL = 0.1
# S12 跑完是否保留 tmp/（dvscf 与波函数，体积大）
IVS_KEEP_TMP = false
