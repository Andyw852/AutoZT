# =====================================================================
# defect-dft-cpu step.conf —— 步骤参数（出厂默认）
# 项目级覆盖：<材料>/defect-dft-cpu/project_setting/templates/step.conf
# =====================================================================
[params]
# 泛函：pbe-d3 = PBE + DFT-D3(BJ)（几何步同款）；本技能全部步骤共用
FUNC = pbe-d3

# 平面波截断（eV）。S1/S2/S3/凸包参考相/目标相必须同一 ENCUT 才能相减
# （形成能 E_def-E_bulk 要求同参数）。参考相 INCAR 现在也从这里取 ENCUT（不再写死）。
# 370仅为历史示例值，不保证任何材料收敛；Mg4C60当前使用600并仍需收敛验证，
# 提高时 S0 参考相会跟着一起变（同一 step.conf）。
# band 与缺陷参考必须核对泛函/PAW/ENCUT及势零点；势对齐不能修复参数不一致。
# 2026-09-15：这里不能写 "auto"——VASP 6.4.3 会 IERR=5 直接 REFUSE。
ENCUT = 370

# 相对于输入 POSCAR 的重复倍数；默认不扩胞，避免大晶胞被意外再扩9倍。
# Mg4C60 的128原子输入先用1 1 1初筛；小原胞需显式选择尺寸并做有限尺寸收敛。
# 历史 A2B2Te5 的81原子方案：9原子输入显式设3 3 1。
SUPERCELL = 1 1 1

# 超胞自洽 k 网格（Gamma 中心）
KMESH = 2 2 1

# 元素 PAW 变体（VASP 推荐主族重元素含 d 半芯态：Pb_d/Sn_d）
POTCAR_VARIANT = Pb:Pb_d, Sn:Sn_d, Sb:Sb, Bi:Bi_d, Te:Te

# POTCAR 库根目录 + 凸包参考相共享目录 由集群配置自动注入（setting/<hpc>.yaml 的
# potcar_dir / references_dir），切超算自动跟着走，勿在此硬编码。
# 若要在单个材料/项目里覆盖，写在 project_setting/templates/step.conf（优先级最高）。

# 带电态 SCF 是否存 LOCPOT（FNV/eFNV 静电势对齐用）：1=开
LVHAR_CHARGED = 1

# band 技能的 band_summary.json 路径（E_gap/VBM/CBM 自动拉取）。
# 留空则按材料名自动探测 joint_research_project/huang/<材料>/POSCAR_B/...；也可手动指定。
BAND_SUMMARY =

# 静态介电常数（Makov-Payne 图像电荷修正用；文献值，DFPT 介电张量是更准来源）
EPSILON = 100.0

# 带边有效质量（m_e 单位）；band.dat 拟合失败（如能带反转非抛物线）时回退此默认
MSTAR_E = 0.2
MSTAR_H = 0.2

# ============ 通用化参数（20260923）====================================
# 下面这些让技能不再局限于层状 A2B2Te5，任意结构都能用。
# 对称性不等价位：auto = spglib -> pymatgen；无可靠后端则报错，不用元素/z伪去重
SYMMODE = auto
SYMPREC = 1e-3
# 缺陷类型（逗号分隔）：vacancy / antisite / pair / interstitial
DEFECT_TYPES = vacancy,antisite,pair,interstitial
# 只生成"与这些元素相关"的缺陷（留空 = 全部元素）：
#   空位 = 宿主元素命中；反位 = 宿主或替换者任一命中；间隙 = 插入元素命中。
# 例：Mg4C60 只算 Mg 相关写 DEFECT_SPECIES = Mg
#     （得到 v_Mg + Mg_C/C_Mg + Mg_i；不再需要把反位对写死）
DEFECT_SPECIES =
# 反位白名单替换对，例如 C-Mg,Mg-C（留空 = 全部非同种替换）
ANTISITE_PAIRS =
# 每元素尝试的原始网格种子数；随后按空间群去重，实际数量可更少；不是完整间隙搜索
N_INTERSTITIALS = 2
# 元素角色：只有 >=2 个 CATIONS 才会生成互占位对(pair)。
# A2B2Te5 请写：CATIONS = Pb,Sn,Sb,Bi ； ANIONS = Te,Se
CATIONS =
ANIONS =
# 电荷态：window = QMIN..QMAX 全给（推荐，正确性优先）；valence = 按角色单边（省算力）
CHARGE_MODE = window
QMIN = -2
QMAX = 2
# 非零电荷默认各自弛豫；vertical仅用于明确标记的垂直单点，不当热力学稳定态。
CHARGED_GEOMETRY = relax
CHARGED_NSW = 60
CHARGED_EDIFFG = -0.02
# 显式金属项目设1并设QMIN=QMAX=0；留空由带隙信息判定。
IS_METAL =
# 自旋/SOC：轻元素或金属体系建议 SOC = 0（共线，MAGMOM 1 分量，更快更稳）
SOC = 1
ISPIN = 1
# VASP 并行
NCORE = 6
KPAR = 4
