# references.conf —— 凸包参考相计算参数（INI 格式，可选）
#
# section 名 = <refdir>/<相目录名>；[default] 对所有相生效。
# 键：ismear / sigma / kmesh / kmesh_length / kind
#   kmesh 优先于 kmesh_length；都没有就用内置自动估算 n_i = max(1, round(60/|a_i|))。
# 自动默认 ISMEAR：全金属元素相 1/SIGMA=0.1，其余 0/SIGMA=0.05。
#
# 本文件内置 A2B2Te5 流水线的历史参数 —— 通用化后旧项目结果保持不变。
# 新材料请在 [default] 或按相名追加；目录名不符时用内置自动值（务必检查收敛）。

[Pb_fcc]
ismear = 1
sigma = 0.10
kmesh = 16 16 16
kind = 金属

[Sn_beta]
ismear = 1
sigma = 0.10
kmesh = 12 12 12
kind = 金属

[Sb_rhombo]
ismear = 0
sigma = 0.05
kmesh = 12 12 12
kind = 半金属

[SnSb]
ismear = 0
sigma = 0.05
kmesh = 12 12 12
kind = 半金属

[Bi_rhombo]
ismear = 0
sigma = 0.05
kmesh = 12 12 12
kind = 半金属

[Te_trig]
ismear = 0
sigma = 0.05
kmesh = 12 12 12
kind = 半导体

[PbTe_rs]
ismear = 0
sigma = 0.05
kmesh = 12 12 12
kind = 半导体

[SnTe_rs]
ismear = 0
sigma = 0.05
kmesh = 12 12 12
kind = 半导体

[Sb2Te3]
ismear = 0
sigma = 0.05
kmesh = 8 8 2
kind = 半导体

[Bi2Te3]
ismear = 0
sigma = 0.05
kmesh = 8 8 2
kind = 半导体

[Si_diamond]
ismear = 0
sigma = 0.05
kmesh = 12 12 12
kind = 半导体

