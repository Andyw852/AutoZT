# step3_fc —— 拟合力常数（共享 fit-fc-thermal 引擎：phono3py/pheasy/hiphive）。
# 参数面 = fit-fc-thermal step1_fit 的参数面（FIT_ENGINE/FIT_METHODS/PHEASY_* 等），
# 加上本技能独有键 NAC_BORN。计算节点跑 fc_fit_driver.py prep|fit|post。
[params]
# [0019] 默认 pheasy + ALASSO（与 fit-fc-thermal / kl-dft-cpu 一致；2D 自动加 RASR=BHH）。
#   pheasy 只有 GPU 版：作业走 submit_fcfit_pheasy_gpu.tpl（GPU 分区 + gres）。没有 GPU 的集群
#   改 FIT_ENGINE = phono3py（symfc，纯 CPU），或在 setting/<集群>/templates/ 放本集群能跑的
#   submit_fcfit_pheasy_gpu.tpl。FC2_SUPERCELL（独立二阶超胞）pheasy 不支持，用它时改 phono3py。
FIT_ENGINE = pheasy     # pheasy | phono3py | hiphive
PHEASY_FIT_METHOD = ALASSO   # ALASSO | LASSO | RFE-OLS | RFE-OLS-TSQR | OLS | RIDGE | ARDR | RVM
FC_CALC    = symfc      # phono3py 后端：symfc（对称性约束，默认）| alm
NAC_BORN   =            # 极性材料填 DFPT 的 BORN 路径（MACE 给不出 Born 电荷），例如：
                        #   /public/home/<user>/<材料>/kl-dft-cpu/step3_nac/BORN
