# step4_kappa 参数（BTE 求解）。
[params]
KAPPA_2D_THICKNESS = vdw    # 2D 层厚：vdw=原子z跨度+两侧vdW半径（照文献口径，勿写死；超晶格在项目 step.conf 锁 6.73）
MESH_OVERRIDE =          # 空 = 用 step2 写进 klmace_params 的 MESH
MESH_SCAN     =          # 默认单网格；收敛测试时显式填写多套网格
                         # DFT 路线做不起、审稿人又必问的一条，在这条链上几乎白送
T_MIN         = 100
T_MAX         = 800
T_STEP        = 100
ISOTOPE       = true     # 同位素散射（自然丰度）
BTE           = rta      # rta = --br（默认）；lbte = --lbte 直接解，内存 O(N_mode^2)
EXTRA_ARGS    =          # 原样附加给 phono3py-load，如 "--boundary-mfp 1e6"

# ---- 求解器：phono3py（默认）| shengbte（三声子 BTE，3090 可用 GPU 版加速）----
SOLVER        = phono3py
# shengbte 专属（phono3py 忽略）
SCALEBROAD    = 1.0      # shengbte 高斯展宽系数（=ShengBTE 默认；0.1 更快但会漏过程）
# SHENGBTE_EXE 按集群填绝对路径：
#   jzzn = /public/home/wangchao/software/sousaw-shengbte-aocl/ShengBTE
#   3090 = /home/wangchaoyue852/software/taskflow/shengbte-gpu/ShengBTE（GPU fork）
SHENGBTE_EXE  = ShengBTE

# ---- ShengBTE 的 MPI/OMP 布局（只对 CPU 模板 setting/jzzn/templates/submit_shengbte_klm.tpl 生效）----
# ShengBTE 靠 **MPI 按 q 点并行**：模板里写死 --ntasks-per-node=1 会让
# $SLURM_NTASKS=1，mpirun -n 1 = 单进程 = 串行 —— 日志自报
# "running on 1 MPI process(es)"，然后长时间停在 "about to obtain the spectrum"
# 不出任何产物（实测 11.8 h 零产物）。正确布局 = 一个 MPI rank 占一个 NUMA 域：
#     NTASKS = TOTAL_CORES / CORES_PER_NUMA ，CPUS_PER_TASK = CORES_PER_NUMA
# jzzn 的 NUMA 域是 **8 核**（192 核 = 24 域 x 8，不是 16）：96 核 -> 12 rank x 8 线程
#     （实测谱计算 230 秒完成）。
# 换集群改这两个值即可，模板不用动；想直接钉死 rank 数就写 SHENGBTE_NTASKS 整数。
SHENGBTE_TOTAL_CORES    = 96
SHENGBTE_CORES_PER_NUMA = 8
# SHENGBTE_NTASKS = 12

[submit]
# nodes           = 1
# ntasks_per_node = 48
# time            = 24:00:00
