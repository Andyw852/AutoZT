[params]
FUNC        = auto
SUPERCELL   =            # 显式 "3 3 3"；空=按 MIN_SC_LEN 自动。2D 真空方向压 1
MIN_SC_LEN  = 12.0       # 超胞每个非真空方向最小胞长(Å)
MAX_MULTIPLE= 6
FD_DISTANCE = 0.01       # phonopy 2 阶有限位移幅度(Å)
PHONON_MESH = 20 20 20   # q 网格（写进 kl_params 供 step3；2D 自动 kz=1）
KSPACING    = 0.03       # 超胞取力 K 点间距
MAX_DISP    = 200        # 位移帧数硬闸

# --- 取力精度（2026-09-27 对齐 kl-dft-cpu S4；力直接进 fc2，别降）---
# phonopy 官方超胞取力示例口径：PREC=Accurate / EDIFF=1E-8 / LREAL=.FALSE.。
# LREAL=Auto 的实空间投影带格点噪声，是 fc 假软模的常见来源；超胞几百原子时可换
# Auto，但必须先在 3 帧上与 .FALSE. 比力（最大偏差 < 1 meV/Å）并显式设 ROPT。
FORCE_PREC  = Accurate
FORCE_EDIFF = 1E-8
FORCE_LREAL = .FALSE.

# --- 2D 残余面内应力门禁（层内口径 σ_VASP×h⊥/d，kbar）。0 = 关掉门禁 ---
STRESS_2D_THR = 0.5

# --- 帧间一致性硬闸：已有 disp-* 必须与当前计划同胞同网格；off = 跳过（排查用）---
FRAME_GATE = on

# --- 结构体检第五条（对齐 kl-dft-cpu S4）：S1 弛豫后 symprec 1e-5/1e-4 空间群不一致
#   => 数值微畸变；本步 gen 在 relay S1 CONTCAR 之后调用 kl_common.symmetry_gate 审计。
#   默认 SYMMETRY_AUDIT=warn + SYMMETRY_SYMMETRIZE=on：检出微畸变即就地对称化（2D 的
#   ZA 假软模根因之一）。微畸变能量差远低于容差，默认 SYMMETRY_ALLOW_PENDING=true
#   免单点直接对称化（标 fit_for_use=false）。要严格确认能量就设 ALLOW_PENDING=false
#   并给 SYMMETRY_ENERGY_BEFORE/AFTER。默认值在 kl_common.SYMMETRY_SPEC，无需写这里。
# SYMMETRY_AUDIT          = warn   # off | warn | error
# SYMMETRY_SYMMETRIZE     = on     # off | on
# SYMMETRY_ALLOW_PENDING  = true
