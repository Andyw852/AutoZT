# step2_nac 参数（LEPSILON DFPT 介电/Born，可选步组 nac，默认开）。
#   金属/无极性体系：在项目配置写 nac: false 关掉整步（autozt 就不注入 step2_nac）。
#   2D 极性材料：phonopy 只有 3D NAC 方案，对真 2D 是近似，建议 nac: false（脚本会提示）。
[params]
FUNC     = auto    # auto=继承 step1 的 workflow_method.txt
KSPACING = 0.03

# --- 结构体检第五条（对齐 kl-dft-cpu）：S1 弛豫后 symprec 1e-5/1e-4 空间群不一致 => 数值微畸变，
#   gen 在 relay S1 CONTCAR 之后调用 kl_common.symmetry_gate 审计，默认 warn + 检出即对称化。
#   默认值在 kl_common.SYMMETRY_SPEC，无需写这里；要覆盖再取消注释。
# SYMMETRY_AUDIT          = warn
# SYMMETRY_SYMMETRIZE     = on
# SYMMETRY_ALLOW_PENDING  = true
