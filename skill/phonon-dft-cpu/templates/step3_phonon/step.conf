[params]
# 声子稳定性判据（唯一真源 skill/_common/imag_policy.py，2026-09-27 对齐 kl-dft-cpu S5）
# 判据：近 Γ 区 |q|_frac < IMAG_QGAMMA（严格小于；声学支有效窗口 ×IMAG_QGAMMA_GRACE）；
#   声学支=每 q 点前 3 支；|ν|≤IMAG_THR_STRICT→noise/pass；近 Γ 声学且 |ν|>IMAG_THR→fail；
#   区外/光学且 |ν|>IMAG_THR_STRICT→fail。整体取最坏。
# ★ IMAG_THR 语义是「近 Γ 声学支上限」，不是全局阈值（2026-09-22 用户统一到 0.10）。
IMAG_THR          = 0.10
IMAG_THR_STRICT   = 0.10
IMAG_QGAMMA       = 0.05
IMAG_QGAMMA_GRACE = 1.2
BAND_POINTS       = 51
# 2D ZA 弯曲支二次性检查（ω∝q^p，要求 1.7<p<2.3）：auto = 2D 打开；
#   只看最小频率不够 —— ZA 线性化时频率全正、照样过虚频闸，但 2D 结论是错的。
ZA_CHECK          = auto
ZA_QMAX           = 0.05
