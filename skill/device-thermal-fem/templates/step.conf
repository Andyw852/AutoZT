# =============================================================================
# device-thermal-fem 技能默认参数（三层合并：本文件 -> 项目 templates/ -> 项目 step.conf）
# 改参数：autozt -tt device-thermal-fem -p <材料> -j <步骤> conf --set params.KEY=值
# 注意：本文件是"共享模板"（template_layout: shared），不要写 STEP=。
#
# 本技能不重复定义器件：几何/热源/边界/材料全部复用 device-thermal 的
#   step1_device_spec/device_spec.json 与 step2_props/thermal_props.json
# =============================================================================
[params]
# ---- 后端选择 ----
FEM_BACKEND               = skfem    # skfem(开源, pip 可装, 默认) | comsol(需授权, 接口已留)

# ---- 输入定位 ----
# 空 = 自动在 <材料>/device-thermal/{stepdir, result/stepdir}/ 找；
# 也可指向一个含 device_spec.json / thermal_props.json 的目录
# FEM_FROM_DEVICE_THERMAL_DIR = /path/to/<材料>/device-thermal

# ---- 网格（S1 定义，S2 可覆盖）----
FEM_INTERFACE_LAYER_FRAC  = 1e-3     # 界面等效薄层厚度 / 氧化层厚度（热阻恒为 1/G）
FEM_NX                    = 60       # 沿沟道 x 的单元数
FEM_N_CHANNEL             = 8        # 沟道层 y 向单元数
FEM_N_INTERFACE           = 4        # 界面薄层 y 向单元数
FEM_N_OXIDE               = 200      # 氧化层 y 向单元数

# ---- S2 求解 ----
FEM_DO_1D_CHECK           = true     # 额外解一个"侧壁绝热"算例，用解析 1D 严格解校验后端

# ---- S3 交叉验证容差与开关 ----
FEM_MESH_CHECK            = true     # 是否做网格收敛扫描（30/60/120/240）
FEM_1D_TOL                = 0.01     # 后端 vs 解析 1D 允许相对差
FEM_POWER_TOL             = 0.02     # 源功率审计允许相对差（实际注入 vs Q*L）
FEM_FVM_TOL               = 0.05     # 与 device-thermal 二维 FVM 的允许相对差
FEM_MESH_TOL              = 0.01     # 网格收敛允许相对差

# ---- COMSOL 后端（FEM_BACKEND=comsol 时才用；接口已留，未启用）----
# 详见 backend_comsol.py 顶部：装软件 -> 配 license -> 设下面两项 -> 选 mph 或 batch
# COMSOL_BIN              = ~/software/AutoZT/comsol/bin/comsol
# COMSOL_LICENSE_FILE     = ~/software/AutoZT/comsol/license/license.dat
# COMSOL_CORES            = 4
