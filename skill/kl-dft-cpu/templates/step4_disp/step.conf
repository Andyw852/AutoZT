# step4_disp 参数（超胞 + 位移，扇出）。
#   METHOD=alm      随机位移（默认）。帧数 N = max(10, ceil(Σnfree/(3·N_sc)) × OVERSAMPLE)，
#                   位移由 hiPhive MC-rattle 生成（高斯幅度 + d_min 保护 + rattle_std 标定）
#   METHOD=findiff  phono3py 对称有限位移。三阶全对称集在大超胞下轻易上万帧，
#                   本步生成前先数帧、超 MAX_DISP 直接报错停步（不落盘）
[params]
FUNC        = pbesol
METHOD      = alm        # alm | findiff
MAX_DISP    = 500        # ★ 位移帧数硬闸：超过就报错停步（正常应 ≤ 几百帧）
MIN_SC_LEN  = 12.0       # 超胞每个非真空方向最小胞长(Å)
MAX_MULTIPLE= 6
SUPERCELL   =            # 显式 "3 3 3"；空=自动。2D 会把真空方向压 1
# BTE q 网格（写进 kl_params 供 step6；2D 自动 kz=1）。
#   auto = 2D 按倒空间长度估：N_i = max(MESH_MIN, ceil(Q_LEN_2D/|a_i|))（P1-1）。
#   15 15 15 对 a≈3 Å 的 2D 材料只覆盖 ~47 Å 倒空间，κ 远没收敛；pheasy 的 WS2 算例
#   用的是 90×90×1。实测 a=3.16 Å + Q_LEN_2D=275 → 87 87 1。
KAPPA_MESH  = auto
Q_LEN_2D    = 275.0      # auto 时的目标倒空间长度(Å)，文献 2D 起步值 250~300
MESH_MIN    = 20         # auto 时每方向下限（BZ 采样下限）
KSPACING    = 0.03
# --- 取力精度（P1-3；力直接进 fc2/fc3，别降）---
FORCE_PREC  = Accurate   # phonopy 官方超胞取力示例口径
FORCE_EDIFF = 1E-8       # 原为 1E-7（与模板注释不符，已对齐）
FORCE_LREAL = .FALSE.    # 倒空间投影，力无格点噪声；原为 Auto。超胞几百原子时可换 Auto，
                         # 但必须先在 3 帧上与 .FALSE. 比力（最大偏差 <1 meV/Å）并设 ROPT
# --- findiff 专属 ---
FC3_CUTOFF_PAIR =        # 三阶对距离上限(Å)；空=全对称集(最准最贵)。大超胞务必设 4~6 控制帧数
FD_DISTANCE = 0.03       # 有限位移幅度(Å)
# --- alm 专属 ---
OVERSAMPLE  = 3          # 过采样系数（帧数公式里的 ×3）
ALM_CUT2    =            # 二阶截断(Å)，空=不截断
ALM_CUT3    = 6.0        # 三阶截断(Å)。帧数超闸时先调小这个
# --- MC-rattle（alm 位移生成）---
DISP_RMS      = 0.03     # 目标位移模长 RMS(Å)（每分量 RMS≈0.0173）
MC_DMIN_SCALE = 0.75     # MC 最小间距 d_min = 平衡最近邻 × 此系数
MC_NITER      = 10       # MC 迭代数（实际位移 ∝ √n_iter，脚本内自动标定 rattle_std）
MC_SEED       = 2025