# step4_disp 参数（超胞 + 位移，扇出）。
#   METHOD=alm      随机位移（默认）。帧数 N = max(10, ceil(Σnfree/(3·N_sc)) × OVERSAMPLE)，
#                   位移由 hiPhive MC-rattle 生成（高斯幅度 + d_min 保护 + rattle_std 标定）
#   METHOD=findiff  phono3py 对称有限位移。三阶全对称集在大超胞下轻易上万帧，
#                   本步生成前先数帧、超 MAX_DISP 直接报错停步（不落盘）
[params]
FUNC        = auto      # ★ 同 S2/S3：auto=继承 step1 的 workflow_method.txt（review 二.1）
METHOD      = alm        # alm | findiff
MAX_DISP    = 500        # ★ 位移帧数硬闸：超过就报错停步（正常应 ≤ 几百帧）
MIN_SC_LEN  = 12.0       # 超胞每个非真空方向最小胞长(Å)
MAX_MULTIPLE= 6
SUPERCELL   =            # 显式 "3 3 3"；空=自动。2D 会把真空方向压 1
# BTE q 网格（写进 kl_params 供 step6；2D 自动 kz=1）。
#   auto = 2D 按倒空间长度估：N_i = max(MESH_MIN, ceil(Q_LEN_2D/|a_i|))（P1-1）。
#   15 15 15 对 a≈3 Å 的 2D 材料只覆盖 ~47 Å 倒空间，κ 远没收敛；pheasy 的 WS2 算例
#   用的是 90×90×1。实测 a=3.16 Å + Q_LEN_2D=275 → 87 87 1。
KAPPA_MESH  = auto
Q_LEN_2D    = 275.0      # auto 时的目标倒空间长度(Å)，文献 2D 起步值 250~300
MESH_MIN    = 20         # auto 时每方向下限（BZ 采样下限）
KSPACING    = 0.03
# --- 取力精度（P1-3；力直接进 fc2/fc3，别降）---
FORCE_PREC  = Accurate   # phonopy 官方超胞取力示例口径
FORCE_EDIFF = 1E-8       # 原为 1E-7（与模板注释不符，已对齐）
FORCE_LREAL = .FALSE.    # 倒空间投影，力无格点噪声；原为 Auto。超胞几百原子时可换 Auto，
                         # 但必须先在 3 帧上与 .FALSE. 比力（最大偏差 <1 meV/Å）并设 ROPT
# --- findiff 专属 ---
FC3_CUTOFF_PAIR =        # 三阶对距离上限(Å)；空=全对称集(最准最贵)。大超胞务必设 4~6 控制帧数
FD_DISTANCE = 0.03       # 有限位移幅度(Å)
# --- alm 专属 ---
OVERSAMPLE  = 3          # 过采样系数（帧数公式里的 ×3）
ALM_CUT2    =            # 二阶截断(Å)，空=不截断
ALM_CUT3    = 6.0        # 三阶截断(Å)。帧数超闸时先调小这个
# --- 三阶截断候选（2026-09-24 user 定）：相邻壳层中点，S5 逐个拟合后自动选 ---
#   auto = 按 POSCAR 壳层自动取（不含壳层距离本身；两壳太近（< CUT3_MIN_GAP）跳过，
#          避免 WS₂ 的 6.34/6.36 Å 这种 0.02 Å 双壳）。也可显式写 "3.6 4.2 4.8 ..."。
#   S4 按【最大候选】估帧/定超胞，候选列表记进 disp_plan.json 供 S5/S6 用。
CUT3_CANDIDATES   = auto   # auto | off | "3.6 4.2 4.8 5.3 5.9 6.6"
CUT3_MAX          = 7.0    # 自动找壳层的最大半径(Å)
CUT3_MIN_SHELLS   = 2      # 从第几近邻壳层起取中点（1=含最近邻）
CUT3_GAP_TOL      = 0.05   # 壳层聚类容差(Å)
CUT3_MIN_GAP      = 0.05   # 相邻壳层小于此间距则不取中点（防双壳）
# --- MC-rattle（alm 位移生成）---
DISP_RMS      = 0.03     # 目标位移模长 RMS(Å)（每分量 RMS≈0.0173）
MC_DMIN_SCALE = 0.75     # MC 最小间距 d_min = 平衡最近邻 × 此系数
MC_NITER      = 10       # MC 迭代数（实际位移 ∝ √n_iter，脚本内自动标定 rattle_std）
MC_SEED       = 2025
# --- 取力 INCAR 基准对照（2026-09-18）---
#   INCAR_BENCH=on 时，除正常生产 disp-* 外，额外在 step4_disp/bench/<variant>/
#   disp-XXXXX 生成 7 变体 × INCAR_BENCH_FRAMES 帧（同一批位移，直接 copy 生产 POSCAR），
#   比较 {LREAL=.FALSE./Auto}×{ADDGRID 不加/.TRUE.} 与 ENCUT 1.5×/2.0×/650 的力一致性。
#   参考设置（baseline）默认取"精度最高"：LREAL=.FALSE.+ADDGRID=.TRUE. 中 ENCUT 最大。
#   判据（2026-09-19 改为相对量）：|ΔF|_rms / |F|_rms < 1%（--threshold-rel）；
#   绝对 max|ΔF| < 0.5 meV/Å 保留为可选（--threshold）。report 每帧含 RMS|ΔF|、
#   OUTCAR Total CPU time、节点名（jzzn 用 sacct/squeue -o %N，scontrol NodeList 为 null）。
#   隔离：bench/ 不在生产 fanout（"disp-*" 非递归）与 S5 帧校验内，默认 off 不改变现有行为。
#   提交/分析（登录节点）：python incar_bench.py submit / nodes / analyze
INCAR_BENCH   = off
INCAR_BENCH_FRAMES = 2

# --- 结构体检第五条（B，2026-09-20）：S1 弛豫后 symprec 1e-5 / 1e-4 空间群不一致
#   => 数值微畸变；本步 gen 在 relay S1 CONTCAR 之后调用 kl_common.symmetry_gate 审计。
#   默认 SYMMETRY_AUDIT=warn + SYMMETRY_SYMMETRIZE=on：检出微畸变即就地对称化。
#   微畸变（symprec 1e-5/1e-4 空间群不一致）能量差远低于容差，默认
#   SYMMETRY_ALLOW_PENDING=true 免单点直接对称化（标 fit_for_use=false）。
#   要严格确认②（能量）就设 SYMMETRY_ALLOW_PENDING=false 并给 SYMMETRY_ENERGY_BEFORE/AFTER。
#   注意：只能写在本步的 step.conf（别写进全局 templates/step.conf，会漏进别的步骤）。
# SYMMETRY_AUDIT          = warn   # off | warn | error
# SYMMETRY_SYMMETRIZE     = off    # off | on
# SYMMETRY_AUDIT_SYMPREC  = 1e-4
# SYMMETRY_ENERGY_TOL_MEV = 1.0
# SYMMETRY_ENERGY_BEFORE  =        # 对称化前单点 OUTCAR 路径
# SYMMETRY_ENERGY_AFTER   =        # 对称化后单点 OUTCAR 路径
# SYMMETRY_ALLOW_PENDING  = false
