# step6_kappa 参数（BTE 求解晶格热导率，计算节点）。
# 只放本步 gen_step6_kappa.py 认识的键；FUNC 由全局 step.conf 带入，这里不重复。
[params]
# 热导率计算软件：phono3py（默认）| shengbte | fourphonon
#   phono3py/fourphonon 读 step5_fc/phono3py/（fc2/fc3 hdf5 由 S5 拟合导出）；
#   shengbte 读 step5_fc/shengbte/（需 S5 的 EXPORT_SHENGBTE=true）。
#   fourphonon = ShengBTE 同源引擎（四声子增强版），这里跑其 3ph RTA（four_phonon=F，
#   不需 fc4，输入与 shengbte 相同）。GPU 机器可多卡加速（FOURPHONON_NGPU）；CPU-only
#   机器请用 shengbte（fourphonon CPU 枚举慢、AOCC 版易卡死，见 README）。
SOLVER = phono3py

# phono3py 的 BTE 解法：rta(--br，弛豫时间近似，便宜) | lbte(--lbte，直接解，更准更贵)
BTE_METHOD = rta

# BTE q 网格覆盖。留空 = 用 step4 写进 kl_params.txt 的 KAPPA_MESH（2D 真空方向已压 1）。
# MESH_OVERRIDE =

# q 网格收敛扫描（P1-1，仅 phono3py 支持多套）：
#   auto 默认：2D 展开三档、3D 单套。κ 的网格收敛性没法从单次结果看出来，而 2D 的
#        ZA 支在 Γ 附近发散最慢、最需要这个判据，所以 2D 默认开、3D 不变（不动 3D 成本）。
#   ""   显式只跑一套（3D 默认行为；2D 想省钱也可以这么设）
#   on   强制三档：N / ceil(1.25N) / ceil(1.5625N)，以 kl_params 的网格为锚点
#   "a b c; d e f" 显式多套
#   判据：同解法相邻档 300K 面内 κ 相对变化 < 5%，结果写进 kappa_summary.json 的
#   mesh_convergence（max_rel_change_pct / converged_5pct）；不收敛会打 [WARN]。
#   ★ 代价：三档 = 3 次完整 κ 求解。gen 会把本次总次数显式打出来。
MESH_SCAN = auto
# auto 时加密档的每方向下限（BZ 采样下限）
MESH_MIN  = 20

# RTA vs 完整解对照（P1-2）：在最细那档网格上再跑一次另一解法，比值写进
#   kappa_summary.json 的 rta_over_full（ratio<1 = RTA 低估；<0.9 会打 [WARN]）。
#   on  = 强制跑对照；off = 不跑；auto = 不跑，但在 2D 下打 [WARN] 提示。
#   ★ 实测代价（2026-09-16，Mo2S3 2D，32×32×1）：RTA 三档合计 ~5 分钟，
#     LBTE 同网格 >50 分钟仍未结束（碰撞矩阵按 (nq×nb×3)² 稠密 dsyev 逐温度对角化，
#     慢 1~2 个数量级）。因此 auto 不再自动开启——一个默认选项静默吃掉几十倍机时不合适。
#     文档"2D 正规过程主导、RTA 会低估 κ"的结论仍然成立，要对照请手动设 on。
COMPARE_LBTE = auto

# 温度扫描 (K)
T_MIN  = 100
T_MAX  = 800
T_STEP = 100

# 同位素散射（phono3py --isotope / ShengBTE autoisotopes）
ISOTOPE = True

# shengbte/fourphonon 展宽系数（scalebroad=1.0 为 ShengBTE 默认；更小更快但会漏过程）
#   生产默认 1.0：2D 声子谱在 Γ 附近极密，0.1 的窄展宽会在细网格上漏掉散射过程，
#   文献里 2D GaN 明确要求 scalebroad > 0.1。做对照时再降到 0.1 看差异是否可控。
SCALEBROAD = 1.0
# ShengBTE 可执行文件（按集群填绝对路径）
# SHENGBTE_EXE = /public/home/wangchao/software/sousaw-shengbte-aocl/ShengBTE

# ---- ShengBTE 的 MPI/OMP 布局（换集群要改的就是这两个数）----
# ShengBTE 靠 **MPI 按 q 点并行**：mpirun -n 1 等于串行，日志会自报
# "running on 1 MPI process(es)"，然后长时间停在 "about to obtain the spectrum"
# 不出任何产物（实测 11.8 h 零产物）。正确布局 = 一个 MPI rank 占一个 NUMA 域：
#     NTASKS = TOTAL_CORES / CORES_PER_NUMA ，CPUS_PER_TASK = CORES_PER_NUMA
# jzzn 的 NUMA 域是 **8 核**（192 核 = 24 域 x 8，不是 16！）：
#     96 核 -> 12 rank x 8 线程（实测谱计算 230 秒完成）
# hanhai25 等其它集群请按 lscpu 的 NUMA 拓扑改这两个值。
SHENGBTE_TOTAL_CORES    = 96
SHENGBTE_CORES_PER_NUMA = 8

# ---- phono3py 的单节点并行（**OpenMP-only，别用 mpirun**）----
# 本环境的 phono3py 只链 libgomp、无 mpi4py/MPI（实测 phono3py 3.24.0），所以：
#   1) 不能用 mpirun —— 那会启动 N 个各自算全量的进程，互相覆盖输出文件；
#   2) 单节点唯一有效的并行 = 「1 进程 × N 个 OMP 线程」，
#      提交脚本会申请 --ntasks=1 --cpus-per-task=N（N 就是下面这个值）。
# N 建议 = 节点物理核数（jzzn 192 逻辑核 = 96 物理核）。改这一个数即可。
P3PY_OMP_THREADS = 96
# 想直接钉死 rank 数就写整数，默认 auto（按上面两个数算）
# SHENGBTE_NTASKS = 12
# fourphonon 可执行文件（multi-GPU 版，按机器填；3090 例：）
#   /home/wangchaoyue852/software/taskflow/fourphonon-v13-test/ShengBTE_gpu_multigpu_test
# FOURPHONON_EXE =
# fourphonon 用几张 GPU（rank 数=卡数；运行时自动按 rank 分卡，≤ 机器卡数）
FOURPHONON_NGPU = 4
# fourphonon 每张 GPU 配几个 CPU 核（SLURM cpus-per-task + OMP_NUM_THREADS）。
#   枚举段是 CPU 密集且吃内存带宽，多核能加速枚举、缩短 GPU 点火前等待；3090 建议 8/卡。
FOURPHONON_CPUS_PER_GPU = 8

# 2D 厚度归一化：phono3py/ShengBTE 都用含真空的胞体积做分母，面内 kappa 被胞高稀释，
#   需乘 h⊥/d（h⊥=V/A 周期性胞高，不是 |c|；d = 层有效厚度）。
#   vdw = 原子层跨度（按真空隙切口展开）+ 两侧 vdW 半径 | cell = 用 h⊥（不归一）| 数值 = 固定 A
#   口径真源：skill/_common/thickness_2d.py（ke-dft-cpu 的 AMSET 步读同一份，保证 zT 里
#   σ 与 κ_L 的厚度口径一致、d 能约掉）。三种路（phono3py/shengbte/fourphonon）都归一化。
KAPPA_2D_THICKNESS = vdw

# 2D 的 NAC：auto = 2D 默认不用 3D-NAC（LO-TO 在严格 2D 应趋零）；on = 强制用；off = 强制不用
KAPPA_NAC = auto