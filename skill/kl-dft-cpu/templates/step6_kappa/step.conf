# step6_kappa —— BTE 晶格热导率（共享 fit-fc-thermal 引擎：phono3py 三声子 BTE）。
# 参数面 = fit-fc-thermal step2_kappa 的参数面（MESH/MESH_CONV*/T_*/ISOTOPE/NAC/BTE_METHOD）。
[params]
MESH       = auto      # auto=按倒格矢自动定网格并做 q 网格收敛（推荐）；"n n n" 固定不做收敛
T_MIN      = 100
T_MAX      = 800
T_STEP     = 100
ISOTOPE    = true      # 同位素散射（自然丰度）
BTE_METHOD = rta       # rta（默认）| lbte（直接解，内存 O(N_mode^2)）
NAC        = auto      # auto=有 BORN 且非 2D 才开（2D 不加 3D-NAC）；on/off 强制
SUPERCELL_SYMMETRY = strict  # 超胞须保原胞全部点群操作：strict 停 | warn 告警 | off
# 逐档截断 κ 扫描 + 三判据选截断（需要 S5 用 CUT3_SCAN=auto 拟出 cutoff_scan/cut3_<tag>/）
CUT3_CV_1SE_MULT   = 1.0       # 判据①：1-SE 规则的 SE 倍数
CUT3_PICK          = smallest  # 在 κ 连续稳定区间内取：smallest=最小 | largest=最大（区间后的跳变不采用）
