# step2_static 参数（原胞静态自洽）。改：tf -tt kl-dft-cpu -p <材料> -j step2_static conf --set params.KSPACING=0.025
[params]
FUNC     = auto          # ★ 必须 auto：继承 step1 的 workflow_method.txt。写死 pbesol 会短路
#                          auto 继承路径 —— S1 按键网络选成 pbe-d3 时，S2 仍用 pbesol，
#                          平衡帧出现残余力、fc2 出假软模，且完全静默（review 二.1）。
KSPACING = 0.03          # 静态密网格

# --- 结构体检第五条（B，2026-09-20）：S1 弛豫后 symprec 1e-5 / 1e-4 空间群不一致
#   => 数值微畸变；本步 gen 在 relay S1 CONTCAR 之后调用 kl_common.symmetry_gate 审计。
#   默认 SYMMETRY_AUDIT=warn + SYMMETRY_SYMMETRIZE=on：检出微畸变即就地对称化。
#   微畸变（symprec 1e-5/1e-4 空间群不一致）能量差远低于容差，默认
#   SYMMETRY_ALLOW_PENDING=true 免单点直接对称化（标 fit_for_use=false）。
#   要严格确认②（能量）就设 SYMMETRY_ALLOW_PENDING=false 并给 SYMMETRY_ENERGY_BEFORE/AFTER。
#   注意：只能写在本步的 step.conf（别写进全局 templates/step.conf，会漏进别的步骤）。
# SYMMETRY_AUDIT          = warn   # off | warn | error
# SYMMETRY_SYMMETRIZE     = off    # off | on
# SYMMETRY_AUDIT_SYMPREC  = 1e-4
# SYMMETRY_ENERGY_TOL_MEV = 1.0
# SYMMETRY_ENERGY_BEFORE  =        # 对称化前单点 OUTCAR 路径
# SYMMETRY_ENERGY_AFTER   =        # 对称化后单点 OUTCAR 路径
# SYMMETRY_ALLOW_PENDING  = false

[submit]
# nodes = 1              # 需要就取消注释覆盖 submit.sh 的 #SBATCH
