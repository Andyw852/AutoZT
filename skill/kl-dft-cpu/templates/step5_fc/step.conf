# step5_fc 参数（力常数拟合 + 双格式导出 + 虚频闸；提交计算节点）。
# 这一步现在是【提交作业】：gen 写 submit.sh + fit_config.json，计算节点跑拟合。
# 拟合作业资源（核数/qos/时长）用 [submit] 段覆盖 #SBATCH，见文末示例。
[params]

# ===== 拟合器 =====
# auto     : 按维度选（默认）—— 2D 用 pheasy、3D 用 phono3py。理由：RASR（旋转不变性）
#            只能在 pheasy 的 -c（零空间构造）步施加（与后面用 OLS/RFE/LASSO 无关），
#            而 2D 不加 RASR 时 ZA 弯曲支会在 Γ 附近线性化（ω∝q 而非 q²），
#            虚频闸照样过、κ 却整体失真。3D 不需要，保持 symfc（快且稳）。
# phono3py : phono3py + symfc/alm 最小二乘（findiff/alm 都支持）
# pheasy   : pheasy 压缩感知（LASSO/RFE/OLS），仅随机位移（step4 METHOD=alm）
FIT_ENGINE = auto

# ---- phono3py 路 ----
FC_CALC    = symfc          # symfc | alm
FC3_CUTOFF = 6            # fc3 截断 A；留空或 None = 不截断

# ---- pheasy 路（FIT_ENGINE=pheasy 时生效）----
# auto = 2D LASSO / 3D RFE。★ 与 RASR 无关：RASR 在 pheasy 的 -c 步写进零空间，
#   OLS/RFE/LASSO 都能带它，前提只是引擎为 pheasy（auto 已保证）。
#   LASSO 需要 --std + 去偏才能达到 RFE/OLS 的精度（对照实验：RFE/OLS 本就贴近参考值，
#   LASSO 开 --std+去偏后 −0.13%）——这两项已写死在 submit_fit_pheasy.tpl 里。
PHEASY_FIT_METHOD = auto    # auto | LASSO | RFE(内存友好) | OLS(最吃内存)
PHEASY_C3_CUTOFF  = 6     # pheasy fc3 截断 A；None = 不截断
PHEASY_ENABLE_FC  = 3       # 拟合最高阶：热导率需 >=3
NULL_SPACE_EPS    = 0.001
# RASR = 旋转不变性(Born-Huang) + 平衡条件(Huang/零应力)，在 pheasy 的 -c 步施加。
#   auto = 2D 用 BHH、3D 不加（文献结论：这两个条件对体材料可忽略，对 2D 是硬要求 ——
#   不加则 ZA 弯曲支近 Γ 线性化甚至出虚频，虚频闸未必拦得住，但 κ 是错的）。
#   强制值：BHH | BH | H | none（none = 不施加）。作业会校验 -c 日志，没生效就失败。
PHEASY_RASR       = auto

# ===== 缺帧容错 =====
# 位移单点难免挂几帧（节点故障 / 被抢占）。随机位移（step4 METHOD=alm）是回归拟合，
# 少几帧不影响，prep 会跳过缺帧继续；有限位移（findiff）靠对称有限差分重建，
# 缺任一帧都不行，仍然会报错要求补算。
# 平衡帧 disp-00000（未位移完美超胞）任何时候都不能缺 —— 逐帧扣它的残余力。
MIN_SUCCESS_RATIO  = 0.9    # 成功帧占比下限，低于它报错（0 = 不限）
MIN_SUCCESS_FRAMES = 0      # 成功帧绝对下限，0 = 不限

# ===== 双格式导出 =====
# true：任一拟合器都把 fc2/fc3 额外导成 ShengBTE 力常数（放 step5_fc/shengbte/）。
#   需要 hiphive；CONTROL 由 S6 按运行参数生成。false = 只出 phono3py 格式。
EXPORT_SHENGBTE = true

# ===== 虚频闸（唯一真源：skill/_common/imag_policy.py，2026-09-22 统一）=====
# 判据：
#   近 Γ 区：|q|_frac < IMAG_QGAMMA（**严格小于**）；
#            |q|_frac = 分数坐标向量【去掉真空轴分量】后的欧氏范数（3D 用全部三个分量）
#   声学支  ：每个 q 点的**前 3 支**（下标 0/1/2）
#   对每个负频 (q, 支) 取 |ν|，按顺序归类：
#     1) |ν| ≤ IMAG_THR_STRICT                        → noise（不计入，verdict 仍 pass）
#     2) 近 Γ + 声学支 + |ν| ≤ IMAG_THR               → near_gamma_acoustic → warn（S6 放行）
#     3) 近 Γ + 声学支 + |ν| > IMAG_THR               → near_gamma_large  → fail
#     4) 近 Γ 区外 或 光学支，且 |ν| > IMAG_THR_STRICT → off_gamma / optical → fail
#   整体 verdict 取最坏一档；最终 stability_verdict = imag verdict 与 ZA 结论中更坏者
#   （排序 pass < warn < needs_review < fail）。warn / needs_review 都放行 S6。
# 依据：
#   Petretto et al., Sci. Data 5, 180065 (2018)   → 近 Γ 窗口 0<|q|<0.05、失稳标记 5 cm^-1
#   Lin, Poncé, Marzari, npj Comput. Mater. 8, 236 (2022) → 远离 Γ 的虚频是真失稳特征
# ★ IMAG_THR 语义已变：从"全局阈值"改为"**近 Γ 声学支上限**"（默认 0.10 THz；2026-09-22 用户统一）。
# ★ IMAG_THR_STRICT（0.10 THz）是数值噪声底，也是近 Γ 区外与光学支的上限；2026-09-22 与 IMAG_THR 统一。
BAND_POINTS = 51
IMAG_THR        = 0.10      # 近 Γ 声学支上限(THz)；2026-09-22 用户统一到 0.10（< −0.10 判不稳定）
IMAG_THR_STRICT = 0.10      # 噪声底；2026-09-22 用户统一到 0.10（< −0.10 判不稳定）
IMAG_QGAMMA     = 0.05      # 近 Γ 半径（分数坐标，Petretto 2018；严格小于）
# ★ grace：**声学支的有效近 Γ 窗口 = IMAG_QGAMMA × IMAG_QGAMMA_GRACE**。
#   动机（2026-09-22 用户批准）：同一条近 Γ 软模跨越 0.05 边界时不该被升格为 fail ——
#   实测未对称化 MoS₂ 的 ZA 软模在 |q|∈(0,0.061) 为负，101 点路径上有一个点落在 |q|=0.0519
#   （ν=−0.0503，只超窗口 3.8%），按严格口径会把整体从 warn 升成 fail。
#   设 1.0 = 退回 §二 的严格口径（Petretto 窗口）；光学支不受本参数影响。
IMAG_QGAMMA_GRACE = 1.2
# P2-2：2D 的 ZA 弯曲支二次性检查（ω ∝ q^p，两个不等价面内方向都要 1.7<p<2.3）。
#   auto = 2D 打开。只看最小频率不够：ZA 被线性化时频率全是正的，虚频闸门照样过，
#   但 q² 支的群速度 ∝ q，κ 会整体错。不满足判据 → step5 判不稳定、S6 不启动。
ZA_CHECK    = auto
# ZA_QMAX 与 IMAG_QGAMMA 的关系：**单位相同**（都是原胞倒格基的分数坐标），但物理含义不同 ——
#   ZA_QMAX 是 ZA 幂律拟合的【取样上限】，IMAG_QGAMMA 是【近 Γ 邻域】的半径。
#   两者**不合并**成一个参数（合并后调一个会静默改变另一个的含义）。
ZA_QMAX     = 0.05          # ZA 拟合 q 上限（分数坐标）；太小主要反映插值误差

# ===== 资源覆盖示例（按体系放开）=====
