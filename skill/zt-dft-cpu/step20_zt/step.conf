# step20_zt 的步骤级默认参数（skill 侧；项目可覆盖）
# 改：autozt -tt zt-dft-cpu -p <材料> -j S20_zt conf --set params.KTEMP_MODE=const300
[params]
# κ_L 取值方式：
#   interp   = 把 κ_L(T) 线性插值到电子段的温度网格（默认，物理上最合理；不外推）
#   const300 = 所有温度都用 300 K 的 κ_L（与 ke 的 step8.3 对比表口径一致，便于交叉核对）
KTEMP_MODE = interp
# KTEMP_MODE=const300 时用哪个温度取 κ_L
KL_CONST_T = 300
# [0047] zT(n,T) 热图（zt_heatmap.png）的色标上限（ZT）：所有材料默认用同一把尺子，
#   这样不同材料的图颜色可以直接横向比较（同色 = 同 ZT）。
#   想换统一上限（例如材料普遍 ZT<0.5，用 0.3 对比度更好）：
#     autozt -tt zt-dft-cpu -p <材料> -j S20_zt conf --set params.ZT_CMAP_VMAX=0.3
#   想退回「每个材料各自取最大值」的旧行为（图不可横向比色）：
#     autozt -tt zt-dft-cpu -p <材料> -j S20_zt conf --set params.ZT_CMAP_VMAX=auto
ZT_CMAP_VMAX = 0.3
