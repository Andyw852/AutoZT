# =====================================================================
# step.conf —— zt-dft-cpu 全局层（skill 出厂默认）
#
# ★ 这份是【两段链路共用】的全局层，所以只放【两段都认识的键】：
#     BANDGAP —— tf 驱动层保留键（RESERVED_PARAMS），只决定 ke 段增删 HSE 步组，
#                 kl 段的脚本不会因它报"不认识的键"。
#     FUNC    —— ke 段全局步默认 pbesol；kl 段全局默认是 auto（取 step1 继承值）。
#                本技能统一写 pbesol：kl 段的 step1_std_opt 也用 pbesol 弛豫，
#                它写进 workflow_method.txt 的 FUNC 就是 pbesol，于是 kl 段
#                step2/4 取到的东西与"auto"完全一致（不会改变 kl 段的行为）。
#   ⚠ 绝不要把某一段的【步骤专属】参数（NWORKERS / METHOD / SOLVER / MESH…）
#     写进这份全局：tf 会把全局层合并进【每一个】步骤，别的段的 gen 脚本会
#     因"不认识的键"直接 SystemExit（ke 的历史教训，见 ke-dft-cpu/step.conf）。
#     步骤专属参数写在各自的步骤级文件里（kl 段是符号链接到 kl 的 per-step conf）。
#
# 三层合并，越靠后越优先：
#   skill/zt-dft-cpu/step.conf                              出厂默认（本文件）
#   <材料>/zt-dft-cpu/project_setting/templates/step.conf   本材料共用
#   <材料>/zt-dft-cpu/project_setting/templates/<步骤>/step.conf  只管该步骤
#
# 看生效值与来源：autozt -tt zt-dft-cpu -p <材料> -j <步骤> conf
# 改某步参数：    autozt -tt zt-dft-cpu -p <材料> -j <步骤> conf --set params.KEY=值
# =====================================================================

[params]
# 带隙层级（只影响 ke 电子段的步组增删）：
#   pbe = 只算到 PBE 带隙（跳到 PBE 画图收工）
#   hse = 继续算 HSE 带隙（默认；ZT 对带隙敏感，建议保留）
BANDGAP = hse
# 交换关联泛函（两段共用；决定 INCAR 的 GGA/IVDW）：
#   pbesol   PBEsol（默认）  |  pbe-d3   PBE+DFT-D3(BJ)  |  pbe  纯 PBE
FUNC = pbesol
