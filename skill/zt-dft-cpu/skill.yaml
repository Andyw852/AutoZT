# =============================================================================
# skill/zt-dft-cpu/skill.yaml —— 热电优值 ZT = S²σT / (κ_e + κ_L)（组合技能）
#
# ★ 装配方式（2026-10 起）：本技能【只有一个步骤】S20_zt。电子输运和晶格热导率不再
#   在本技能里重抄一遍，而是由同一个材料目录下的两个上游技能各自计算：
#     · ke-dft-cpu  → <材料>/ke-dft-cpu/  …  S8_kappa（AMSET：S/σ/κ_e；2D 用 S8.4_amset2d）
#     · kl-dft-cpu  → <材料>/kl-dft-cpu/  …  S6_kappa（phono3py/ShengBTE：κ_L）
#   上游技能怎么改（换引擎、修 bug、加步骤），ZT 自动跟着用，没有副本漂移。
#   （以前这里抄了一份两段的步骤定义 + 符号链接，kl 段一直停在旧引擎上。）
#
#   给一个结构就能跑完：
#     autozt -tt zt-dft-cpu -p <材料> register --poscar POSCAR   # 同时 init ke/kl
#     autozt -p <材料> start                                      # 三个技能一起推进
#   S20_zt 在 ke/kl 的结果拉回本地之前一直是 WAIT（任务图里写着在等哪份结果）。
#
# ★ 同名材料 / 旧结果不会被误读：needs_results 按【本材料的本地目录】找上游结果，
#   不按材料名；每份拉回的结果带 autozt 写的来源戳 .autozt_origin.json（材料目录 +
#   POSCAR sha256），属于别的材料目录、或结构改过之后的旧结果一律不算。选中的结果
#   在 gen 时推到远端 zt-dft-cpu/inputs/<键>/（附 source.json），S20 只读这里，
#   并再核一次三份输入是同一个材料、同一个结构。
#
#   κ_L 的来源按下面列表的顺序取第一个合格的：kl-dft-cpu > kl-mlff-cpu >
#   kl-mlff-gpu > fit-fc-thermal（项目里可覆盖 needs_results 改顺序）。
# =============================================================================
schema: 2
name: zt-dft-cpu
desc: 热电优值 ZT（组合 ke-dft-cpu 电子输运 + kl-dft-cpu 晶格热导 → ZT 汇总）
version: "0.2"

template_layout: per_step
template_dir: "."

defaults:
  hpc: jzzn
  skill_subdir: true

# register 时一并 init 的上游技能（同一个材料目录，各自计算）
companion_skills: [ke-dft-cpu, kl-dft-cpu]

fetch_files: [zt_summary.json, zt_summary.txt, zt_vs_T.png, zt_vs_doping.png,
              zt_heatmap.png, zt_components.png, inputs]

steps:
  - {seq: 20, name: step20_zt, label: S20_zt,
     src: step20_zt, template_dir: ".",
     check: plot, run: gen, done_marker: zt_summary.json,
     gen: gen_step20_zt.py, gen_need: [zt_common.py, stepconf.py], fetch_all: true,
     needs: [],
     needs_results: {
       # [0014] 按材料维度（S1 的 DIM=）选：2D 只认 S8.4_amset2d（二维散射核，弹性/介电用原始
       #   slab 值），3D 用 S8_kappa。2D 不回退 S8：S8 与 S8.4 并行，先跑完的 S8 会被抢先用掉。
       transport: [{path: ke-dft-cpu/result/step8.4_amset2d/transport.json, dim: 2d,
                    hint: "2D 只认 S8.4_amset2d；ke-dft-cpu 项目配置写 amset2d: true"},
                   {path: ke-dft-cpu/result/step8_amset/transport.json, not_dim: 2d}],
       kappa_L:   [kl-dft-cpu/result/step6_kappa/kappa_summary.json,
                   kl-mlff-cpu/result/step4_kappa/kappa_summary.json,
                   kl-mlff-gpu/result/step4_kappa/kappa_summary.json,
                   fit-fc-thermal/result/step2_kappa/kappa_summary.json],
       structure: [ke-dft-cpu/result/step1_opt/workflow_method.txt]}}

requires:
  # 本技能只做汇总；VASP/AMSET/phono3py 等依赖由上游 ke-dft-cpu / kl-dft-cpu 声明
  python: [numpy, matplotlib]

# =============================================================================
# 自描述三段（只给人/AI 看，不参与运行期装配）
# =============================================================================
io_schema:
  inputs:
    - {name: POSCAR, from: user, required: true, desc: "材料结构（材料目录根；ke/kl 两个上游技能共用）"}
    - {name: transport.json, from: "skill:ke-dft-cpu", required: true,
       desc: "AMSET 电子输运（3D：ke-dft-cpu S8_kappa；2D：S8.4_amset2d），按材料目录 + 结构指纹核对"}
    - {name: kappa_summary.json, from: "skill:kl-dft-cpu", required: true,
       desc: "κ_L(T)（kl-dft-cpu S6_kappa；或 kl-mlff-* / fit-fc-thermal）"}
  outputs:
    - {name: zt_summary.json, step: S20_zt, type: json,
       desc: "最终产物：ZT(T, 载流子浓度) 全表 + 峰值 ZT + 所用 κ_L/κ_e 口径 + 输入来源"}
    - {name: zt_heatmap.png, step: S20_zt, type: png,
       desc: "zT(n, T) 热图：n 型 / p 型两栏，横轴载流子浓度、纵轴温度"}
    - {name: zt_vs_T.png, step: S20_zt, type: png, desc: "各掺杂档 ZT(T)"}
    - {name: zt_vs_doping.png, step: S20_zt, type: png, desc: "各温度下 ZT(载流子浓度)"}
  params:
    - {name: KTEMP_MODE, values: [interp, const300], default: interp, where: step.conf,
       desc: "ZT 汇总取 κ_L 的方式：interp = 按温度插值 κ_L(T)；const300 = 固定用 300 K 的 κ_L"}
  steps:
    - {step: S20_zt, title: "ZT 汇总", tool: "python (run: gen)",
       inputs: [transport.json, kappa_summary.json],
       outputs: [zt_summary.json, zt_heatmap.png, zt_vs_T.png],
       validator: "三份输入属于同一材料目录 + 同一 POSCAR；done_marker zt_summary.json"}

flow:
  title: "Thermoelectric figure of merit ZT"
  backend: "ke-dft-cpu (VASP/AMSET) + kl-dft-cpu (VASP/phono3py/ShengBTE)"
  summary: "POSCAR → ke-dft-cpu 出 S,σ,κ_e ‖ kl-dft-cpu 出 κ_L（两个技能各自计算、各自修改）→ S20_zt：ZT = S²σT/(κ_e+κ_L)"
  stages:
    - {name: zt, steps: [S20_zt], produces: [zt_summary.json, zt_heatmap.png]}
  next_skills:
    - {skill: te-screen, via: POSCAR, desc: "先用替代模型粗筛 ZT，再上本技能做 DFT 全流程"}
  requires: {POSCAR: "材料目录根必须有 POSCAR",
             ke-dft-cpu: "同一材料目录下的电子输运结果",
             kl-dft-cpu: "同一材料目录下的晶格热导结果"}

corrections: [node_fail, dir_missing]
