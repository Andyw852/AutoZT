# =============================================================================
# device-thermal 技能默认参数（三层合并：本文件 -> 项目 templates/ -> 项目 step.conf）
# 改参数：autozt -tt device-thermal -p <材料> -j <步骤> conf --set params.KEY=值
# 注意：本文件是"共享模板"（template_layout: shared），不要写 STEP=，否则各步
#       会因 STEP 与步骤名不符而报错。
# =============================================================================
[params]
# ---- 器件几何 ----
DEVICE_NAME       = device          # 仅用于出图/报告标签
CHANNEL_MATERIAL  = MoS2            # 沟道材料（查 device_materials.json）
# CHANNEL_THICKNESS = 6.7177e-10     # 可选：显式覆盖沟道厚度(m)；不设则用上游 thickness_d_A 或材料库
# TBC_OVERRIDE      = 1.4e7          # 可选：显式覆盖界面热导 G (W/m^2K)；接 GPU/MD 或实验值
OXIDE_MATERIAL    = SiO2            # 栅介质/衬底氧化层
# OXIDE_THICKNESS = 300e-9          # 氧化层厚度 (m)；默认 300e-9 在 S1 的 SPEC，设了即覆盖材料库厚度（hBN 等 2D 材料也生效）
SUBSTRATE_MATERIAL = Si             # 底部热沉材料（当前作恒温边界）
L_CHANNEL         = 200e-9          # 沟道长度 (m)，沿 x
W_DEVICE          = 1e-6            # 器件宽度 (m)，仅用于折算总功率

# ---- 热源与边界 ----
Q_JOULE           = 1e8             # 焦耳功率密度 (W/m^2，按器件面积)；1e8 = 100 mW/um^2
T_AMB             = 300.0           # 环境/热沉温度 (K)
CONTACT_BC        = sink            # sink=金属接触恒温导热；insulator=接触绝热

# ---- 物性来源 ----（默认值在 S1 的 SPEC；S2 未显式设置时回退 S1 固化的值）
# KAPPA_SOURCE    = auto            # auto=上游优先、缺失回退；upstream=缺上游直接报错；literature=只用材料库
# UPSTREAM_SKILL  = kl-dft-cpu      # 上游技能目录名
# UPSTREAM_STEP   = step6_kappa     # 上游 kappa_summary.json 所在步骤

# ---- 数值 ----（默认值在 S1 的 SPEC；S3 未显式设置时回退 device_spec.json 的值）
# N_GRID_X        = 41              # 沿沟道 x 单元数（单元中心离散，dx=L/Nx）
# N_GRID_SUB      = 60              # 氧化层 y 网格数（沟道层固定 2 格）
# DO_TRANSIENT    = true            # 是否算瞬态升温曲线 + tau
# SOR_OMEGA       = 1.7             # SOR 松弛因子
# SOR_TOL         = 1e-10           # SOR 收敛容差
# SOR_MAXIT       = 200000          # SOR 最大迭代
MAKE_PLOT         = true            # S4 是否出 PNG（无 matplotlib 时自动跳过、仍出 JSON）

# ===== 可选 GPU 步 S5_tbc / S6_tbc_post（需先开 optional_steps.gpu_tbc）=====
# 通用：任意界面结构/元素、任意传输轴(x/y/z)、任意 GPUMD 势。
# 热流 q 由源/漏恒温器的累积传能直接给出（compute 输出的最后两列），不再依赖文献 kappa。
# TBC_STRUCTURE            = tbc_interface.xyz  # extxyz（第二行含 Lattice=...）；放技能目录或 project_setting/skill_dir/，随 gen_need 推送
# TBC_NEP_MODEL            = ~/software/AutoZT/GPUMD/potentials/nep/nep89_20250409/nep89_20250409.txt
# TBC_GPUMD_BIN            = ~/software/AutoZT/GPUMD/build/gpumd
# TBC_CUDA_VISIBLE_DEVICES = GPU-<uuid>   # 建议用 UUID（3090 GPU4 故障，数字索引会错位）
# TBC_AXIS                 = z            # 传输/堆叠方向 x|y|z
# TBC_PBC                  =              # 覆盖 pbc（如 "T T F"）；空=沿用结构文件
# TBC_INTERFACE_COORD      =              # 界面坐标(A)；空=按元素组分突变自动判定
# TBC_SOURCE_THICKNESS     = 5.0          # 源组厚度(A)，默认在坐标高侧
# TBC_SINK_THICKNESS       = 8.0          # 漏组厚度(A)，默认在坐标低侧
# TBC_SOURCE_SIDE          = high         # high|low：源组在坐标高/低侧
# TBC_VACUUM_GAP_A         = 4.0          # 判真空的间隙阈值(A)，间隙法后备用
# TBC_T                    = 300.0        # 平均温度
# TBC_DELTA_T              = 40.0         # 半温差：源=T+dT，漏=T-dT
# TBC_COUPLE               = 100.0
# TBC_THERMOSTAT           = heat_lan     # heat_lan|heat_nhc|heat_bdp
# TBC_TIME_STEP            = 1.0          # fs
# TBC_SEED                 = 0            # 0=不固定；非0 可复现
# TBC_BIN_WIDTH            = 2.0          # T(z) 剖面 bin 宽(A)
# TBC_EQUIL_STEPS          = 20000        # NVT 平衡
# TBC_BURN_STEPS           = 100000       # heat_* 烧入（释放初始应变，强烈建议 >0）
# TBC_RUN_STEPS            = 200000       # 测量段（恒温器传能在此段累积）
# TBC_SAMPLE_INTERVAL      = 10
# TBC_OUTPUT_INTERVAL      = 100
# TBC_THERMO_INTERVAL      = 1000
# ---- S6 后处理 ----
# TBC_FIT_MARGIN_A         = 2.0          # 体区拟合距界面/恒温器的余量(A)
# TBC_MIN_BINS             = 3
# TBC_STEADY_TOL           = 0.2          # 源/漏热流自洽容差
# TBC_MIN_WINDOW_FRAC      = 0.2
# TBC_DT_TOL               = 0.3          # dT_i 外推相对误差容差（超了 quality=poor）
# TBC_MARGIN_TOL           = 1.5          # G 对拟合余量敏感度上限（max/min，超了 poor）
# TBC_KAPPA_A_W_mK         =              # 可选，仅交叉核对（短引线/弹道区会差很多）
# TBC_KAPPA_B_W_mK         =
