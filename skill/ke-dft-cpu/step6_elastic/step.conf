# step.conf —— step6_elastic（S6_elastic）的【技能侧步骤级默认值】
#
# 分层（autozt/report.py 的 step_conf_sources）：
#     skill/ke-dft-cpu/step.conf                                技能全局
#   → skill/ke-dft-cpu/step6_elastic/step.conf                 本文件：只作用于 S6
#   → project_setting/templates/step.conf                      项目共用
#   → project_setting/templates/step6_elastic/step.conf        项目内该步骤
# 越靠后越优先；各层只写与上一层不同的键。
#
# 本文件只放 S6 的并行规模。gen_step2_elastic.py 用 read_submit(strict=False)
# 读取 [submit]，不需要在 [params] 里声明，不会触发未知键检查。
#
# ---------------------------------------------------------------------------
# 为什么 S6 必须多节点
# ---------------------------------------------------------------------------
# IBRION=6 的有限差分弹性不是一条弛豫轨迹，而是「114 个独立位移，每个都是一个
# 从头收敛的单点 SCF」（NFREE=2：57 个不等价自由度 × 2 个方向）。
# 实测（Mg2C60，62 原子，KSPACING=0.03 -> 4x4x4 k 网格，NBANDS=192）：
#     单节点 64 rank   -> 38.5 min/位移 -> 114 x = 73 h  （超过常见 1~3 天时限）
#     3 节点 192 rank  -> 12.5 min/位移 -> 114 x = 24 h  （3.1x）
#
# ---------------------------------------------------------------------------
# 为什么是 2 节点 / 128 rank
# ---------------------------------------------------------------------------
# VASP 在 CPU + IBRION=6 下 parallel 被钉在 NCORE=1 / KPAR=1（模板默认），
# 因此并行只能落在「能带」这一维：rank 数最多等于 NBANDS。
# Mg2C60 的 NBANDS=192，所以 192 rank 是能带并行的天然上限（每 rank 1 条带）。
# 再往上加节点必须同时改 NCORE>1 或 KPAR>1，收益有限且需重新验证。
#
# 2 节点 x 64 = 128 rank：比单节点快约 2x，又比 3 节点容易排上队
# （3 节点需要 3 个各空 64 核的节点，实测在满载队列里等了 7 小时）。
# 注意 192/128=1.5 不是整数，VASP 会把带不均分（部分 rank 2 条、部分 1 条），
# 实际吞吐接近 96 rank；若想整除可改 ntasks_per_node=48（96 rank，每 rank 2 条带）。
#
# ---------------------------------------------------------------------------
# ★ time 不要写在这里
# ---------------------------------------------------------------------------
# 各集群时限规则差异很大，写死会连带出问题：
#   hfeshell  分区默认 33 天 -> 回填窗口找不到，作业 StartTime 直接排到一年后
#   jzzn      regular QOS MaxWall=1 天 -> 写 3 天会被拒
#   clus_xa   xahctest MaxTime=3 天；且该集群多节点 MPI 实测跨节点 ORTE 失败
# 所以 time 请在项目级 <project_setting>/templates/step6_elastic/step.conf 里按集群给。

# ---------------------------------------------------------------------------
# 进一步提速的三个【可选】旋钮（默认全部不启用）
# ---------------------------------------------------------------------------
# IBRION=6 总耗时 ~= SCF 次数 x 每次 SCF 耗时。下面三项分别压后一项，
# 但都有前提，未验证前不要打开。
#
# [1] KPAR（唯一"只改并行、不改数值"的项）
#     VASP 有限差分要求 NCORE=1（硬性）。不可约 k 点 >=2 时可按 k 点分组：
#     Mg2C60 的 NKPTS=24，KPAR=2/4 理论上有收益。
#     现状：gen_step2_elastic.py 第 11 行写的是"IBRION=6 有限差分对并行敏感，
#       NCORE=1（=NPAR ranks）最稳妥，KPAR 继承 step1"——即 KPAR 目前是继承
#       step1 的值，技能并未禁止 KPAR>1，只是没有实测过。
#     待确认：IBRION=6 每个位移会破坏对称性、重生 k 点集，而 KPAR 是启动时静态
#       分组，两者是否兼容需要实测（不是已知结论）。
#     启用前提：拿一个已有完整弹性张量的材料当基准，对比 KPAR=1 与 KPAR=2/4 的
#       C_ij 偏差；本次 Mg2C60 作业跑完后它自己就是基准，用别的材料验证。
#     写法：在项目级 step.conf 的 [incar.final] 里写 KPAR = 2（不要写在本文件）
#
# [2] LREAL = Auto
#     大晶胞（几十~上百原子）投影计算可快 2-3 倍。
#     ★ 但 S6 的唯一产物就是弹性张量（应力对位移的导数），而 LREAL=Auto 的代价
#       正是"力和应力有小误差"——它直接改物理量，不属于"不改结果"。
#     启用前提：必须有可比对的基准弹性张量，实测 C_ij 偏差可接受才用。
#
# [3] ALGO = Fast
#     未验证项。ALGO 同时影响收敛速度与收敛路径，改它不属于"不改结果"，
#       需要先用基准材料确认能量/应力一致后再用。
#     注：Mg2C60 的 S6 每个位移 SCF 约 10 个电子步（实测 DAV 计数），
#       比从头起算的步数少，说明构型间可能存在初值复用——Fast 是否有效
#       需要实测，本文件不作结论。
#
# 参考：Mg2C60 实测（2026-10-22/23）NFREE=2 / ISYM=2 / n_ineq=17of62 /
#   EDIFF=1E-6 / KSPACING=0.03 已全部是新出厂值，无压缩空间。

[submit]
nodes = 2
ntasks_per_node = 64
