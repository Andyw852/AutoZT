# step.conf —— step2.3_hse（S2.3_hse）的【技能侧步骤级默认值】
#
# 分层（autozt/report.py 的 step_conf_sources）：
#     skill/ke-dft-cpu/step.conf                         技能全局
#   → skill/ke-dft-cpu/step2_bandgap/step2.3_hse/step.conf  本文件：只作用于 S2.3
#   → project_setting/templates/step.conf               项目共用
#   → project_setting/templates/step2_bandgap/step2.3_hse/step.conf  项目内该步骤
# 越靠后越优先。gen_step4_HSE.py 用 read_submit(strict=False) 读 [submit]。
#
# ---------------------------------------------------------------------------
# 为什么 S2.3 要 premium（2 天）而不是 regular（1 天）
# ---------------------------------------------------------------------------
# S2.3 是两段式 HSE 的第 2 段（[e2a7d26]）：从 S2.28 的 WAVECAR 用 ISTART=1 起步，
# 但**不用 NKRED**——切片段要精确的交换项才能给出正确能带。代价是单个电子步极慢：
#
#   Mg2C60（62 原子，ENCUT=800，544 电子，EDIFF=1E-7）实测：
#     64 核   1 个电子步 ~4.0 h   -> 4-6 步 = 16-24 h   （regular 1 天，必超）
#     96 核   1 个电子步 ~2.7 h   -> 4-6 步 = 11-16 h   （仍贴 1 天上限）
#
# jzzn 的 QOS 上限（sacctmgr show qos）：
#     regular  1-00:00:00   ← 默认，S2.3 会超时被杀，IBRION/SCF 都不可续 -> 全部白跑
#     premium  2-00:00:00   MaxJobsPU=5（4 个分片正好放得下）
#     custom / revise01 / qos_384   无 MaxWall（更宽，但可能受账号限制）
#
# 因此 S2.3 出厂用 premium。若某集群没有 premium 这个 QOS，在项目级
# <project_setting>/templates/step2_bandgap/step2.3_hse/step.conf 里覆盖掉即可
# （例如写 qos = regular 并同时把制限调短、或换到时限更长的集群）。
#
# 注：--ntasks-per-node 实际由项目 setting.yaml 的 cores 决定（cores 覆盖 [submit]）；
# gen 里 NTASKS_PER_NODE_LARGE=96 的设计意图是"HSE 一律 96 核"（比整节点 192 核好排）。
# 想让 cores 生效，项目的 cores 要 >= 96，否则会被压小。

[submit]
qos = premium
