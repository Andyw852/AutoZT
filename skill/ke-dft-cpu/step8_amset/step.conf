# step.conf —— step8_amset 的【技能侧步骤级默认值】
#
# 为什么单独一份：autozt/report.py 的 step_conf_sources() 分层是
#     skill 默认(skill/ke-dft-cpu/step.conf)
#   → skill 默认(本步)(本文件)                  ← autozt/report.py:711
#   → project_setting/templates/step.conf
#   → project_setting/templates/<步骤名>/step.conf
#   → 材料/<技能>/templates/...
# 只有本文件会被【只在本步骤】加载；写进上一层（技能全局）会被合并到
# 所有步骤、触发别的 gen 脚本的未知键检查而报错。
#
# 步骤专属键请一律写在这里。
#
# ★ 接线要求（少一条本文件就是死文件）：读它的 gen 脚本必须
#   ① 在 SPEC 里声明对应的键，② 用 stepconf.load(..., strict=False)。
#   材料级 step.conf 是【全技能共用】的一份，含 FUNC/CELL_POLICY 等别的步骤的键，
#   严格模式会被这些键打死（SystemExit=BaseException，被 except 吞掉 → 静默失效）。

[params]
# ---------------------------------------------------------------------------
# NWORKERS —— AMSET 的并行进程数（写进 settings.yaml 的 nworkers）
#
# ★ 默认：**本行保持注释 = 自动**。gen_step10_amset.py / gen_step14_amset2d.py
#   会从提交模板（叠加本文件 [submit] 段的覆盖）推出本次作业真正分配到的核数
#       nworkers = ntasks_per_node × cpus_per_task
#   这样三台机器各取所需，不用手工同步两个数：
#       jzzn      24 × 1 = 24
#       hanhai25 128 × 1 = 128
#       3090       1 × 8 = 8
#   写死一个常数必然错两台：少要 = 算力闲置（还被中心判低利用率），
#   多要 = 超订节点、抢同节点其他作业的 CPU（违反 SLURM 分配）。
#
# ★ 为什么以前必须写死 24：不写 nworkers 时 AMSET 取默认 -1，其源码
#   (amset/interpolation/bandstructure.py:182) 把 -1 解释成
#       nworkers = multiprocessing.cpu_count() if nworkers == -1 else nworkers
#   即**用满节点全部核**；jzzn 提交只申请 24 核 → 超订 8 倍。
#   实测（Pb2Sb2Te5，其余设置相同）：nworkers=-1 时 4 分钟；nworkers=24 时 7.5 小时。
#   现在改由"自动 = 实际分配核数"解决，不再依赖某个手写的数。
#
# ★ 确需固定值再取消下一行注释（会自动与分配核对，不一致时打印 WARN）。
#   想加速的正路是把提交模板 setting/<hpc>/templates/submit_amset.tpl 的
#   --ntasks-per-node 提上去 —— 自动模式会跟着走（AMSET 在掺杂/温度维度
#   并行度很高，接近线性加速）。
# NWORKERS = 24
