# step.conf —— step8_amset 的【技能侧步骤级默认值】
#
# 为什么单独一份：autozt/report.py 的 step_conf_sources() 分层是
#     skill 默认(skill/ke-dft-cpu/step.conf)
#   → skill 默认(本步)(本文件)                  ← autozt/report.py:711
#   → project_setting/templates/step.conf
#   → project_setting/templates/<步骤名>/step.conf
#   → 材料/<技能>/templates/...
# 只有本文件会被【只在本步骤】加载；写进上一层（技能全局）会被合并到
# 所有步骤、触发别的 gen 脚本的未知键检查而报错。
#
# 步骤专属键请一律写在这里。
#
# ★ 接线要求（少一条本文件就是死文件）：读它的 gen 脚本必须
#   ① 在 SPEC 里声明对应的键，② 用 stepconf.load(..., strict=False)。
#   材料级 step.conf 是【全技能共用】的一份，含 FUNC/CELL_POLICY 等别的步骤的键，
#   严格模式会被这些键打死（SystemExit=BaseException，被 except 吞掉 → 静默失效）。

[params]
# ---------------------------------------------------------------------------
# EPS_INF_OVERRIDE —— 手动覆盖 ε∞（标量或 3 个对角值，逗号/空格分隔）
#
# ★ 2026-09-27 用户指示。动机：PBE/PBEsol 带隙过小会**高估** ε∞，而
#   （GaAs 实测 17.96 vs 实验 10.9）。偏差方向要注意：Fröhlich 耦合正比于
#   (1/eps_inf - 1/eps_0)，eps_inf 偏大 => 耦合变**弱** => POP 散射变少 =>
#   μ_POP 与总迁移率被**高估**（eps_0 偏大还会让 IMP 屏蔽变强、μ_IMP 也偏高）。
#   若已用 HSE + LCALCEPS 重算出可信的 ε∞，用这个键喂给 AMSET。
#   ε₀ 取离子部分搬移：eps0_new = eps_inf_new + (eps0_PBEsol - eps_inf_PBEsol)。
#
#   例（GaAs，把 DFPT 的 17.96 换成 HSE 值）：
#       EPS_INF_OVERRIDE = 12.5
#   各向异性材料写三个（xx yy zz）：
#       EPS_INF_OVERRIDE = 12.5, 13.0, 12.0
# EPS_INF_OVERRIDE = 12.5
# ---------------------------------------------------------------------------
# NWORKERS —— AMSET 的并行进程数（写进 settings.yaml 的 nworkers）
#
# ★ 默认：**本行保持注释 = 自动**。gen_step10_amset.py / gen_step14_amset2d.py
#   会从提交模板（叠加本文件 [submit] 段的覆盖）推出本次作业真正分配到的核数
#       nworkers = ntasks_per_node × cpus_per_task
#   这样三台机器各取所需，不用手工同步两个数：
#       jzzn      24 × 1 = 24
#       hanhai25 128 × 1 = 128
#       3090       1 × 8 = 8
#   写死一个常数必然错两台：少要 = 算力闲置（还被中心判低利用率），
#   多要 = 超订节点、抢同节点其他作业的 CPU（违反 SLURM 分配）。
#
# ★ 为什么以前必须写死 24：不写 nworkers 时 AMSET 取默认 -1，其源码
#   (amset/interpolation/bandstructure.py:182) 把 -1 解释成
#       nworkers = multiprocessing.cpu_count() if nworkers == -1 else nworkers
#   即**用满节点全部核**；jzzn 提交只申请 24 核 → 超订 8 倍。
#   实测（Pb2Sb2Te5，其余设置相同）：nworkers=-1 时 4 分钟；nworkers=24 时 7.5 小时。
#   现在改由"自动 = 实际分配核数"解决，不再依赖某个手写的数。
#
# ★ 确需固定值再取消下一行注释（会自动与分配核对，不一致时打印 WARN）。
#   想加速的正路是把提交模板 setting/<hpc>/templates/submit_amset.tpl 的
#   --ntasks-per-node 提上去 —— 自动模式会跟着走（AMSET 在掺杂/温度维度
#   并行度很高，接近线性加速）。
# NWORKERS = 24
# ---------------------------------------------------------------------------
# [0036] DP_OPTICAL_E / DP_OPTICAL_H —— 三维光学形变势（ODP，谷内）与谷间散射（IVS），出厂不开
#
#   AMSET 没有非极性光学声子：Si/Ge/金刚石这类非极性半导体的空穴迁移率被高估 ~4.5 倍
#   （METHODOLOGY 第 2 条）。写了通道表 gen 就把 ODP/IVS 加进 SCATTERING，插件 amset_dpo3d.py 给率。
#   通道写法与 S8.4 相同：起>止:D@ħω（D 单位 eV/Å = 1e8 eV/cm，ħω 单位 meV）；X>X 谷内，X>X' 同星其它谷，X>Y 别的星。
#   ★ 三维谷表必须手填（S3 晶胞分数坐标、每个等价谷一个中心、3 个分量），没有就报错。
#   参数从文献抄（如 Jacoboni & Reggiani RMP 55, 645 (1983) 的 Si/Ge 表），以下仅为写法示例：
# DP_OPTICAL_H = G>G:6.0@63
# DP_OPTICAL_VALLEYS_H = G:0,0,0
# ADP_INTRAVALLEY = auto        # auto（开了 IVS 的载流子 ADP 只留谷内）/ on / off
#   2D 材料的 S8（三维核对照）忽略这些键（由 S8.4 用）。显式写 SCATTERING 时照它来、不自动补 ODP/IVS。
#
# ODP_FROZEN —— 谷内 ODP 参数来源（[0036]，与 S8.4 同义）
#   auto（出厂）：本材料开了 odp_frozen 组（tf_*.yaml 写 odp_frozen: true）、S8.21 出了 odp_params.json 就用冻声子参数，
#                 不用写任何 DP_OPTICAL_*；手填的谷内通道只作对照。谷间 IVS 不自动算（手填才有）。
#   on：必须有冻声子参数；off：只用手填（文献）值。
# ODP_FROZEN = auto
# ODP_FROZEN_DMIN = 0.05        # eV/Å，D 低于它的模不进通道（对称性禁戒）

# PIE —— 三维压电散射（[0037]，出厂不开；SCATTERING = ADP,IMP,POP,PIE 才开）
#   只对非中心对称、压电不为零的材料有意义；低温、低浓度、弱屏蔽时值得评估。
#   压电张量取 step6_elastic/OUTCAR 的 including ionic 块：S6 出厂没开 LCALCEPS，要在 S6 的 step.conf 写
#     [incar.final]
#     LCALCEPS = .TRUE.
#   并重跑 S6（每个位移多一次有限电场计算，耗时约翻倍；金属/窄带隙材料的 S6 有失败风险，别全局打开）；
#   没有张量时 PIE 自动去掉并告警。
#   PIE_KERNEL = az（出厂，插件 amset_pie3d.py：静态 ε0、q̂ 纵场、屏蔽 q²/(q²+β²)²）/ amset（原版核，只作对照）
# PIE_KERNEL = az
# PIE_SCREENING = true          # az 核的自由载流子屏蔽（不影响 POP）
# ---------------------------------------------------------------------------
# [0038] SUBSETS —— 要输出的散射机制子集（每个子集生成一个 subset_<机制>.json）
#
#   分号分隔多个子集，每个子集内用 +/逗号/空格 分隔机制（写的是**保留**的机制）。
#   出厂三套（对应 S8.3 的 4 条数据集里的 3 条 AMSET 线，第 4 条 BT2×DPT-τ 来自 S8.1）：
#     1) ADP+POP+IMP+ODP+PIE —— 全机制（含 IMP）
#     2) ADP+POP+ODP+PIE      —— 去 IMP（本征）
#     3) ADP                  —— 只 ADP（声学极限）
#   子集里本次没开的机制自动忽略：不开 ODP/PIE 时出厂自动退化为
#   ADP+POP+IMP / ADP+POP / ADP，即 subset_ADP+POP+IMP.json / subset_ADP+POP.json / subset_ADP.json。
#   需要 WRITE_MESH（同一份 mesh 去机制重积分）；off = 不出 subset_*.json。
#   例：SUBSETS = ADP+POP+IMP; ADP+POP; ADP
#   遗留键 INTRINSIC_ADP_ONLY=false 仍可把"只 ADP"这一套摘掉（旧语义）。
# SUBSETS = ADP+POP+IMP+ODP+PIE; ADP+POP+ODP+PIE; ADP
