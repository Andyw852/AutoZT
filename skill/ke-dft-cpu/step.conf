# =====================================================================
# step.conf —— 步骤参数（本文件在两个地方各有一份，作用不同）
#
#   skill/ke-dft-cpu/templates/step.conf                       出厂默认，别改
#   <材料>/ke-dft-cpu/project_setting/templates/step.conf      本材料共用，改这份
#   <材料>/ke-dft-cpu/project_setting/templates/<步骤名>/step.conf   只管该步骤
#
# 生效顺序（越靠后越优先）：出厂默认 -> 本材料共用 -> 该步骤专属。
# 每层只写跟上一层不一样的键，不用整套抄。
#
# 查看最终生效值和来源：
#     tf -tt ke-dft-cpu -p <材料> -j <步骤> conf
# 直接改（写进"该步骤专属"那一份，skill 库不动）：
#     tf -tt ke-dft-cpu -p <材料> -j <步骤> conf --set params.FUNC=pbe-d3
# =====================================================================

[params]
# 带隙层级：pbe = 只算到 PBE 带隙（跑到 PBE 画图为止，跳过整段 HSE）
#           hse = 继续算 HSE 带隙（默认）。驱动据此增删 HSE 步骤。
BANDGAP = hse
# 结构优化泛函，决定 INCAR 的 GGA / IVDW，并由 step1 写进 workflow_method.txt
# 供 step2/3/4/5/6/7 继承（S2.3 的杂化泛函族也据此自动选 HSE06 / HSEsol，见下面 HYBRID）。
#   auto     （默认，与 kl-dft-cpu 相同）按顺序：
#              ① 本技能 step1 已有的 FUNC（retry 不换泛函）
#              ② 同材料 kl-dft-cpu 的 step1 FUNC（ZT 两条链同一晶格；FUNC_ALIGN = false 可关）
#              ③ 键网络判据（method_select）：层/链/分子间隙或多组分 -> pbe-d3；
#                 等维单组分 -> pbesol；判不了 -> pbe-d3（保守）
#            判据与理由写进 step1/workflow_method.txt 的 FUNC_REASON=。
#   pbe-d3   PBE + DFT-D3(BJ)  -> GGA=PE, IVDW=12
#   pbesol   PBEsol            -> GGA=PS, 无色散修正
#   pbe      纯 PBE            -> GGA=PE, 无色散修正
# ★ 2026-10-14：原来这里写死 pbesol，而 kl-dft-cpu 是 auto —— 层状材料 kl 选 pbe-d3、ke 用 pbesol，
#   zt-dft-cpu 把两个晶格常数不同的结果直接相加。已算完的材料不受影响（retry 沿用 step1 已有 FUNC）；
#   S20_zt 现在会核对两边 FUNC，不一致时告警。想固定某个泛函就在材料 step.conf 显式写 FUNC。
# ★ PBE0 / HSE 等杂化泛函【不能】写在这里（DFPT 介电不支持杂化，形变势/密网格承受不起）。
#   带隙用哪个杂化泛函在 S2.3 选：
#     HYBRID = auto | hse06 | hsesol | hse03 | pbe0 | custom
#       auto   跟随上游 GGA：PBEsol 链 -> HSEsol，PBE 链 -> HSE06（默认，旧行为）
#       pbe0   GGA=PE, AEXX=0.25, 不屏蔽（自动加 HFRCUT=-1）
#       custom 自定义：HYBRID_GGA（PE/PS/...，留空=跟随上游）、HYBRID_AEXX（0~1）、
#              HYBRID_HFSCREEN（Å⁻¹；0 或留空 = 不屏蔽）
#   例：autozt -tt ke-dft-cpu -p <材料> -j S2.3_hse conf --set params.HYBRID=pbe0
#   这几个键是驱动层保留键，写在材料共用 step.conf 里也不会让别的步骤报"不认识的键"。
#   带隙进 band_summary.json -> S8/S8.4 的剪刀差，杂化参数一并记录在 band_summary 的 hybrid 字段。
FUNC = auto
# 2D 层厚 t（Å），S8 / S8.1 / S8.4 三步共用（[0016]）。不写 = 各步按 vdW 半径自动取（单层通用）。
#   超晶格等要锁定文献层厚时，在【本材料共用】step.conf（project_setting/templates/step.conf）写一行，
#   例如 SS/LS：LAYER_THICKNESS = 6.73
#   旧做法写在 templates/step8_amset/step.conf 只对 S8 生效；2D 默认不跑 S8 之后 S8.1/S8.4 读不到，请搬过来。
# ★ 2026-09-16 迁移：NWORKERS 原本写在这里（技能全局 [params]），那是错的 ——
#   全局 [params] 会被 tf 合并进【每一个步骤】（report.py:616 的 "skill 默认" 层），
#   于是 gen_step1/step2/... 的未知键检查直接 SystemExit：
#       [ERROR] step.conf 的 [params] 里有本脚本不认识的键：NWORKERS
#   全树 ke 材料的 step1 都跑不了。
#   它是【step8_amset 专属】键，正确的落点是技能侧的步骤级默认值：
#       skill/ke-dft-cpu/step8_amset/step.conf
#   （report.py:619 只为对应步骤加载 "skill 默认(本步)" 层，不污染别的步骤）
#   教训：步骤专属键绝不要写进技能全局 [params]。
