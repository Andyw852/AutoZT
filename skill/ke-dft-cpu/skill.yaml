# patch_ke_dag：needs 是显式依赖，DAG 调度用；没写 needs 的步骤回退为"上一步"。
# =============================================================================
# skill/ke-dft-cpu/skill.yaml —— 电子热导率（AMSET）
#
# 【源目录：分组结构】大步骤是文件夹，里面套小步骤文件夹（v1.5 src 字段）：
#   skill/ke-dft-cpu/
#   ├── step1_opt/                       结构优化（复用 elastic-dft-cpu）
#   ├── step2_bandgap/                   带隙大步骤（源目录名 = 计算目录名）
#   │   ├── step2.1_static/
#   │   ├── step2.2_pbe/                 PBE 能带（WAVECAR）
#   │   ├── step2.2_pbe_plot/            PBE 画图 → band_summary.json
#   │   ├── step2.3_hse/                 HSE 能带（BANDGAP=hse 时）
#   │   └── step2.3_hse_plot/            HSE 画图 → band_summary.json
#   ├── step3_uniform/                   密网格自洽（新）
#   ├── step4_wave/                      amset wave（新）
#   ├── step5_dielect/                   DFPT 介电（新）
#   ├── step6_elastic/                   弹性常数（复用 elastic-dft-cpu）
#   ├── step7_deform/                    形变势大步骤（本身即 step7 计算源）
#   │   └── step7b_read/                 step7.1 读取
#   └── step8_amset/                     amset run（新）
#
# 【计算目录】现已与 src/seq 对齐：seq N 的步骤，计算目录、源目录、label 同号。
#   bandgap 段计算目录为嵌套 step2_bandgap/step2.x_*；其余为平的 stepN_*。
#   step1 兼容旧名：新目录 step1_opt，仍能识别历史 step1_std_opt（双名兜底）。
#
# k 网格一律 VASPKIT（1→102→Γ心→kspacing），2D 用 force_kz1 压真空方向为 1。
# 每个 gen 脚本开头都有可改参数区（ENCUT/ISMEAR/KSPACING/KPAR/NCORE…）。
# =============================================================================
schema: 2
name: ke-dft-cpu
desc: 电子热导率(DFT/CPU)
version: "0.1"
checks: ../_common/checks_relax.py   # 公共池里的私有判据（relax_injob）

template_layout: per_step
template_dir: "."

defaults:
  hpc: jzzn
  skill_subdir: true

fetch_files: [INCAR, POSCAR, CONTCAR, POTCAR, KPOINTS, KPOINTS_OPT, kpath.json,
              submit.sh, OUTCAR, EIGENVAL, vasprun.xml, queue.out, queue.err,
              workflow_method.txt, band_summary.json, settings.yaml,
              deformation.h5, deformation_vac.h5, band_edges.json,
              transport.json, amset.log]
# ★ LOCPOT 说明（patch_deform_ref，2026-09-16）：step7b 要用各形变构型 LOCPOT 的真空能级
#   生成 deformation_vac.h5（2D 默认口径）。LOCPOT 体积大、不进 fetch_files，
#   但**不能在 step7b 跑完之前清理**（含 step7_deform/{undeformed,deform-*}）；
#   跑完 step7b 得到 deformation_vac.h5 之后，LOCPOT 就可以清了。
#   autozt 目前没有全局 keep 名单，这条靠纪律：不要在 S7 之后、S7.1 之前 clean/删 LOCPOT。

steps:
  - {seq: 1, name: step1_opt, label: S1_opt, src: step1_opt,
     check: relax_injob, gen: gen_step1_std_opt.py, contcar_to_poscar: true,
     # thickness_2d/vdw_radii（2026-09-17 加）：2D 变胞稳定判据按层内口径换算需要
     gen_need: [relax_common.py, method_select.py, mol_common.py, incar_0d.tpl, submit_std_0d.tpl, dim_common.py, stepconf.py, step.conf, check_common.py, step1_check_and_resubmit.py, thickness_2d.py, vdw_radii.py,
                incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl]}

  - {seq: 3, name: step3_uniform, label: S3_uniform, src: step3_uniform,
     check: wavecar, gen: gen_step5_uniform.py,
     gen_need: [stepconf.py, step.conf, ke_common.py, dim_common.py, check_common.py,
                incar_uniform_2d.tpl, incar_uniform_3d.tpl,
                submit_std_2d.tpl, submit_std_3d.tpl],
     needs: ["step1_opt"]}

  - {seq: 4, name: step4_wave, label: S4_wave, src: step4_wave,
     check: marker, marker: "wavefunction.h5:", gen: gen_step6_wave.py,
     # gen_step6_wave 也 import ke_common（原来没声明，靠上一步推过的残留文件才跑得通）
     gen_need: [stepconf.py, step.conf, ke_common.py, submit_amset.tpl],
     needs: ["step3_uniform"]}

  - {seq: 5, name: step5_dielect, label: S5_dielect, src: step5_dielect,
     check: marker, marker: "OUTCAR:MACROSCOPIC STATIC DIELECTRIC TENSOR",
     gen: gen_step8_dielect.py,
     gen_need: [stepconf.py, step.conf, ke_common.py, dim_common.py, check_common.py,
                discriminant_common.py,
                incar_dfpt_2d.tpl, incar_dfpt_3d.tpl,
                submit_std_2d.tpl, submit_std_3d.tpl],
     needs: ["step1_opt"]}

  # seq 5.1：step5_dielect 的**数值**校验（纯分析步，run: gen）。
  # 为什么需要：step5 的完成标记 check: marker 只看 OUTCAR 里有没有
  # 'MACROSCOPIC STATIC DIELECTRIC TENSOR' 这个**字符串**，不看内容 ——
  # 实测 2026-09-14 有 5 个工程（qTPC20-r/Mg2C60/Mo2S3(P1)/Pb2Sb2Te5/Sn2Sb2Te5）
  # 张量全是 NaN 却被判为完成，一路把 NaN 送到 step8，POP 散射静默丢失。
  # 本步用数值判据把关（NaN/ε<1/单位矩阵/缺 IONIC 块/ε_s≡ε_∞）。
  - {seq: 5.1, name: step5_dielect_validate, label: S5.1_dievalid, src: step5_dielect,
     check: plot, run: gen, done_marker: dielectric_check.json,
     # --json 指到本步目录：脚本默认写 step5_dielect/dielectric_check.json（DFPT 步的目录），
     # 而 autozt 在本步目录里找 done_marker -> 不指就永远 error。
     gen: "validate_dielectric.py --json step5_dielect_validate/dielectric_check.json",
     gen_need: [], fetch_all: true,
     needs: ["step5_dielect"]}

  - {seq: 6, name: step6_elastic, label: S6_elastic, src: step6_elastic,
     check: marker, marker: "OUTCAR:TOTAL ELASTIC MODULI",
     gen: gen_step2_elastic.py,
     gen_need: [stepconf.py, step.conf, dim_common.py, check_common.py, step2_check_and_resubmit.py,
                submit_std_2d.tpl, submit_std_3d.tpl],
     needs: ["step1_opt"]}

  - {seq: 7, name: step7_deform, label: S7_deform, src: step7_deform,
     check: deform, fanout: "*deform*", gen: gen_step9_deform.py,
     gen_need: [stepconf.py, step.conf, ke_common.py, dim_common.py, incar_deform_2d.tpl, incar_deform_3d.tpl,
                submit_std_2d.tpl, submit_std_3d.tpl],
     needs: ["step1_opt"]}

  - {seq: 7.1, name: step7b_deform_read, label: S7.1_read, src: step7_deform/step7b_read,
     check: plot, run: gen, done_marker: deformation.h5,
     # gen_need 必须显式带上 ke_common.py：gen_step9b 要 import 它、并用
     # resolve_strain_pairs。不推的话远端留着的是**别的步骤**早先推的那份
     # —— 2026-09-16 MoS2 实测直接 AttributeError: resolve_strain_pairs。
     # 现在 ke_common.py **只有技能根目录一份**（原来三份同名拷贝，谁最后 gen
     # 谁说了算），凡是 import 它的步骤都在 gen_need 里声明（S3/S4/S5/S7/S7.1/S8/S8.4）。
     # nspin_norm_fix.py（2026-09-21）：AMSET<0.5.1 + ISPIN=2 时两份 h5 的形变势
     # 被自旋道数除，gen_step9b 在 load/write h5 前后调它乘回自旋道数。
     gen: gen_step9b_deform_read.py, gen_need: [ke_common.py, nspin_norm_fix.py], fetch_all: true,
     needs: ["step7_deform"]}

  - {seq: 8, name: step8_amset, label: S8_kappa, src: step8_amset,
     check: marker, marker: "transport.json:thermal_conductivity",
     # gen_need 带上 overlap_preflight.py（住在 step8.4_amset2d/，靠 report.find_asset 的
    #   basename 唯一兜底找到）：gen 时查维度/重叠模式，并把它复制进运行目录供作业内 --in-job。
    gen: gen_step10_amset.py, gen_need: [stepconf.py, step.conf, ke_common.py, submit_amset.tpl, vdw_radii.py, discriminant_common.py, overlap_preflight.py], fetch_all: true,
     needs: ["step4_wave", "step5_dielect", "step6_elastic", "step7b_deform_read", "step2_bandgap/step2.2_pbe_plot", "step2_bandgap/step2.3_hse_plot"]}

# --- 2 带隙段：子步嵌套进 step2_bandgap/，状态表合并成 S2_bandgap 一列 ---------
# 泛函 pbe/pbesol 由 step1 弛豫继承。两条分支各自带画图，由 step.conf 的
# BANDGAP 参数选择走到哪：
#   BANDGAP = pbe   只算 PBE 带隙：2.1 static → 2.2 pbe → 2.2 pbe_plot，收工
#   BANDGAP = hse   继续 HSE 带隙：… → 2.3 hse → 2.3 hse_plot（默认）
# 两条分支的画图步都产出 band_summary.json（PBE 用 gen_step3.1，HSE 用 gen_step4.1）。
# 开关落地：驱动在装配任务配置时把 BANDGAP 映射成下面 bandgap_hse 组的开/关
# （见 tf 的 resolve_stepconf_flags）；也可在项目配置里直接写 bandgap_hse: false。
# group: S2_bandgap 让子步在状态表合并为一列，第二行显示走到哪步。
#   bandgap_steps : 关掉 = 完全不算带隙（手填 setting.yaml 的 bandgap）
# 计算目录名：step2_bandgap/{step2.1_static, step2.2_pbe, step2.2_pbe_plot,
#                            step2.3_hse, step2.3_hse_plot}
optional_steps:
  # ---------------------------------------------------------------------------
  # wavefunction_full（patch_full_grid，2026-09-17）—— AMSET **全网格**波函数诊断分支
  #
  # 目的：绕开 AMSET 的 desymmetrize_coefficients。
  #   WavefunctionOverlapCalculator.from_coefficients 里：
  #       if np.prod(mesh_dim) == len(kpoints):  return cls.from_data(...)
  #   h5 的 k 点若本身构成完整网格，就完全不调用去对称化。
  #   把 S3 的 INCAR 从 ISYM = 2 改成 **ISYM = -1**（必须 -1，不能 0 ——
  #   ISYM = 0 仍用时间反演、只给半个网格），VASP 就产出完整网格的 WAVECAR，
  #   amset wave 得到的 h5 便直接走 from_data。
  #
  # ★ 默认关闭：这是一次性诊断/裁决用的分支，**不要**给存量材料打开 ——
  #   k 点会 x16（MoS2：416 -> 6627），WAVECAR 与 h5 同步变大（h5 约 85 MB -> 1.3 GB）。
  #   打开方式：项目 project_setting 里写 wavefunction_full: true。
  #
  # 与原 S3/S4 的关系：两个新步骤各自独立目录，**不覆盖、不修改** step3_uniform /
  # step4_wave；两者可与原步骤并存对比。
  # 判据与裁决表见 skill/ke-dft-cpu/step8.4_amset2d/VERIFICATION.md V22.4 / V22.8。
  # 【必须同步的项目级配置】新步骤名与 step3_uniform 不同，按步骤名合并的
  #   project_setting/templates/<步骤名>/step.conf 不会自动继承 —— 要让网格与 S3
  #   完全一致（只差 ISYM），必须在
  #   project_setting/templates/step3b_uniform_full/step.conf 里写同样的
  #   VACUUM_KZ_MIN / DK_MAX。gen 脚本末尾会与 step3_uniform/KPOINTS 对照并告警。
  # ---------------------------------------------------------------------------
  wavefunction_full:
    default: false
    steps:
      - {seq: 3.5, name: "step3b_uniform_full", label: S3b_uniformfull,
         after: step1_opt,
         src: step3b_uniform_full, check: wavecar, gen: gen_step5b_uniform_full.py,
         gen_need: [stepconf.py, step.conf, ke_common.py, dim_common.py, check_common.py,
                    incar_uniform_full_2d.tpl, incar_uniform_full_3d.tpl,
                    submit_std_2d.tpl, submit_std_3d.tpl],
     needs: ["step1_opt"]}
      - {seq: 3.6, name: "step3c_uniform_offgrid", label: S3c_offgrid,
         after: step3b_uniform_full,
         src: step3c_uniform_offgrid, check: wavecar, gen: gen_step5c_uniform_offgrid.py,
         gen_need: [stepconf.py, step.conf, ke_common.py, dim_common.py, check_common.py,
                    submit_std_2d.tpl],
     needs: ["step3b_uniform_full"]}
      - {seq: 4.5, name: "step4b_wave_full", label: S4b_wavefull,
         after: step3b_uniform_full,
         src: step4b_wave_full, check: marker, marker: "wavefunction.h5:",
         gen: gen_step6b_wave_full.py,
         gen_need: [stepconf.py, step.conf, ke_common.py, submit_amset.tpl],
     needs: ["step3b_uniform_full"]}

  bandgap_steps:
    default: true
    steps:
      - {seq: 2.1, name: "step2_bandgap/step2.1_static", label: S2.1_scf,
         group: S2_bandgap, after: step1_opt,
         src: step2_bandgap/step2.1_static, check: outcar, gen: gen_step2_static.py,
         gen_need: [stepconf.py, step.conf, dim_common.py, check_common.py, step2_check_and_resubmit.py,
                    incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl],
     needs: ["step1_opt"]}
      # --- 体系判别分支（seq 2.15 / 2.155）------------------------------------
      # 2.15 : 独立**更密**网格的静态 SCF（判据用带指标法 min_k E[nocc]-max_k E[nocc-1]，
      #        不用 OUTCAR 的 fundamental gap 行 —— 有带重叠时那一行会给正值）。
      #        INCAR/POSCAR/POTCAR 从 step2.1_static 复制，唯一差别就是 k 网格，
      #        且强制严格更密（绝不复用 step2.2 的网格）。顺带给出密网格 E_F。
      # 2.155: 分析步，写 discriminant.json（label@functional + ALGO 建议 + 阻断项）。
      # ★ 必须在 2.3 杂化**之前**：2.3 的 ALGO 由它选（SEMICONDUCTOR->All，
      #   SEMIMETAL/METAL->Damped）。但 2.3 是**直接读 2.15 的 OUTCAR 现算**，
      #   不读 discriminant.json —— 后者含 @杂化 覆盖、要等杂化跑完才有，读它成循环依赖。
      # ★ 阻断只是**默认拦截**，下游 gen 的 FORCE_TRANSPORT=True 可覆盖；PBE 判
      #   METAL 是"待定"而非结论（PBE 只会低估带隙，单侧失效）。
      - {seq: 2.15, name: "step2_bandgap/step2.15_discriminant", label: S2.15_discr,
         group: S2_bandgap, after: "step2_bandgap/step2.1_static",
         src: step2_bandgap/step2.15_discriminant, check: outcar,
         gen: gen_step2.15_discriminant.py,
         gen_need: [check_common.py, check_discriminant.py, decide_discriminant.py,
                    discriminant_common.py, stepconf.py, step.conf, dim_common.py],
     needs: ["step2_bandgap/step2.1_static"]}
      - {seq: 2.155, name: "step2_bandgap/step2.155_discriminant_decide", label: S2.155_discr,
         group: S2_bandgap, after: "step2_bandgap/step2.15_discriminant",
         src: step2_bandgap/step2.15_discriminant, check: plot, run: gen,
         # done_marker 带 ..：decide_discriminant.py 写在 step2_bandgap/step2.15_discriminant/，
         # 而本步目录是 step2_bandgap/step2.155_discriminant_decide ->
         # 不写 .. 永远找不到 marker、状态表长期 error（下游不读它，无实际影响）。
         done_marker: ../step2.15_discriminant/discriminant.json,
         gen: "decide_discriminant.py",
         gen_need: [discriminant_common.py], fetch_all: true,
     needs: ["step2_bandgap/step2.15_discriminant"]}
      - {seq: 2.2, name: "step2_bandgap/step2.2_pbe", label: S2.2_pbe,
         group: S2_bandgap, after: "step2_bandgap/step2.1_static",
         src: step2_bandgap/step2.2_pbe, check: wavecar, gen: gen_step3_WAVECAR.py,
         gen_need: [stepconf.py, step.conf, dim_common.py, check_common.py, step3_check_and_resubmit.py,
                    incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl,
                    submit_ncl_2d.tpl, submit_ncl_3d.tpl],
     needs: ["step2_bandgap/step2.1_static"]}
      - {seq: 2.25, name: "step2_bandgap/step2.2_pbe_plot", label: S2.2_pbeplot,
         group: S2_bandgap, after: "step2_bandgap/step2.2_pbe",
         src: step2_bandgap/step2.2_pbe_plot, check: plot, run: gen,
         done_marker: band_summary.json, gen: "gen_step3.1_plot_band.py",
         gen_need: [], fetch_all: true,
     needs: ["step2_bandgap/step2.2_pbe"]}
  # HSE 分支单独一组：默认开=走到 HSE 带隙；BANDGAP=pbe（或 bandgap_hse: false）
  # 则整段跳过，只留 PBE 带隙。2.3 hse 从 2.2_pbe 继承，2.3_hse_plot 画 HSE 能带。
  # 2.3_hse 默认 --kpath-slice all/4 并行分段（fanout "*p*of*"）：3D 体相切 4 段并行；
  # 2D 体系在 gen 内自动跳过切片、保持单作业（能带路径点少，切片要多付 n 倍精确交换 SCF）。
  bandgap_hse:
    default: true
    steps:
      - {seq: 2.3, name: "step2_bandgap/step2.3_hse", label: S2.3_hse,
         group: S2_bandgap, after: "step2_bandgap/step2.2_pbe",
         src: step2_bandgap/step2.3_hse, check: outcar, gen: "gen_step4_HSE.py --kpath-slice all/4", fanout: "*p*of*",
         gen_need: [stepconf.py, step.conf, dim_common.py, ke_common.py, check_common.py, step4_check_and_resubmit.py,
                    incar_2d.tpl, incar_3d.tpl, submit_std_2d.tpl, submit_std_3d.tpl,
                    submit_ncl_2d.tpl, submit_ncl_3d.tpl],
     needs: ["step2_bandgap/step2.2_pbe"]}
      - {seq: 2.35, name: "step2_bandgap/step2.3_hse_plot", label: S2.3_hseplot,
         group: S2_bandgap, after: "step2_bandgap/step2.3_hse",
         src: step2_bandgap/step2.3_hse_plot, check: plot, run: gen,
         done_marker: band_summary.json, gen: "gen_step4.1_plot_band.py",
         gen_need: [], fetch_all: true,
     needs: ["step2_bandgap/step2.3_hse"]}

# --- 8.2 DPT 形变势迁移率：给 8.1 提供分方向 τ，必须排在 8.1 前面 ---
  dpt:
    default: true
    steps:
      - {seq: 8.2, name: "step8.2_dpt", label: S8.2_dpt,
         after: step8,
         src: step8.2_dpt, check: plot, run: gen,
         done_marker: dpt_result.json,
         gen: gen_step12_dpt.py, gen_need: [], fetch_all: true,
         needs: ["step3_uniform", "step6_elastic", "step7b_deform_read"]}

  # --- 8.1 BoltzTraP2 CRTA × DPT-τ：文献口径的完整实现 ---
  #   after 用 step8 前缀（匹配最后一个 step8*），这样 dpt 组关掉时
  #   本步自动挂回 step8_amset，不会因为锚点消失而静默不注入。
  boltztrap_crta:
    default: true
    steps:
      - {seq: 8.1, name: "step8.1_boltztrap", label: S8.1_bt2,
         after: step8,
         src: step8.1_boltztrap, check: plot, run: gen,
         done_marker: boltztrap_crta.json,
         gen: gen_step11_boltztrap.py, gen_need: [discriminant_common.py], fetch_all: true,
         needs: ["step3_uniform", "step6_elastic", "step7b_deform_read",
                 "step8.2_dpt"]}

  # --- 8.4 二维散射核（amset2d 插件）：只在 2D 项目里打开 ---------------------
  #   默认 false —— 3D 项目看不到这个步骤，零回归风险。
  #   打开方式：项目 project_setting 里写 amset2d: true（或 tf 的技能开关）。
  #   与 step8_amset 用同一批上游输入，DAG 上两者并行；同一个 2D 材料于是同时有
  #   bt2(8.1) / 原版 AMSET(8) / amset2d(8.4) 三套结果，正好用于对比。
  #   ★ 8.4 不开插件之外的一切：插件只在那一次 amset 运行里 import 生效，不改 AMSET 安装。
  amset2d:
    default: false
    steps:
      - {seq: 8.4, name: "step8.4_amset2d", label: S8.4_amset2d,
         after: step8_amset,
         src: step8.4_amset2d, check: marker, marker: "transport.json:thermal_conductivity",
         gen: gen_step14_amset2d.py,
         gen_need: [stepconf.py, step.conf, ke_common.py, dim_common.py, submit_amset.tpl, vdw_radii.py,
                    discriminant_common.py, amset2d_plugin.py, amset2d_pop_freq.py,
                    overlap_preflight.py, postprocess_intrinsic.py],
         fetch_all: true,
         needs: ["step4_wave", "step5_dielect", "step6_elastic", "step7b_deform_read",
                 "step2_bandgap/step2.2_pbe_plot", "step2_bandgap/step2.3_hse_plot"]}

  output_compare:
    default: true
    steps:
      - {seq: 8.3, name: "step8.3_output", label: S8.3_cmp,
         after: step8,
         src: step8.3_output, check: plot, run: gen,
         done_marker: comparison_300K.png,
         gen: gen_step13_output.py, gen_need: [], fetch_all: true,
         needs: ["step8_amset", "step8.1_boltztrap", "step8.2_dpt"]}

io_schema:
  inputs:
    - {name: POSCAR, from: user, required: true, desc: "材料结构"}
  outputs:
    - {name: transport.json, step: S8_kappa, type: json, desc: "电子热导率与输运张量"}
    - {name: band_summary.json, step: S2.2_pbeplot, type: json, desc: "带隙与带边汇总"}
    - {name: deformation.h5, step: S7.1_read, type: hdf5, desc: "形变势输运输入"}
  params:
    - {name: BANDGAP, values: [pbe, hse], default: hse, where: step.conf, desc: "PBE 或 HSE 带隙分支"}
  steps:
    - {step: S1_opt, title: "Relax", inputs: [POSCAR], outputs: [CONTCAR], validator: "力收敛"}
    - {step: S2.1_scf, title: "Band-gap SCF", inputs: [CONTCAR], outputs: [OUTCAR], validator: "outcar"}
    - {step: S3_uniform, title: "Uniform wave grid", inputs: [CONTCAR], outputs: [WAVECAR], validator: "wavecar"}
    - {step: S5_dielect, title: "Dielectric tensor", inputs: [CONTCAR], outputs: [OUTCAR], validator: "dielectric marker"}
    - {step: S6_elastic, title: "Elastic constants", inputs: [CONTCAR], outputs: [OUTCAR], validator: "elastic marker"}
    - {step: S7_deform, title: "Deformation potential", inputs: [CONTCAR], outputs: [deformation.h5], validator: "all deformations"}
    - {step: S8_kappa, title: "AMSET transport", inputs: [WAVECAR, deformation.h5], outputs: [transport.json], validator: "transport marker"}
flow:
  summary: "结构优化、带隙与散射输入 → AMSET 电子输运"
  stages: [{name: inputs, steps: [S1_opt, S2.1_scf, S2.2_pbe, S2.3_hse], produces: [band_summary.json]}, {name: transport, steps: [S3_uniform, S5_dielect, S6_elastic, S7_deform, S8_kappa], produces: [transport.json]}]
corrections: [node_fail, dir_missing]
requires:
  python: [pymatgen, numpy, matplotlib, amset, BoltzTraP2]
  conda: amset051
  exe: [vasp_std, vaspkit]
