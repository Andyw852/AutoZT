# step2_kappa 参数（三声子 BTE → 晶格热导率 κ）。
# 只放本步 gen_step2_kappa.py / kappa_driver.py 认识的键。
[params]
# BTE q 网格（phono3py 原胞基矢序）：
#   auto    = 按体系自动匹配：n_i = max(1, round(MESH_LENGTH * |b_i|))，|b_i| 为原胞
#             倒格矢长度（1/Å，不含 2π，同 phonopy 的 mesh 长度约定），由 phono3py
#             生成对称性自洽网格。胞越小/倒格矢越长 → 网格越密，自动跟体系走。
#   <数>    = 同上，但直接给长度 L（Å），如 MESH = 60
#   n n n   = 显式网格（旧行为），不做收敛测试
MESH = auto
MESH_LENGTH = 40          # auto 的起始长度 L（Å）；收敛测试从这里往上加密
# 2D：on = 把真空轴（原胞里倒格矢最短的轴）的网格压成 1；off = 原样。
MESH_2D_VACUUM = on

# ---- q 网格收敛测试（仅 MESH=auto/长度 时生效）----
#   从 MESH_LENGTH 起，L 逐次 ×MESH_CONV_FACTOR 加密重跑 BTE，直到 MESH_CONV_T 下
#   整个 κ 张量相邻两档的相对变化 max|Δκ_ij|/max|κ_ii| < MESH_CONV_TOL_PCT，取较密那档。
#   触顶（长度或总 q 点数）仍未收敛：结果取最密档，kappa_summary.json 标
#   mesh_converged=false 并告警。逐档记录写 mesh_convergence.json。
#   有截断扫描时：先在起始网格上逐档选截断，再对选中截断做网格收敛。
#   auto = 做收敛 | off = 只跑起始网格一次
MESH_CONV            = auto
# 收敛判据：per_component（默认）xx/yy/zz 各用自己的 κ 归一、全部 < 阈值才算收敛，
#   各向异性体系慢收敛的 zz 不会被大的面内 κ 掩盖；分母下限 MESH_CONV_FLOOR×max κ_ii，
#   小于最大分量 10% 的分量（2D 真空轴、极弱层间）不会因自身相对噪声卡住收敛。
#   max_ii = 旧的整张量判据 max|Δκ_ij|/max|κ_ii|（zz 未收敛只告警）。
MESH_CONV_MODE       = per_component
MESH_CONV_FLOOR      = 0.1
MESH_CONV_TOL_PCT    = 3.0
MESH_CONV_FACTOR     = 1.25
MESH_CONV_MAX_LENGTH = 150
MESH_CONV_MAX_POINTS = 64000   # 总 q 点数上限（≈40x40x40），防止大胞/小胞失控
MESH_CONV_T          = 300     # 判收敛的温度 (K)；低温更难收敛，关心低温就设成 T_MIN

# 温度扫描 (K)
T_MIN  = 100
T_MAX  = 800
T_STEP = 100

# 同位素散射（phono3py is_isotope）
ISOTOPE = true

# NAC：auto = step1_fit 有 BORN 就开（需要 S3_nac 的介电/Born，本技能数据集通常没有）；
#      on/off 强制。开 NAC 必须同目录有 BORN。
NAC = auto

# BTE 解法：rta（弛豫时间近似，便宜，默认）| lbte（直接解线性化 BTE，准但贵）
BTE_METHOD = rta

# phono3py 单进程 OMP 线程数（= --cpus-per-task；OpenMP-only，别用 mpirun）
P3PY_OMP_THREADS = 48

# ---- 逐壳层/逐截断选三阶截断（2026-09-29，与 kl-dft-cpu S6 同判据）----
#   step1_fit 用 CUT3_SCAN=auto 拟出 cutoff_scan/cut3_<c>/ 后，本步对每档各跑一次完整
#   κ，再按三判据选截断：①残差 1-SE ②逐壳层稳定性（cut<=stable_upper_cut）③κ 平台。
#   选中档的 κ 提到顶层 kappa_summary.json，并写 cutoff_selection.json。
#   auto = 有 ≥2 档就扫描 | off = 只跑标称截断。
CUT3_KAPPA_SCAN    = auto
CUT3_KAPPA_TOL_PCT = 5.0     # 判据③：相邻档 300K 面内 κ 变化上限 (%)
CUT3_CV_1SE_MULT   = 1.0     # 判据①：1-SE 规则的 SE 倍数
CUT3_STABILITY_THR = 0.3     # 判据②：逐壳层 σ/|mean| 阈值
CUT3_PICK          = smallest # smallest=三判据都满足取最小 | largest=平的就取能确定范围内最大

# 2D 面内 κ 层厚归一化（与 kl-dft-cpu S6 同一口径）：phono3py 按含真空的整胞体积归一，
#   面内 κ 被 h⊥/d 稀释。kappa_summary.json 另写 kappa_2d_normalized_*（= 原始 κ × h⊥/d）。
#   vdw = 原子层跨度 + 上下表面原子 vdW 半径（默认）| cell = 不归一 | 数值 = 固定层厚 Å
#   （如 MoS2 体相层间距 6.15）。2D 的 zz 分量没有物理意义。
KAPPA_2D_THICKNESS = vdw
