# step2_kappa 参数（三声子 BTE → 晶格热导率 κ）。
# 只放本步 gen_step2_kappa.py / kappa_driver.py 认识的键。
[params]
# BTE q 网格（原胞基矢序，与 phono3py --mesh 同义）。收敛性要自己验证：
#   3D 建议从 16 16 16 起，24 24 24 通常够；网格越密越慢（≈N^3）。
MESH = 24 24 24
# 2D：on = 把真空轴（最长胞矢量）的网格压成 1；off = 原样。
MESH_2D_VACUUM = on

# 温度扫描 (K)
T_MIN  = 100
T_MAX  = 800
T_STEP = 100

# 同位素散射（phono3py is_isotope）
ISOTOPE = true

# NAC：auto = step1_fit 有 BORN 就开（需要 S3_nac 的介电/Born，本技能数据集通常没有）；
#      on/off 强制。开 NAC 必须同目录有 BORN。
NAC = auto

# BTE 解法：rta（弛豫时间近似，便宜，默认）| lbte（直接解线性化 BTE，准但贵）
BTE_METHOD = rta

# phono3py 单进程 OMP 线程数（= --cpus-per-task；OpenMP-only，别用 mpirun）
P3PY_OMP_THREADS = 48

# ---- 逐壳层/逐截断选三阶截断（2026-09-29，与 kl-dft-cpu S6 同判据）----
#   step1_fit 用 CUT3_SCAN=auto 拟出 cutoff_scan/cut3_<c>/ 后，本步对每档各跑一次完整
#   κ，再按三判据选截断：①残差 1-SE ②逐壳层稳定性（cut<=stable_upper_cut）③κ 平台。
#   选中档的 κ 提到顶层 kappa_summary.json，并写 cutoff_selection.json。
#   auto = 有 ≥2 档就扫描 | off = 只跑标称截断。
CUT3_KAPPA_SCAN    = auto
CUT3_KAPPA_TOL_PCT = 5.0     # 判据③：相邻档 300K 面内 κ 变化上限 (%)
CUT3_CV_1SE_MULT   = 1.0     # 判据①：1-SE 规则的 SE 倍数
CUT3_STABILITY_THR = 0.3     # 判据②：逐壳层 σ/|mean| 阈值
CUT3_PICK          = smallest # smallest=三判据都满足取最小 | largest=平的就取能确定范围内最大
