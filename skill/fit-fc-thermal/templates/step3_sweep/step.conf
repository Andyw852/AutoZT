# step3_sweep -- method sweep: the same dataset fitted by several
# engines/methods at several neighbour shells, kappa on every fit.
#
# One variant = one job in step3_sweep/m-<engine>-<method>-n<N>/ (fanout m-*):
# the S1_fit recipe with the variant's engine/method/cutoff, then the S2_kappa
# BTE on its fc2/fc3, then sweep_result.json.  S4_compare collects every variant
# into step4_compare/fit_compare.json + fit_compare.csv.
#
# Switch on: method_sweep: true in the project tf_*.yaml, or just
#   autozt -tt fit-fc-thermal -p <material> -j S3_sweep start
# Independent of S1_fit/S2_kappa (needs: []); to run only the sweep set
#   run_steps: [3, 4]
[params]

# ===== what to compare ================================================
# all | space-separated  engine[:method,method|all]
#   phono3py : symfc alm            (least squares; alm needs the alm module)
#   pheasy   : OLS LASSO ALASSO RFE-OLS RFE-OLS-TSQR RIDGE ARDR RVM
#   hiphive  : ols ridge lasso ard bayes
# engine alone = its default method (phono3py:symfc, pheasy:ALASSO, hiphive:ridge);
# a bare method name works when it is unique (ALASSO, symfc, ard ...)
# e.g. SWEEP_METHODS = phono3py:symfc pheasy:OLS,LASSO,RIDGE hiphive:ridge
SWEEP_METHODS = all

# Third-order cutoff as "up to the N-th nearest neighbours", the ShengBTE
# thirdorder.py -n convention: for every atom list its distinct neighbour
# distances u1 < u2 < ...; cutoff(N) = max over atoms of (u_N + u_{N+1}) / 2.
# So N here means the same as "fc3 up to the 5th neighbours" in a paper.
#   auto      the largest N whose cutoff fits the supercell safe cutoff
#   5         one shell
#   4 5 6     several (each one is a separate variant for every method)
#   3-6       a range
# N whose cutoff exceeds the supercell safe cutoff are skipped with a warning.
# The N -> cutoff table is printed by the gen and kept in sweep_plan.json.
SWEEP_C3_SHELLS = auto

# fc2 range for pheasy / hiphive: all (whole supercell, safe cutoff for hiphive)
# or a neighbour number N (same convention).  phono3py/symfc fits the full fc2.
SWEEP_C2 = all

# Distances closer than this (A) are one shell.  1e-4 reproduces thirdorder.py;
# raise to ~0.05 to merge the near-degenerate shells of a distorted cell.
SWEEP_SHELL_TOL = 0.0001

# Run the BTE on every fit; and even on fits whose phonons are imaginary
# (off by default: kappa from an unstable fc2 is not meaningful).
SWEEP_KAPPA         = true
SWEEP_KAPPA_IF_IMAG = false

# ===== inherited S1_fit / S2_kappa keys ===============================
# Every key of step1_fit/step.conf and step2_kappa/step.conf is accepted here
# and applies to all variants (the sweep only overrides the engine, the method,
# the cutoffs, and turns the per-variant cutoff scan off).  The usual ones:
FIT_INPUT_DIR = auto
SUPERCELL     =
# Thin/layered primitive cells (e.g. a 2D monolayer): hiphive needs the
# supercell as its cluster-space reference.
HIPHIVE_CELL  =
# BTE mesh: auto (+ convergence) is the rigorous choice; a fixed "n n n" is much
# cheaper for a like-for-like method comparison.
MESH          = auto
# 2D in-plane kappa thickness normalisation (vdw | cell | thickness in A), as S2_kappa
KAPPA_2D_THICKNESS = vdw
T_MIN         = 100
T_MAX         = 800
T_STEP        = 100

CONDA_SH  = /public/home/<user>/miniconda3/etc/profile.d/conda.sh
CONDA_ENV = atomate2_p_a

# ===== resources (optional) ==========================================
# Applies to every variant job.  pheasy RFE-OLS / RFE-OLS-TSQR are the slowest
# (> 30 min for ~1300 free IFCs); hiphive with HIPHIVE_CELL=supercell needs memory.
# [submit]
# cpus_per_task = 48
# time          = 24:00:00
