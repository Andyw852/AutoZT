# step1_fit -- force-constant fitting job (submitted to the compute node).
#
# The gen step writes fit_config.json from these values; the compute node runs
# fc_fit_driver.py prep -> fit -> post and produces
#   fc2.hdf5 (+ fc3.hdf5), shengbte/, fc_fit_summary.json
# Resources (cores / qos / walltime / memory) are overridden with a [submit]
# section at the end of this file.
[params]

# ===== dataset =======================================================
# Where the displacement+force data lives.  Relative paths are resolved
# against the skill directory (.../<material>/fit-fc-thermal/).
#   auto  -- search the usual locations, in this order:
#              ./step4_disp ./step2_disp_force ./step2_disp ./step3_disp
#              ../kl-dft-cpu/step4_disp
#              ../kl-mlff-cpu/step2_disp_force
#              ../kl-mlff-gpu/step2_disp_force
#              ../phonon-dft-cpu/step2_disp
#              ../phonon-mlff-cpu/step2_disp_force
#              ../phonon-mlff-gpu/step2_disp_force
#              .  ..  ../..
# Recognised contents (first match wins): phono3py_params.yaml;
# phono3py_disp.yaml + FORCES_FC3; disp-*/vasprun.xml;
# dataset_disps.npy + dataset_forces.npy; disp_matrix.pkl + force_matrix.pkl.
FIT_INPUT_DIR = auto

# Subtract the residual forces of the un-displaced (equilibrium) supercell from
# every frame.  Needed whenever the reference cell is not perfectly relaxed:
# without it the residual force biases every fitted constant.  Honoured when
# the dataset carries a reference frame (disp-00000/vasprun.xml or a trailing
# zero-displacement frame); ignored otherwise.
SUBTRACT_EQUILIBRIUM = true

# Residual-force gate (eV/A): prep stops when the equilibrium frame's largest
# atomic force exceeds this.  The subtraction above only removes the linear
# term; a reference far from the minimum biases fc2 itself.  0 = off.
EQ_FORCE_MAX = 0.2

# Optional explicit equilibrium forces, shape (natom_super, 3) in a .npy file
# (relative path = inside step1_fit/).  Use it when the dataset has no
# reference frame but you do have one from elsewhere.
EQUILIBRIUM_FORCES_NPY =

# Whether dataset_disps.npy holds Cartesian displacements (cartesian) or the
# absolute fractional coordinates of each rattled configuration (fractional).
# auto (default) inspects the array: absolute fractional coordinates live in
# [0,1) and sit within ~1 A of the ideal SPOSCAR, Cartesian displacements are
# centred on zero.  The equilibrium frame is then located wherever it is (not
# necessarily first/last): the frame closest to the ideal supercell becomes the
# reference and is dropped from training; fractional mode min-image wraps and
# converts with the supercell lattice.
COORDS = auto

# Supercell repetitions for pheasy, e.g. "4 4 4".  Normally inherited from the
# dataset's supercell_matrix; set it only to override that.
SUPERCELL =

# The dataset supercell must keep every point-group operation of the crystal.
# A rhombohedral/hexagonal cell repeated "n n 1" often loses the 3-fold axis:
# every engine then fits a symmetry-broken fc2 (fake imaginary modes inside the
# zone, kappa jumping with the q mesh -- Mn2In2Se5 3x3x1, 2026-10-07).
# strict = stop before fitting | warn = print only | off
SUPERCELL_SYMMETRY = strict

# ===== fitting method(s) =============================================
# FIT_METHODS chooses what is fitted:
#   auto                    FIT_ENGINE + that engine's method key below
#                           (default: pheasy ALASSO)
#   pheasy:RIDGE            one method = switch (a unique bare name works too:
#                           ALASSO, symfc, ard ...; "ridge" is ambiguous)
#   pheasy:OLS,ALASSO hiphive:ridge   several -> all are computed
#   pheasy:all | all        every method of pheasy / of all three engines (13)
# With several methods the FIRST is the primary (step1_fit/ itself: S1 gate,
# S2 headline kappa); the others run serially in the same job under
# step1_fit/methods/<tag>/ and S2_kappa computes kappa for each, plus
# step2_kappa/methods_compare.{json,png,pdf}.  Many methods add up in wall
# time -- set [submit] time accordingly, or use S3_sweep (parallel jobs).
FIT_METHODS = auto

# ===== engine ========================================================
# phono3py : phono3py + symfc/alm least squares.  Accepts finite-displacement
#            (findiff) and random-displacement (rattled) datasets.
# pheasy   : pheasy compressive sensing (LASSO/ALASSO/RFE-OLS/OLS/RIDGE/ARDR/RVM).
#            Random-displacement datasets only.
# hiphive  : hiphive cluster space + linear regression, optional rotational
#            sum-rule projection.  Random-displacement datasets only.
FIT_ENGINE = pheasy

# Highest order to fit: 2 = fc2 only, 3 = fc2 + fc3.
# Thermal-conductivity work needs 3; a quick harmonic check can use 2.
ENABLE_FC = 3

# auto | 2d | 3d -- only affects the imaginary-frequency verdict: a strictly
# 2D material uses the no-NAC minimum (the 3D Coulomb kernel fakes imaginary
# frequencies near Gamma in 2D).  auto inherits DIM from the dataset's
# kl_params.txt / workflow_method.txt, else detects the vacuum axis.
DIM = auto

# ===== shell / third-order cutoff determination =======================
# Ported from kl-dft-cpu S4/S5.  The neighbouring shells of the unit cell are
# enumerated and the cutoffs are taken at the MIDPOINTS between adjacent
# shells (never on a shell distance), then the fit decides how far the data
# can actually determine the fc3:
#   * pheasy  -- every candidate is refitted and a frame bootstrap gives, per
#                shell, the scatter of |Phi^3|; the outermost shell whose
#                sigma/|mean| < CUT3_STABILITY_THR fixes stable_upper_cut.
#   * phono3py / hiphive -- a single-fit per-shell mean |Phi^3| report (no
#                bootstrap, so no stable_upper_cut).
# The result is step1_fit/cutoff_scan.json (+ cutoff_scan/cut3_<c>/fc2,fc3).
# CUT3_CANDIDATES is cheap and always evaluated.  CUT3_SCAN (the extra per-cut
# refits) is ON by default so that S2_kappa can run the BTE at every candidate
# cutoff and pick one by the three kappa criteria (see step2_kappa/step.conf).
#   * pheasy (random displacement) writes cutoff_scan/cut3_<c>/{fc2,fc3}.hdf5
#     and a full cutoff_scan.json (ratio / residual / stable_upper_cut);
#   * phono3py refits fc3 at every candidate into cutoff_scan/cut3_<c>/ (no
#     bootstrap: every candidate counts as determined, S2_kappa picks by the
#     kappa plateau alone);
#   * hiphive keeps the single-fit report (no per-cut dirs yet), so S2_kappa
#     falls back to the nominal cutoff.
# Cost: one extra fit per candidate (~9 for the test cell).  Set off to skip.
CUT3_CANDIDATES = auto    # auto | off | "3.6 4.2 4.8 ..." (explicit, in A)
CUT3_MAX        = 7.0     # largest radius scanned for shells (A)
CUT3_MIN_SHELLS = 2       # skip the midpoint that only contains the nearest shell
CUT3_GAP_TOL    = 0.05    # shell clustering tolerance (A)
CUT3_MIN_GAP    = 0.05    # skip a midpoint in a split double shell (A)
CUT3_SCAN       = auto    # off | auto/on: refit each candidate + bootstrap
CUT3_BOOTSTRAP  = 10      # frame bootstrap per candidate (0 = no statistics)
CUT3_STABILITY_THR = 0.3  # sigma/|mean| < this counts as "determined"

# ===== phono3py engine ===============================================
FC_CALC    = symfc        # symfc | alm
FC3_CUTOFF =              # fc3 cutoff in A.  Never beyond the supercell safe
                          # cutoff (half the shortest supercell height - 0.1 A):
                          # empty or larger -> the gen clamps it to that value.
                          # fc3.hdf5 is written compact (n_prim,N,N,...) + p2s_map.

# ===== pheasy engine =================================================
PHEASY_FIT_METHOD = ALASSO  # OLS|LASSO|ALASSO|RFE-OLS|RFE-OLS-TSQR|RIDGE|ARDR|RVM
                            # ALASSO/LASSO: if the CV alpha lands on the grid edge
                            # the quality gate fails on purpose -> widen
                            # PHEASY_MU_MIN/MU_MAX or add frames
PHEASY_BIN        = pheasy-gpu   # pheasy-gpu (GPU build; CPU build removed)
PHEASY_C2_CUTOFF  =          # fc2 cutoff in A; empty = all interactions
PHEASY_C3_CUTOFF  = 6        # fc3 cutoff in A; empty or > supercell safe cutoff
                             # -> clamped to the safe cutoff by the gen
NULL_SPACE_EPS    = 0.001
PHEASY_RASR       = auto     # auto | BH | H | BHH | none (rotational sum rules)
                             # auto = BHH for a 2D slab (mandatory: the ZA branch
                             # must be quadratic near Gamma), none for a bulk
                             # crystal.  BHH on a bulk cell is not neutral: the
                             # MnIn2Se4 189-atom pheasy OLS fit went from 0.62 %
                             # (none, stable) to 8.9 % (BHH, spurious imaginary
                             # modes at -1.57 THz).
PHEASY_STD        = false    # --std: standardise the training data.  pheasy_fit.sh applies
                             # it by default only for LASSO/ALASSO/RIDGE (STANDARDIZE=true);
                             # OLS / RFE-OLS never get --std there, so false matches OLS.
# safe = only memory/threading/CV-grouping knobs; kl = also reproduce the solver
# settings from submit_fit_pheasy.tpl.  Measured on the local BaS test (250
# atoms, 10 frames, fc2+fc3, OLS): safe -> 1.3% relative error with force
# correlation 0.9999, kl -> 58% / 0.891.  Bisected to PHEASY_OLS_RIDGE=1e-4, so
# leave PHEASY_TUNING = safe unless you have a reason to reproduce the template.
# Two-level sensing matrix for LASSO (pheasy's PHEASY_LASSO_TWOLEVEL).  Empty =
# auto: turned on only when PHEASY_GPU_LASSO_RESIDENT is requested, because that
# backend refuses the dense/CSR matrix pheasy builds for LASSO by default and
# dies with "NotImplementedError: Resident GPU LASSO/ALASSO requires TwoLevelSM
# input" *after* the sensing matrix is materialised.  true also enables the
# [GPU-SM] two-level matvec on the allocated cards (a GPU fit needs it); false
# keeps the dense path and makes the driver drop the resident request loudly.
PHEASY_LASSO_TWOLEVEL =

PHEASY_TUNING     = safe     # safe | kl
PHEASY_OLS_RIDGE  =          # OLS ridge override; empty = pheasy default
PHEASY_OLS_MAXITER =         # OLS LSMR iteration cap; empty = pheasy default 5000
# RFE-OLS-TSQR only: how many features it keeps.  Since the RFE -> RFE-OLS rename
# pheasy's default is aic with n = the force-component rows; bic is the same with
# a heavier penalty; cv reproduces RFE-OLS exactly (grouped CV + 1-SE).  Empty =
# pheasy's default (aic).
PHEASY_TSQR_CRITERION =      # '' | aic | bic | cv
# Alpha grid for the sparse methods.  Leave NMU / MU_MAX / MAX_ITER / TOL
# empty to use the per-method defaults, which reproduce the values the pheasy
# author's own runs use:
#     LASSO / ALASSO    nmu 40, tol 1e-5, max_iter 100000
#     RFE-OLS / RFE-OLS-TSQR nmu 5,  tol 1e-3, max_iter 1000
#     mu_max            0 for ENABLE_FC=2, -5 for ENABLE_FC=3
# A LASSO alpha that lands on the edge of this grid is rejected by the quality
# gate, so widening MU_MIN / MU_MAX is the first thing to try when the fit is
# flagged.
PHEASY_CV         = 5
# How many GPUs the job allocates and how many pheasy splits the two-level
# sparse matvec across.  The gen writes --gres=gpu:N from this (an explicit
# [submit] gres wins) and the driver exports PHEASY_GPU_SM_NGPU=N plus
# PHEASY_GPU_SM_DEVICES=0,1,..,N-1, so the allocation and the solver agree.
# Empty = keep whatever the submit template says.  1..6 is what pheasy's own
# acceptance suite covers.
PHEASY_NGPU       =
# pheasy's resident GPU backend for LASSO/ALASSO (PHEASY_GPU_LASSO_RESIDENT).
# '' = leave the submit template's value; true puts the whole two-level CV on the
# cards (the driver selects the two-level sensing matrix it needs); false clears
# it.  It moves where the matvec runs, not the solver's control flow or its
# arithmetic precision.
PHEASY_GPU_LASSO_RESIDENT =
PHEASY_NMU        =
PHEASY_MU_MIN     = -8
PHEASY_MU_MAX     =
PHEASY_MAX_ITER   =
PHEASY_TOL        =
PHEASY_SEED       = 666666

# ===== hiphive engine ================================================
# The cutoffs define hiphive's cluster space (and therefore its atom list).
# Keep 2 * cutoff inside the dataset supercell, otherwise the dataset does not
# cover the necessary neighbour shells and the fit will refuse to run; values
# above the supercell safe cutoff are clamped to it by the gen.
HIPHIVE_CUTOFF2      = 6.0
HIPHIVE_CUTOFF3      = 6.0
HIPHIVE_FIT_METHOD   = ridge   # ols | ridge | lasso | ard | bayes
HIPHIVE_ALPHA        = 1e-10   # regularisation for ridge / lasso
HIPHIVE_SYMPREC      = 1e-5
HIPHIVE_ENFORCE_ASR  = true    # project Huang / Born-Huang sum rules
HIPHIVE_N_CONFIGS    = 0       # 0 = use every frame, else a subsample
# hiphive 参考胞：留空 = 原胞；supercell = 数据集超胞。原胞最小周期宽度 < 2*cutoff
# 时（尖锐/层状原胞，如 7 原子菱方胞宽 3.5 A）原胞建不起 cluster space，改 supercell。
HIPHIVE_CELL         =

# ===== export and gate ===============================================
EXPORT_SHENGBTE = true    # also write shengbte/FORCE_CONSTANTS_2ND / _3RD + POSCAR + CONTROL
                          # (2ND = full supercell, natoms*prod(scell) -- that is the
                          #  ShengBTE format; 3RD/POSCAR/CONTROL = unit cell)
SHENGBTE_NGRID  = auto    # CONTROL ngrid: auto (40 A rule) | length in A | "n n n"
SHENGBTE_T      = 300     # CONTROL temperature: "300" or "T_min T_max T_step"
EXPORT_KL_BUNDLE = true   # also write kl_bundle/ (fc2/fc3 + shengbte + summary)
                          # for kl-dft-cpu S5_fc cross-cluster import (FC_IMPORT_DIR)
FC3_LOAD_GB_LIMIT = 8.0   # skip materialising fc3 above this (ShengBTE/RMSE)
IMAG_THR        = 0.10    # min frequency below -IMAG_THR THz counts as unstable
IMAG_MESH_LENGTH = 100    # 3D gate q mesh as a length (A); the full mesh is evaluated
                          # (no symmetry reduction).  60 missed the zone-interior modes
FC2_SYM_TOL     = 1e-3    # gate fails when symmetry-equivalent q points differ by more
                          # than this (THz): the fc2 breaks the crystal symmetry
FIT_RMSE_FRAMES = 10      # frames for the force residual (RMSE in
                          # fc_fit_summary.json, and per cutoff in
                          # cutoff_scan.json -> S2's RMSE panel); 0 = off.
                          # Needs hiphive in the job env (else skipped).

# ===== environment ===================================================
# Conda (or venv) used inside the job.  The template activates
# {{CONDA_ENV}}/bin/activate when that exists, else sources CONDA_SH.
CONDA_SH  = /public/home/<user>/miniconda3/etc/profile.d/conda.sh
CONDA_ENV = atomate2_p_a

# ===== resources (optional) ==========================================
# Every key here overrides the matching #SBATCH line of submit.sh.
# pheasy RFE-OLS/OLS want many cores; hiphive wants memory for its design matrix;
# a big fc3 wants both.
# [submit]
# cpus_per_task = 96
# mem           = 256G
# qos           = premium
# time          = 48:00:00
