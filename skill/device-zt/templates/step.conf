# =============================================================================
# device-zt 技能默认参数（三层合并：本文件 -> 项目 templates/ -> 项目 step.conf）
# 改参数：autozt -tt device-zt -p <材料> -j <步骤> conf --set params.KEY=值
# 注意：本文件是"共享模板"（template_layout: shared），不要写 STEP=。
# =============================================================================
[params]
# ---- 器件几何/热边界 ----
DEVICE_NAME       = device          # 仅用于出图/报告标签
CHANNEL_MATERIAL  = MoS2            # 沟道材料（查 device_materials.json）
# CHANNEL_THICKNESS = 6.7177e-10     # 可选：显式覆盖沟道厚度(m)；不设则用上游 thickness_d_A 或材料库
# TBC_OVERRIDE      = 1.4e7          # 可选：显式覆盖界面热导 G (W/m^2K)
OXIDE_MATERIAL    = SiO2
OXIDE_THICKNESS   = 300e-9
SUBSTRATE_MATERIAL = Si
L_CHANNEL         = 200e-9          # 沟道长度 (m)，沿 x
W_DEVICE          = 1e-6            # 器件宽度 (m)，用于折算总功率
T_AMB             = 300.0           # 环境/热沉温度 (K)
CONTACT_BC        = sink            # sink=接触恒温；insulator=接触绝热

# ---- 晶格热导来源（同 device-thermal）----
KAPPA_SOURCE      = auto            # auto/upstream=优先上游 kl 实测；literature=只用材料库
UPSTREAM_SKILL    = kl-dft-cpu
UPSTREAM_STEP     = step6_kappa

# ---- 电学输入（ke-dft-cpu 的 transport.json）----
KE_UPSTREAM_SKILL = ke-dft-cpu      # 电子输运上游技能
KE_UPSTREAM_STEP  = ""              # 空=自动依次找 step8_amset / step8.4_amset2d / step8.1_boltztrap
DOPING_CM3        = 1e20            # signed 掺杂 (cm^-3)；**负=n型电子、正=p型空穴**
                                    # （与 ke-dft-cpu/step8_amset 的约定一致）。就近选输运曲线
                                    # 注意：这是【3D 密度】，面密度 n_2D = n_3D x h_perp。
                                    # 1e20 cm^-3 是 MoS2 的 ZT 最优档（p 型，S~+114 uV/K）；
                                    # 1e21 是重掺极限，S 塌到几 uV/K、ZT 归零。
T_REF             = 300.0           # 参考温度（仅用于 S1 报告，自洽用 T_eff）
INPLANE_MODE      = avg             # avg=(xx+yy)/2 | xx
# SIGMA_T_CONV_M  = 1.998e-9        # 可选：显式覆盖面电导口径厚度(m)。空=用 2d_correction.json 的 cell_c_A
                                    # 说明：ke 的 sigma/kappa_e 是【含真空超胞口径】，
                                    # 面电导 G_s = sigma * h_perp（等价于 sigma_2D * d）。

# ---- 电驱动与自洽 ----
V_BIAS            = 0.1             # 工作偏压 (V)，S2 在该点做自洽
V_SWEEP_MIN       = 0.0             # I-V / P-V 扫描范围
V_SWEEP_MAX       = 0.5
V_SWEEP_N         = 6
SC_MAXIT          = 40              # 自洽最大迭代
SC_TOL_K          = 0.05            # 自洽收敛判据 (K)
SC_RELAX          = 0.5             # 温度更新阻尼 (0~1)

# ---- 接触电阻与可靠性上限 ----
R_CONTACT_OHM     = 0.0             # 接触电阻（串联，ohm）；0=理想接触
                                    # 只有沟道体内耗散进温度场；接触耗散留在接触处
                                    # （CONTACT_BC=sink 时接触即热沉，那部分热直接进热沉）
DT_LIMIT_K        = 100.0           # 温升上限判据 (K)：扫描里超过就标红
T_LIMIT_K         = 450.0           # 沟道绝对温度上限判据 (K)

# ---- 数值 ----
N_GRID_X          = 41              # 沿沟道 x 网格数
N_GRID_SUB        = 60              # 氧化层 y 网格数（沟道层固定 2 格）
SOR_OMEGA         = 1.7
SOR_TOL           = 1e-8
SOR_MAXIT         = 200000
