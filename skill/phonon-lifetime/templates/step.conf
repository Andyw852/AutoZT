# =============================================================================
# phonon-lifetime 技能默认参数（template_layout: shared，全技能共用一份）
# 改参数：autozt -tt phonon-lifetime -p <材料> -j S1_lifetime conf --set params.KEY=值
# 注意：shared 布局不要写 STEP=，否则 STEP 与步骤名不符会报错。
# =============================================================================
[params]
# ---- 数据来源 ----
SOURCE          = auto            # auto | kappa_hdf5 | upstream | fc
# KAPPA_HDF5    = /path/kappa-m151515.hdf5   # 显式指定，优先级最高
UPSTREAM_SKILL  = kl-dft-cpu      # 上游技能目录（kl-mlff-cpu / kl-mlff-gpu 也可）
UPSTREAM_STEP   = step6_kappa     # 上游 kappa-m*.hdf5 所在步骤

# ---- 分析口径 ----
# TEMPERATURES  = 300 600          # 要分析的温度；留空=全部
FOCUS_T         = 300.0           # 重点温度（沿 q 图 / 报告对照）
IMAG_THR        = 0.10            # THz，低于此频率的模当作数值零模排除
# ACOUSTIC_FMAX = 2.0             # THz，声学支频率上限；留空=自动（最低 3 支中位频率 x2）
OMEGA_TAU_THR   = 1.0             # omega*tau < 该值 计为过阻尼/强散射
FMAX_PLOT       = 20.0            # 出图频率上限 THz
MAX_PLOT_T      = 8               # 最多画几条温度曲线
MAKE_PLOT       = true
# 寿命是否含同位素散射 gamma_isotope：true=与 phono3py kappa 一致（默认）；
# false=只保留三声子 gamma（寿命会偏长，Si 300K 中位约 +19%）
INCLUDE_ISOTOPE = true

# ---- 可选：沿指定 q 方向出 tau-q 图（论文 Γ-A 那类），如 "0 0 1" ----
# Q_DIRECTION        = 0 0 1
# Q_DIRECTION_LABEL  = Gamma-A

# ---- 可选：没有上游 kappa hdf5 时，从 fc2/fc3 现跑 phono3py ----
RUN_PHONO3PY    = false
PHONO3PY_MESH   = 15 15 15
PHONO3PY_TS     = 300
PHONO3PY_CMD    = phono3py-load
PHONO3PY_TIMEOUT = 7200

# ---- 环境（正常由 setting/<集群>.yaml 的 conda_sh/conda_env 自动注入，一般不用改）----
# CONDA_SH  = /public/home/.../miniconda3/etc/profile.d/conda.sh
# CONDA_ENV = atomate2_p_a
