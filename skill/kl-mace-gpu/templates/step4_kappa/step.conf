# step4_kappa 参数（BTE 求解）。
[params]
MESH_OVERRIDE =          # 空 = 用 step2 写进 klmace_params 的 MESH
MESH_SCAN     =          # 分号分隔的多套网格做收敛测试，如 "16 16 16; 20 20 20; 24 24 24"
                         # DFT 路线做不起、审稿人又必问的一条，在这条链上几乎白送
T_MIN         = 100
T_MAX         = 800
T_STEP        = 100
ISOTOPE       = true     # 同位素散射（自然丰度）
BTE           = rta      # rta = --br（默认）；lbte = --lbte 直接解，内存 O(N_mode^2)
EXTRA_ARGS    =          # 原样附加给 phono3py-load，如 "--boundary-mfp 1e6"

# ---- 求解器：phono3py（默认）| shengbte（三声子 BTE，3090 可用 GPU 版加速）----
SOLVER        = phono3py
# shengbte 专属（phono3py 忽略）
SCALEBROAD    = 1.0      # shengbte 高斯展宽系数（=ShengBTE 默认；0.1 更快但会漏过程）
# SHENGBTE_EXE 按集群填绝对路径：
#   jzzn = /public/home/wangchao/software/sousaw-shengbte-aocl/ShengBTE
#   3090 = /home/wangchaoyue852/software/taskflow/shengbte-gpu/ShengBTE（GPU fork）
SHENGBTE_EXE  = ShengBTE

# ---- ShengBTE 的并行布局 ----
# ★ GPU 路线（setting/3090/templates/submit_shengbte_klm.tpl）用的是 **GPU fork**，
#   设计就是 **1 MPI rank 绑 1 张 GPU**（--gres=gpu:1 --ntasks-per-node=1），
#   所以那份模板里的 ntasks=1 是对的，不要套用下面的 CPU 布局参数。
#   下面三个键只对 CPU 模板（setting/jzzn/...）有意义：
#     jzzn CPU：一个 MPI rank 占一个 NUMA 域。192 核 = 24 域 x **8 核**（不是 16），
#     96 核 -> 12 rank x 8 线程。写死 ntasks=1 会退化成串行（实测 11.8 h 零产物）。
SHENGBTE_TOTAL_CORES    = 96
SHENGBTE_CORES_PER_NUMA = 8
# SHENGBTE_NTASKS = 12

[submit]
# nodes           = 1
# ntasks_per_node = 48
# time            = 24:00:00
