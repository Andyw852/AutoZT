<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="9" refX="10" refY="4.5" orient="auto">
    <path d="M0,0 L12,4.5 L0,9 Z" fill="#334454"/>
  </marker>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#1d2733}
    .head{font:700 25px Arial,sans-serif;fill:#1d2733}
    .body{font:400 20px Arial,sans-serif;fill:#24313a}
    .small{font:400 17px Arial,sans-serif;fill:#526171}
    .tiny{font:400 15px Arial,sans-serif;fill:#526171}
    .panel{fill:#f7f9fb;stroke:#cbd5df;stroke-width:2}
    .white{fill:#fff;stroke:#cbd5df;stroke-width:2}
    .blue{fill:#eaf1fb;stroke:#2f5fa7;stroke-width:2}
    .green{fill:#e9f4ef;stroke:#238266;stroke-width:2}
    .orange{fill:#fcf2e5;stroke:#b8660f;stroke-width:2}
    .purple{fill:#f0ecfa;stroke:#6650a4;stroke-width:2}
    .dark{fill:#1d2733;stroke:#1d2733;stroke-width:2}
    .label{font:700 21px Arial,sans-serif;fill:#fff}
    .light{font:400 17px Arial,sans-serif;fill:#d9e3eb}
    .accent{font:700 18px Arial,sans-serif;fill:#238266}
  </style>
</defs>
<rect width="1800" height="820" fill="#fff"/>

<text x="38" y="54" class="title">c</text>
<text x="83" y="54" class="title">AutoZT: a scientific workflow engine with AI-agent interfaces</text>
<text x="83" y="84" class="small">Standardized, auditable access to 2D thermoelectric calculations through MCP and CLI</text>

<!-- user request -->
<rect x="45" y="220" width="245" height="225" rx="14" class="white"/>
<text x="167" y="260" text-anchor="middle" class="head">Research request</text>
<text x="167" y="302" text-anchor="middle" class="body">POSCAR / material</text>
<text x="167" y="336" text-anchor="middle" class="body">zT target</text>
<text x="167" y="370" text-anchor="middle" class="body">T and carrier grids</text>
<text x="167" y="404" text-anchor="middle" class="small">2D thickness convention</text>

<path d="M295 332 H350" fill="none" stroke="#334454" stroke-width="3" marker-end="url(#arrow)"/>

<!-- core engine -->
<rect x="365" y="145" width="745" height="465" rx="16" class="dark"/>
<text x="737" y="192" text-anchor="middle" class="label">AutoZT scientific workflow engine</text>
<text x="737" y="222" text-anchor="middle" class="light">Deterministic execution remains inside AutoZT</text>

<rect x="405" y="258" width="205" height="110" rx="10" class="blue"/>
<text x="507" y="296" text-anchor="middle" class="head">Skill registry</text>
<text x="507" y="327" text-anchor="middle" class="small">VASP / MACE / zT</text>
<text x="507" y="350" text-anchor="middle" class="tiny">contracts · steps · checks</text>

<rect x="635" y="258" width="205" height="110" rx="10" class="green"/>
<text x="737" y="296" text-anchor="middle" class="head">Workflow state</text>
<text x="737" y="327" text-anchor="middle" class="small">DAG · dependencies</text>
<text x="737" y="350" text-anchor="middle" class="tiny">queue · retry · monitor</text>

<rect x="865" y="258" width="205" height="110" rx="10" class="orange"/>
<text x="967" y="296" text-anchor="middle" class="head">Scientific checks</text>
<text x="967" y="327" text-anchor="middle" class="small">units · convergence</text>
<text x="967" y="350" text-anchor="middle" class="tiny">2D thickness · provenance</text>

<path d="M610 313 H630 M840 313 H860" fill="none" stroke="#d9e3eb" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="405" y="415" width="665" height="135" rx="10" fill="#273746" stroke="#8da2b4" stroke-width="2"/>
<text x="737" y="455" text-anchor="middle" class="label">Backends and artifacts</text>
<text x="737" y="488" text-anchor="middle" class="light">VASP · MACE · phonons · transport · HPC clusters</text>
<text x="737" y="520" text-anchor="middle" class="light">jobs · outputs · diagnostics · audit records</text>

<!-- interfaces -->
<path d="M1115 255 H1180" fill="none" stroke="#334454" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1115 500 H1180" fill="none" stroke="#334454" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="1195" y="150" width="265" height="210" rx="14" class="purple"/>
<text x="1327" y="192" text-anchor="middle" class="head">MCP interface</text>
<text x="1327" y="230" text-anchor="middle" class="body">tools · resources · prompts</text>
<text x="1327" y="260" text-anchor="middle" class="small">plan · inspect · preflight</text>
<text x="1327" y="287" text-anchor="middle" class="small">results · skill files · workflow guidance</text>
<text x="1327" y="322" text-anchor="middle" class="tiny">stdio / JSON-RPC</text>

<rect x="1195" y="410" width="265" height="180" rx="14" class="green"/>
<text x="1327" y="452" text-anchor="middle" class="head">Agent CLI</text>
<text x="1327" y="490" text-anchor="middle" class="body">JSON request / response</text>
<text x="1327" y="520" text-anchor="middle" class="small">shell · Python · CI</text>
<text x="1327" y="555" text-anchor="middle" class="tiny">same protocol and gateway</text>

<!-- agent -->
<path d="M1470 255 H1530" fill="none" stroke="#334454" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1470 500 H1530" fill="none" stroke="#334454" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1545" y="200" width="210" height="350" rx="14" class="white"/>
<text x="1650" y="248" text-anchor="middle" class="head">LLM agent</text>
<text x="1650" y="286" text-anchor="middle" class="small">discover skill</text>
<text x="1650" y="316" text-anchor="middle" class="small">inspect evidence</text>
<text x="1650" y="346" text-anchor="middle" class="small">review plan</text>
<text x="1650" y="376" text-anchor="middle" class="small">request action</text>
<rect x="1580" y="410" width="140" height="82" rx="10" class="orange"/>
<text x="1650" y="442" text-anchor="middle" class="head">act gate</text>
<text x="1650" y="468" text-anchor="middle" class="tiny">explicit execution</text>

<!-- return outputs -->
<path d="M1540 575 H1500 V690 H1130" fill="none" stroke="#a3294a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="365" y="650" width="765" height="105" rx="14" class="white"/>
<text x="747" y="690" text-anchor="middle" class="head">Auditable scientific outputs</text>
<text x="747" y="723" text-anchor="middle" class="body">zT(T,n) · S · σ · κe · κL · reports · provenance</text>
<text x="747" y="746" text-anchor="middle" class="tiny">The LLM supervises decisions; physical criteria and execution stay deterministic.</text>

<text x="45" y="795" class="accent">MCP and CLI are interchangeable access layers, not separate workflow engines.</text>
</svg>
