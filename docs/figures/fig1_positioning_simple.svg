<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fff"/>

  <!-- (a) -->
  <text x="20" y="30" font-size="14" font-weight="bold" fill="#8c2f2f">(a) agency-first</text>
  <text x="20" y="48" font-size="11" fill="#8c2f2f">LLM decides everything</text>
  <g>
    <rect x="20" y="66" width="180" height="44" rx="6" fill="#f7dede" stroke="#b56565"/>
    <text x="110" y="93" text-anchor="middle" font-size="12.5">LLM planner</text>
    <rect x="230" y="66" width="180" height="44" rx="6" fill="#f2e6d8" stroke="#b59b7a"/>
    <text x="320" y="93" text-anchor="middle" font-size="12.5">tools / DFT</text>
    <line x1="202" y1="88" x2="226" y2="88" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  </g>
  <text x="20" y="134" font-size="11.5" fill="#6b3535">tokens per decision &#183; trace not replayable</text>

  <!-- (b) -->
  <text x="20" y="186" font-size="14" font-weight="bold" fill="#1a5c33">(b) determinism-first (PhonoAgent)</text>
  <text x="20" y="204" font-size="11" fill="#1a5c33">criteria decide, agents supervise</text>
  <g>
    <rect x="20" y="222" width="150" height="46" rx="6" fill="#d9ecdf" stroke="#4f8a63" stroke-width="1.5"/>
    <text x="95" y="243" text-anchor="middle" font-size="11.5" font-weight="bold">criteria engine</text>
    <text x="95" y="259" text-anchor="middle" font-size="10.5">converged / &#957;&lt;0</text>

    <rect x="188" y="222" width="150" height="46" rx="6" fill="#cfe6d6" stroke="#4f8a63" stroke-width="1.5"/>
    <text x="263" y="243" text-anchor="middle" font-size="11.5" font-weight="bold">gate: act/approve</text>
    <text x="263" y="259" text-anchor="middle" font-size="10.5">risk &#183; approval &#183; audit</text>

    <rect x="356" y="222" width="150" height="46" rx="6" fill="#e6eef7" stroke="#7d9dbf"/>
    <text x="431" y="243" text-anchor="middle" font-size="11.5" font-weight="bold">clusters</text>
    <text x="431" y="259" text-anchor="middle" font-size="10.5">SLURM + bare GPU</text>

    <rect x="524" y="222" width="150" height="46" rx="6" fill="#e8f2ea" stroke="#4f8a63"/>
    <text x="599" y="243" text-anchor="middle" font-size="11.5" font-weight="bold">archive</text>
    <text x="599" y="259" text-anchor="middle" font-size="10.5">sha256 &#183; replayable</text>

    <line x1="172" y1="245" x2="186" y2="245" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="340" y1="245" x2="354" y2="245" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="508" y1="245" x2="522" y2="245" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  </g>
  <text x="560" y="290" font-size="11.5" fill="#1a5c33">0 tokens in steady state &#183; hash-stable</text>

  <!-- bridge -->
  <path d="M110,112 C110,170 263,180 263,220" stroke="#777" stroke-width="1.4"
        fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="150" y="168" font-size="11" fill="#666">planner may drive the gate (MCP)</text>
</svg>
