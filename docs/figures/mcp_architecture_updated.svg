<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060">
<rect width="1800" height="1060" fill="#fcfcfa"/>
<style>text{font-family:Arial,sans-serif;fill:#24313a} .h{font-weight:700;font-size:36px} .title{font-weight:700;font-size:26px} .body{font-size:20px} .small{font-size:17px} .box{fill:#f4f6f5;stroke:#d5dce0;stroke-width:3} .blue{fill:#eaf0f5;stroke:#4c78a8;stroke-width:3} .purple{fill:#f1eff4;stroke:#7a6f9b;stroke-width:3} .gold{fill:#f7f0e3;stroke:#c7943d;stroke-width:3} .green{fill:#e8f1ef;stroke:#4c918f;stroke-width:3} .red{fill:#f6ece9;stroke:#c66355;stroke-width:3}</style>
<text x="38" y="58" class="h">c  LLM operates AutoZT through a stable MCP control plane</text>
<rect x="32" y="88" width="1736" height="930" rx="24" class="box"/>
<rect x="650" y="124" width="500" height="84" rx="18" class="purple"/>
<text x="900" y="159" text-anchor="middle" class="title">Any MCP client / LLM</text><text x="900" y="190" text-anchor="middle" class="body">goal · policy · evidence</text>
<path d="M900 208v42" stroke="#7a6f9b" stroke-width="5" marker-end="url(#a)"/>
<rect x="130" y="270" width="1540" height="178" rx="20" class="purple"/>
<text x="900" y="307" text-anchor="middle" class="title">AutoZT MCP server · generic verbs (stable surface)</text>
<rect x="170" y="335" width="330" height="72" rx="14" class="blue"/><text x="335" y="365" text-anchor="middle" class="title">READ</text><text x="335" y="393" text-anchor="middle" class="small">list · summary · status · schema · probe</text>
<rect x="545" y="335" width="330" height="72" rx="14" class="green"/><text x="710" y="365" text-anchor="middle" class="title">MUTATE</text><text x="710" y="393" text-anchor="middle" class="small">start · retry · fetch · advance</text>
<rect x="920" y="335" width="330" height="72" rx="14" class="gold"/><text x="1085" y="365" text-anchor="middle" class="title">CONTRACT</text><text x="1085" y="393" text-anchor="middle" class="small">describe_skill(tt) · resources</text>
<rect x="1295" y="335" width="330" height="72" rx="14" class="red"/><text x="1460" y="365" text-anchor="middle" class="title">DESTRUCTIVE</text><text x="1460" y="393" text-anchor="middle" class="small">stop · rerun · clean → approval</text>
<path d="M900 448v45" stroke="#66727c" stroke-width="5" marker-end="url(#a)"/>
<rect x="130" y="495" width="1540" height="155" rx="20" fill="#fff" stroke="#344a5a" stroke-width="3"/>
<text x="900" y="535" text-anchor="middle" class="title">Skill capability registry (dynamic, not a tool per skill)</text>
<text x="220" y="581" class="body">skill.yaml → io_schema · flow/DAG · checks · corrections · outputs</text>
<text x="220" y="616" class="body">README/resources → methodology and acceptance criteria; new skills change the registry, not MCP tools</text>
<path d="M900 650v45" stroke="#344a5a" stroke-width="5" marker-end="url(#a)"/>
<rect x="130" y="697" width="1540" height="120" rx="20" fill="#fff" stroke="#344a5a" stroke-width="3"/>
<text x="900" y="738" text-anchor="middle" class="title">Risk gateway + audit</text>
<text x="900" y="775" text-anchor="middle" class="body">read runs directly · mutate is policy/audit controlled · destructive requires human approval</text>
<path d="M900 817v45" stroke="#344a5a" stroke-width="5" marker-end="url(#a)"/>
<rect x="130" y="864" width="1540" height="105" rx="20" fill="#fff" stroke="#344a5a" stroke-width="3"/>
<text x="900" y="907" text-anchor="middle" class="title">AutoZT CLI → local cache / CPU cluster / GPU cluster</text><text x="900" y="942" text-anchor="middle" class="body">state evidence returns to the LLM: summary --diff · status · probe · exit code</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66727c"/></marker></defs>
</svg>
