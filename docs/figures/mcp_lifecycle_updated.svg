<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<rect width="1800" height="1120" fill="#fcfcfa"/>
<style>text{font-family:Arial,sans-serif;fill:#24313a}.h{font-weight:700;font-size:36px}.t{font-weight:700;font-size:25px}.b{font-size:19px}.s{font-size:16px}.panel{fill:#f4f6f5;stroke:#d5dce0;stroke-width:3}.read{fill:#eaf0f5;stroke:#4c78a8;stroke-width:3}.contract{fill:#f1eff4;stroke:#7a6f9b;stroke-width:3}.ok{fill:#e8f1ef;stroke:#4c918f;stroke-width:3}.warn{fill:#f7f0e3;stroke:#c7943d;stroke-width:3}.fail{fill:#f6ece9;stroke:#c66355;stroke-width:3}</style>
<text x="38" y="58" class="h">c  Skill-aware step life cycle and evidence-based LLM control</text>
<rect x="30" y="88" width="1740" height="990" rx="24" class="panel"/>
<rect x="105" y="125" width="400" height="100" rx="18" class="contract"/><text x="305" y="164" text-anchor="middle" class="t">1. Discover capability</text><text x="305" y="196" text-anchor="middle" class="b">list_skills → describe_skill(tt)</text>
<rect x="565" y="125" width="400" height="100" rx="18" class="read"/><text x="765" y="164" text-anchor="middle" class="t">2. Inspect evidence</text><text x="765" y="196" text-anchor="middle" class="b">summary → status → probe (when needed)</text>
<rect x="1025" y="125" width="400" height="100" rx="18" class="ok"/><text x="1225" y="164" text-anchor="middle" class="t">3. Plan against contract</text><text x="1225" y="196" text-anchor="middle" class="b">I/O · DAG · checks · corrections</text>
<path d="M505 175h55M965 175h55" stroke="#66727c" stroke-width="4" marker-end="url(#a)"/>
<text x="95" y="298" class="t">AutoZT state machine</text>
<g text-anchor="middle"><rect x="95" y="345" width="180" height="78" rx="39" class="panel"/><text x="185" y="379" class="t">WAIT</text><text x="185" y="405" class="s">blocked</text><rect x="340" y="345" width="180" height="78" rx="39" class="panel"/><text x="430" y="379" class="t">PREP</text><text x="430" y="405" class="s">generate</text><rect x="585" y="345" width="180" height="78" rx="39" class="warn"/><text x="675" y="379" class="t">TODO</text><text x="675" y="405" class="s">ready</text><rect x="830" y="345" width="180" height="78" rx="39" class="read"/><text x="920" y="379" class="t">PD</text><text x="920" y="405" class="s">queued</text><rect x="1075" y="345" width="180" height="78" rx="39" class="read"/><text x="1165" y="379" class="t">R</text><text x="1165" y="405" class="s">running</text><rect x="1320" y="345" width="180" height="78" rx="39" class="panel"/><text x="1410" y="379" class="t">CHECK</text><text x="1410" y="405" class="s">acceptance</text><rect x="1565" y="345" width="140" height="78" rx="39" class="ok"/><text x="1635" y="390" class="t">OK</text></g>
<path d="M275 384h60m185 0h60m185 0h60m185 0h60m185 0h60m185 0h60" stroke="#344a5a" stroke-width="4" marker-end="url(#a)"/>
<rect x="670" y="485" width="480" height="88" rx="16" class="warn"/><text x="910" y="521" text-anchor="middle" class="t">run_ready_steps / start_step</text><text x="910" y="551" text-anchor="middle" class="b">DAG dependencies and max_jobs throttle</text><path d="M910 485v-45" stroke="#c7943d" stroke-width="4" marker-end="url(#a)"/>
<rect x="1130" y="625" width="430" height="92" rx="16" class="fail"/><text x="1345" y="663" text-anchor="middle" class="t">FAIL: evidence → correction policy</text><text x="1345" y="693" text-anchor="middle" class="b">prepare_step keeps products; rebuild needs approval</text><path d="M1410 423v196" stroke="#c66355" stroke-width="4" marker-end="url(#a)"/>
<rect x="205" y="625" width="620" height="92" rx="16" class="contract"/><text x="515" y="663" text-anchor="middle" class="t">Dynamic skill contract</text><text x="515" y="693" text-anchor="middle" class="b">new/changed skills update skill.yaml, never the MCP verb set</text>
<rect x="160" y="795" width="1480" height="170" rx="20" fill="#fff" stroke="#344a5a" stroke-width="3"/><text x="900" y="840" text-anchor="middle" class="t">Evidence feedback loop</text><text x="900" y="875" text-anchor="middle" class="b">summary --diff supplies state transitions; probe distinguishes relaxing / queued / stuck / crashed / done</text><text x="900" y="915" text-anchor="middle" class="b">LLM reports evidence and requests approval before destructive actions; gateway records every action</text>
<path d="M1635 423v300H1600" stroke="#4c918f" stroke-width="4"/><path d="M1600 723v45H450v-45" fill="none" stroke="#4c918f" stroke-width="4" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66727c"/></marker></defs>
</svg>
