site_name: AutoZT
site_description: Multi-material, multi-step, multi-cluster orchestration for VASP/MACE phonon and force-constant workflows
repo_url: https://github.com/Andyw852/AutoZT
theme:
  name: material
  features: [navigation.sections, content.code.copy]
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Configuring clusters: CONFIGURING.md
  - CLI reference: cli.md
  - Skills: skills.md
  - MCP interface: mcp.md
  - Releasing: RELEASING.md
  - Acceptance checklist: ACCEPTANCE.md
  - Evaluation: EVALUATION.md
  - Translating messages: I18N.md
  - Delivery inventory: DELIVERY.md
  - Translation backlog: I18N-TODO.md
  - Release notes (1.1.0): RELEASE-NOTES-v1.1.0.md
  - Related work: RELATED-WORK.md
  - Related work (extended): RELATED-WORK-EXTENDED.md
  - Release notes (1.2.0): RELEASE-NOTES-v1.2.0.md
  - Development notes:
      - Code map: dev/CONTEXT.md
      - Isolation rules: dev/DEV-ISOLATION.md
      - Roadmap (v1.0): dev/V1.0-ROADMAP.md
      - Git/ops memo (WSL): dev/WSL-GIT-OPS.md
markdown_extensions: [admonition, tables, toc]
